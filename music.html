<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="音楽🎵">
<meta name="theme-color" content="#0c0c0e">
<title>🎵音楽練習記録</title>
<link rel="manifest" href="music-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0c0c0e; --panel:#131316; --panel2:#1b1b1f; --line:#28282e;
  --txt:#f0f0f2; --dim:#96969e; --faint:#55555e;
  --note:#e01937; --green:#9FE5A8; --gold:#c8a557;
  --shadow:transparent;
  --cond:"Barlow Condensed","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{ height:100%; }
body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  background:var(--bg); color:var(--txt); height:100dvh; overflow:hidden;
  overscroll-behavior:none; }
button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

#app { display:flex; flex-direction:column; height:100dvh; position:relative; }

/* faint giant lightning watermark */
#note-bg { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
#note-bg svg { position:absolute; right:-40px; top:12%; width:70%; height:70%; opacity:.05; }

#header { background:var(--bg); padding:14px 16px 10px;
  padding-top:max(14px,env(safe-area-inset-top)); flex-shrink:0;
  border-bottom:1px solid var(--line); z-index:1; }
#app-title { margin:0; font-size:16px; font-weight:600; letter-spacing:.12em;
  font-family:var(--cond); text-transform:uppercase; color:var(--txt);
  display:flex; align-items:center; justify-content:space-between; line-height:1; gap:8px; }
#app-title>span:first-child { min-width:0; white-space:nowrap; }
#app-title>span:last-child { display:flex; flex-shrink:0; align-items:center; }
#app-title .t-jp { display:block; font-size:10px; color:var(--dim);
  letter-spacing:.38em; margin-top:5px; font-weight:500; }
#app-title .t-red { color:var(--note); }
.mini-btn { background:none; border:1px solid var(--line); color:var(--dim);
  font-size:10px; padding:7px 9px; cursor:pointer; margin-left:4px;
  font-family:var(--cond); letter-spacing:.12em; text-transform:uppercase;
  text-shadow:none; text-decoration:none; display:inline-block; }

#content { flex:1; overflow-y:auto; padding:12px; z-index:1; -webkit-overflow-scrolling:touch; }

#tabbar { display:flex; background:var(--bg); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); flex-shrink:0; z-index:1; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 7px; border:none; background:none; cursor:pointer;
  color:var(--faint); font-weight:500; font-size:10px; white-space:nowrap;
  border-top:2px solid transparent; min-height:52px; letter-spacing:.14em; }
.tab-btn.active { color:var(--txt); font-weight:700; border-top-color:var(--note); }
.tab-ico { font-size:17px; line-height:1; filter:grayscale(1) brightness(1.7); }
.tab-btn:not(.active) .tab-ico { filter:grayscale(1) brightness(.8); }

.card { background:var(--panel); border:1px solid var(--line);
  margin-bottom:12px; padding:12px 14px; }
.card-title { font-size:10px; color:var(--dim); margin:0 0 8px;
  font-family:var(--cond); letter-spacing:.3em; text-transform:uppercase; }

/* Today header card */
#today-line { display:flex; align-items:baseline; justify-content:space-between; }
#today-date { font-size:17px; font-weight:600; font-family:var(--cond); letter-spacing:.12em; }
#today-sub  { font-size:11px; color:var(--dim); letter-spacing:.06em; }
#week-days { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.wd-chip { font-size:10px; padding:3px 9px; border:1px solid var(--line);
  color:var(--faint); background:none; letter-spacing:.1em; }
.wd-chip.on { border-color:var(--note); color:var(--note); background:rgba(224,25,55,.08); }




/* Input panel */
#input-card { border-color:var(--line); border-top:3px solid var(--note); }
#sel-ex-name { font-size:16px; font-weight:600; margin:0 0 12px; color:var(--txt);
  display:flex; justify-content:space-between; align-items:center; letter-spacing:.06em; }
.stepper-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:12px; }
.step-btn { width:52px; min-height:52px; font-size:16px; cursor:pointer;
  background:none; color:var(--txt); border:1px solid var(--line);
  font-family:var(--cond); letter-spacing:.04em; }
.step-btn.small { width:44px; min-height:44px; font-size:12px; color:var(--dim); }
.step-btn:active { background:var(--panel2); }
.step-val { flex:1; text-align:center; font-size:34px; font-weight:600; cursor:pointer;
  line-height:1.05; font-family:var(--cond); }
.step-val small { font-size:12px; color:var(--dim); font-weight:500; letter-spacing:.2em; }
#log-btn { width:100%; min-height:58px; font-size:16px; font-weight:700; cursor:pointer;
  background:var(--note); color:#fff; border:none; letter-spacing:.3em;
  font-family:var(--cond); }
#log-btn:active { opacity:.6; }

/* Today's sets */
.set-row { display:flex; align-items:center; gap:8px; padding:8px 2px;
  border-bottom:1px solid var(--line); font-size:13px; }
.set-row:last-child { border-bottom:none; }
.set-time { color:var(--faint); font-size:12px; width:44px; flex-shrink:0;
  font-family:var(--cond); letter-spacing:.06em; }
.set-main { flex:1; }
.set-del { background:none; border:none; color:var(--faint); font-size:16px;
  cursor:pointer; padding:6px 8px; }
.empty-note { color:var(--faint); font-size:12px; text-align:center; padding:14px 0; }

/* History */
.h-day { margin-bottom:12px; }
.h-day-head { display:flex; justify-content:space-between; align-items:baseline;
  padding:8px 12px; background:transparent; border-bottom:1px solid var(--line); }
.h-day-date { font-weight:600; font-size:15px; font-family:var(--cond); letter-spacing:.1em; }
.h-day-sub { font-size:10px; color:var(--dim); letter-spacing:.08em; }

/* Toast */
#toast { display:none; position:fixed; bottom:calc(76px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%); background:var(--bg); color:var(--txt);
  border:1px solid var(--note); padding:10px 18px; font-size:13px; z-index:50;
  white-space:nowrap; }

/* Lightning flash on record */
#flash { display:none; position:fixed; inset:0; z-index:40; pointer-events:none;
  align-items:center; justify-content:center; }
#flash.on { display:flex; animation:flashbg .45s ease-out; }
#flash .zap { font-size:90px; animation:zappop .45s ease-out;
  filter:grayscale(1) brightness(2); text-shadow:0 0 40px var(--note); }
@keyframes flashbg { 0%{background:rgba(224,25,55,.22)} 100%{background:transparent} }
@keyframes zappop { 0%{transform:scale(.3) rotate(-15deg);opacity:1}
  60%{transform:scale(1.25) rotate(5deg)} 100%{transform:scale(1);opacity:0} }

/* Modal */
.overlay { position:fixed; inset:0; background:rgba(8,8,10,.78); z-index:30;
  display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box { background:var(--panel); border:1px solid var(--line);
  border-top:3px solid var(--note); padding:16px; width:100%; max-width:340px; }
.modal-title { margin:0 0 12px; font-size:14px; color:var(--txt);
  font-family:var(--cond); letter-spacing:.2em; }
.menu-item { display:block; width:100%; text-align:left; background:var(--panel2);
  border:1px solid var(--line); color:var(--txt); padding:14px 12px; font-size:14px;
  cursor:pointer; margin-bottom:10px; text-decoration:none; }
.btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
.btn { padding:10px 16px; font-size:13px; cursor:pointer; border:1px solid var(--line);
  background:none; color:var(--txt); }

/* Item grid */
#item-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.item-btn { padding:13px 8px; font-size:13px; cursor:pointer; text-align:center;
  background:var(--panel); color:var(--txt); border:1px solid var(--line);
  min-height:48px; line-height:1.25; letter-spacing:.04em; }
.item-btn.active { background:rgba(224,25,55,.09); border-color:var(--note); color:var(--txt);
  font-weight:700; }
.item-btn.add { color:var(--faint); border-style:dashed; }
.item-last { display:block; font-size:10px; color:var(--faint); margin-top:3px;
  font-family:var(--cond); letter-spacing:.1em; }
.item-btn.active .item-last { color:var(--note); }
#sel-item-name { font-size:16px; font-weight:600; margin:0 0 12px; color:var(--txt); letter-spacing:.06em; }
.set-min { font-weight:700; font-family:var(--cond); font-size:15px; letter-spacing:.04em; }
#timer-btn { width:100%; min-height:52px; font-size:14px; font-weight:700; cursor:pointer;
  background:none; color:var(--txt); border:1px solid var(--dim);
  letter-spacing:.2em; font-family:var(--cond); margin-bottom:12px; }
#timer-btn.running { background:rgba(224,25,55,.1); color:#fff; border-color:var(--note);
  animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.72} }
/* History (music) */
.h-item { padding:7px 12px; border-bottom:1px solid var(--line); font-size:12px; }
.h-item:last-child { border-bottom:none; }
.h-item-name { font-weight:700; letter-spacing:.04em; }
.h-item-sets { color:var(--dim); margin-top:2px; font-family:var(--cond); letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app">
  <div id="note-bg"><svg viewBox="0 0 120 160" fill="#f0f0f2">
    <ellipse cx="30" cy="130" rx="22" ry="16"/>
    <rect x="44" y="20" width="8" height="112"/>
    <path d="M44 20 L100 8 L100 40 L52 52 L52 32 L92 22 L92 16 L52 26 Z"/>
    <ellipse cx="86" cy="118" rx="22" ry="16" transform="translate(-8 0)"/>
    <rect x="92" y="36" width="8" height="84"/>
  </svg></div>
  <div id="header">
    <p id="app-title">
      <span>MUSIC <span class="t-red">LOG</span><span class="t-jp">音楽練習</span></span>
      <span>
        <a class="mini-btn" href="tracker.html">QUEST</a>
        <a class="mini-btn" href="gym.html">GYM</a>
        <button type="button" class="mini-btn" id="menu-open">設定</button>
      </span>
    </p>
  </div>
  <div id="content"></div>
  <div id="tabbar">
    <button class="tab-btn active" data-tab="today"><span class="tab-ico">🎵</span>きろく</button>
    <button class="tab-btn" data-tab="history"><span class="tab-ico">📜</span>履歴</button>
  </div>
</div>

<div id="toast"></div>
<div id="flash"><span class="zap">🎵</span></div>

<!-- Settings menu -->
<div class="overlay" id="menu-modal" style="display:none">
  <div class="modal-box">
    <h3 class="modal-title">⚙ 設定</h3>
    <button type="button" class="menu-item" id="export-btn">💾 データを書き出す</button>
    <button type="button" class="menu-item" id="import-btn">📂 データを復元する</button>
    <div class="btn-row">
      <button class="btn" id="menu-close">閉じる</button>
    </div>
  </div>
</div>

<script>
// ── 週間クエストの「楽器練習」(cat id: instrument)に連携する ──────────────────
const QUEST_CAT="instrument";

// ── プリセット練習メニュー(＋で自由に追加できる) ─────────────────────────────
const PRESET_ITEMS=["基礎練習","スケール","曲の練習","新しい曲","通し練習"];

// ── 週間クエストと同一の週キー/曜日キー計算 ─────────────────────────────────
const DAY_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
const DAYS_JP  = ["月","火","水","木","金","土","日"];
function getWeekKey(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function dayKeyOf(date){ const d=date.getDay(); return DAY_KEYS[d===0?6:d-1]; }
function dateKeyOf(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,"0"), dd=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

// ── State ─────────────────────────────────────────────────────────────────────
// logs: [{t:ISO文字列, item:メニュー名, min:分}]
let logs   = JSON.parse(localStorage.getItem("mus_logs")||"[]");
let lastMin= JSON.parse(localStorage.getItem("mus_last")||"{}");   // メニュー名 → 分
let custom = JSON.parse(localStorage.getItem("mus_custom")||"[]"); // 追加メニュー
let sel    = localStorage.getItem("mus_sel") || "基礎練習";
let marks  = JSON.parse(localStorage.getItem("mus_marks")||"{}");  // 週クエに自動記入したキー
let timer  = JSON.parse(localStorage.getItem("mus_timer")||"null");// {start:ISO,item} 実行中タイマー
let tab    = "today";
let min    = 30;

function persist(){
  localStorage.setItem("mus_logs",   JSON.stringify(logs));
  localStorage.setItem("mus_last",   JSON.stringify(lastMin));
  localStorage.setItem("mus_custom", JSON.stringify(custom));
  localStorage.setItem("mus_sel",    sel);
  localStorage.setItem("mus_marks",  JSON.stringify(marks));
  localStorage.setItem("mus_timer",  JSON.stringify(timer));
}
function loadDefaults(){ min = lastMin[sel] || 30; }
loadDefaults();

function itemList(){ return [...PRESET_ITEMS, ...custom]; }
function todayLogs(){ const k=dateKeyOf(new Date()); return logs.filter(l=>dateKeyOf(new Date(l.t))===k); }
function totalMin(list){ return list.reduce((a,l)=>a+l.min,0); }
function fmtTime(iso){ const d=new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

// ── 週間クエスト連携 ──────────────────────────────────────────────────────────
// その日の練習ログ合計から wt_records の instrument を自動で「完了」にする。
// 自分で書いた記録(marksに記憶)だけを、ログが全部消えたら取り消す。
function syncQuest(dateObj){
  const wk=getWeekKey(dateObj), dk=dayKeyOf(dateObj);
  const key=wk+"|"+dk+"|"+QUEST_CAT;
  const dayKey=dateKeyOf(dateObj);
  const dayLogs=logs.filter(l=>dateKeyOf(new Date(l.t))===dayKey)
                    .sort((a,b)=>a.t<b.t?-1:1);
  let records;
  try{ records=JSON.parse(localStorage.getItem("wt_records")||"{}"); }catch(e){ records={}; }
  records[wk]=records[wk]||{}; records[wk][dk]=records[wk][dk]||{};
  const entry=records[wk][dk][QUEST_CAT]||{done:false,note:"",duration:"",rating:0};
  if(dayLogs.length){
    entry.done=true;
    entry.duration=String(totalMin(dayLogs));
    // 手書きメモは上書きしない(♪始まり=このアプリが書いたメモだけ更新)
    if(!entry.note || entry.note.startsWith("♪")){
      const head=dayLogs[dayLogs.length-1];
      entry.note="♪"+head.item+" "+head.min+"分"+
        (dayLogs.length>1?` ほか 計${totalMin(dayLogs)}分`:"");
    }
    marks[key]=true;
  }else if(marks[key]){
    entry.done=false; entry.duration="";
    if(entry.note && entry.note.startsWith("♪")) entry.note="";
    delete marks[key];
  }
  records[wk][dk][QUEST_CAT]=entry;
  localStorage.setItem("wt_records", JSON.stringify(records));
}

// ── 記録・削除 ────────────────────────────────────────────────────────────────
function addLog(item, minutes){
  const now=new Date();
  logs.push({t:now.toISOString(), item, min:minutes});
  lastMin[item]=minutes;
  syncQuest(now);
  persist();
  flash();
  showToast("🎵 "+item+" "+minutes+"分 記録!(週クエ反映)");
  render();
}
function delLog(iso){
  const i=logs.findIndex(l=>l.t===iso);
  if(i<0)return;
  const [removed]=logs.splice(i,1);
  syncQuest(new Date(removed.t));
  persist();
  render();
}

// ── タイマー ──────────────────────────────────────────────────────────────────
let tickIv=null;
function timerElapsedSec(){ return timer? Math.floor((Date.now()-new Date(timer.start))/1000) : 0; }
function startTimer(){
  timer={start:new Date().toISOString(), item:sel};
  persist(); render();
}
function stopTimer(){
  if(!timer)return;
  const minutes=Math.max(1, Math.round(timerElapsedSec()/60));
  const item=timer.item;
  timer=null;
  addLog(item, minutes);  // addLog内でpersist+render
}
function updateTimerBtn(){
  const b=document.getElementById("timer-btn");
  if(!b)return;
  if(timer){
    const s=timerElapsedSec();
    const mm=Math.floor(s/60), ss=String(s%60).padStart(2,"0");
    b.textContent=`⏹ 停止して記録 (${timer.item} ${mm}:${ss})`;
    b.classList.add("running");
  }else{
    b.textContent="▶ タイマーで計る";
    b.classList.remove("running");
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.style.display="none",2000);
}
function flash(){
  const f=document.getElementById("flash");
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  setTimeout(()=>f.classList.remove("on"),500);
  if(navigator.vibrate) navigator.vibrate(30);
}
function stepBtn(label, cls, fn){
  const b=el("button","step-btn"+(cls?" "+cls:""),label);
  let tm=null, iv=null;
  const start=e=>{ e.preventDefault(); fn(); tm=setTimeout(()=>{ iv=setInterval(fn,110); },450); };
  const stop=()=>{ clearTimeout(tm); clearInterval(iv); tm=iv=null; };
  b.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
  return b;
}

// ── 画面: きろく ──────────────────────────────────────────────────────────────
function renderToday(root){
  const now=new Date();
  const tl=todayLogs();

  // 今日カード: 日付は自動、今週練習した曜日がチップで光る
  const head=el("div","card");
  const wd=["日","月","火","水","木","金","土"][now.getDay()];
  head.appendChild(el("div","", `<div id="today-line">
    <span id="today-date">${now.getMonth()+1}/${now.getDate()}(${wd})</span>
    <span id="today-sub">今日 ${totalMin(tl)}分 / ${tl.length}回</span>
  </div>`));
  const wk=getWeekKey(now);
  const weekDays=new Set(logs.filter(l=>getWeekKey(new Date(l.t))===wk)
                             .map(l=>dayKeyOf(new Date(l.t))));
  const chips=el("div",""); chips.id="week-days";
  DAY_KEYS.forEach((dk,i)=>{
    chips.appendChild(el("span","wd-chip"+(weekDays.has(dk)?" on":""),
      (weekDays.has(dk)?"♪":"")+DAYS_JP[i]));
  });
  head.appendChild(chips);
  root.appendChild(head);

  // メニューグリッド(前回の分数を小さく表示)
  const grid=el("div"); grid.id="item-grid";
  itemList().forEach(name=>{
    const d=lastMin[name];
    const b=el("button","item-btn"+(name===sel?" active":""),
      esc(name)+(d?`<span class="item-last">前回 ${d}分</span>`:""));
    b.onclick=()=>{ sel=name; loadDefaults(); persist(); render(); };
    grid.appendChild(b);
  });
  const addB=el("button","item-btn add","＋ メニューを追加");
  addB.onclick=()=>{
    const name=prompt("メニュー名(曲名でもOK)");
    if(!name||!name.trim())return;
    const n=name.trim();
    if(itemList().includes(n)){ showToast("もうあるよ"); return; }
    custom.push(n);
    sel=n; loadDefaults(); persist(); render();
  };
  grid.appendChild(addB);
  root.appendChild(grid);

  // 入力パネル
  const card=el("div","card"); card.id="input-card"; card.style.marginTop="12px";
  const title=el("p","",esc(sel));
  title.id="sel-item-name";
  card.appendChild(title);

  // タイマー(押して始めて、止めたら自動で分数記録)
  const tBtn=el("button","");
  tBtn.id="timer-btn";
  tBtn.onclick=()=>{ timer? stopTimer() : startTimer(); };
  card.appendChild(tBtn);

  // 分数: −10 / −5 / 値 / +5 / +10
  const mRow=el("div","stepper-row");
  const mVal=el("div","step-val");
  const updM=()=>{ mVal.innerHTML=min+" <small>分</small>"; };
  mRow.appendChild(stepBtn("-10","small",()=>{min=Math.max(1,min-10);updM();}));
  mRow.appendChild(stepBtn("-5","",()=>{min=Math.max(1,min-5);updM();}));
  mRow.appendChild(mVal);
  mRow.appendChild(stepBtn("+5","",()=>{min+=5;updM();}));
  mRow.appendChild(stepBtn("+10","small",()=>{min+=10;updM();}));
  mVal.onclick=()=>{
    const v=prompt("練習時間(分)",String(min));
    if(v===null)return;
    const n=parseInt(v);
    if(!isNaN(n)&&n>=1){ min=n; updM(); }
  };
  updM();
  card.appendChild(mRow);

  const logB=el("button","", "🎵 記録する");
  logB.id="log-btn";
  logB.onclick=()=>addLog(sel,min);
  card.appendChild(logB);
  root.appendChild(card);

  // 今日のログ一覧
  const list=el("div","card");
  list.appendChild(el("p","card-title","📋 今日の練習(時刻は自動記録)"));
  if(!tl.length){
    list.appendChild(el("div","empty-note","まだナシ。タイマーを押すか🎵を押すだけで日付も時刻も勝手に付くよ"));
  }else{
    [...tl].reverse().forEach(l=>{
      const row=el("div","set-row");
      row.appendChild(el("span","set-time",fmtTime(l.t)));
      row.appendChild(el("span","set-main",
        `${esc(l.item)} <span class="set-min">${l.min}分</span>`));
      const del=el("button","set-del","✕");
      del.onclick=()=>{ if(confirm("この記録を消す?")) delLog(l.t); };
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  root.appendChild(list);
  updateTimerBtn();
}

// ── 画面: 履歴 ────────────────────────────────────────────────────────────────
function renderHistory(root){
  if(!logs.length){
    const c=el("div","card");
    c.appendChild(el("div","empty-note","履歴はまだナシ。今日から始めよう🎵"));
    root.appendChild(c);
    return;
  }
  const byDay={};
  logs.forEach(l=>{
    const k=dateKeyOf(new Date(l.t));
    (byDay[k]=byDay[k]||[]).push(l);
  });
  Object.keys(byDay).sort().reverse().forEach(dk=>{
    const list=byDay[dk].sort((a,b)=>a.t<b.t?-1:1);
    const d=new Date(dk+"T00:00:00");
    const wd=["日","月","火","水","木","金","土"][d.getDay()];
    const card=el("div","card h-day"); card.style.padding="0";
    card.appendChild(el("div","h-day-head",
      `<span class="h-day-date">${d.getMonth()+1}/${d.getDate()}(${wd})</span>
       <span class="h-day-sub">計${totalMin(list)}分 / ${list.length}回</span>`));
    const byItem={};
    list.forEach(l=>{ (byItem[l.item]=byItem[l.item]||[]).push(l); });
    Object.keys(byItem).forEach(item=>{
      const ls=byItem[item];
      card.appendChild(el("div","h-item",
        `<span class="h-item-name">${esc(item)}</span>
         <div class="h-item-sets">${ls.map(s=>`${s.min}分`).join(", ")} (計${totalMin(ls)}分)</div>`));
    });
    root.appendChild(card);
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById("content");
  root.innerHTML="";
  if(tab==="today") renderToday(root);
  else renderHistory(root);
  clearInterval(tickIv);
  if(timer && tab==="today") tickIv=setInterval(updateTimerBtn,1000);
}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tab-btn");
  if(!b)return;
  tab=b.dataset.tab;
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

// ── 設定(バックアップ) ────────────────────────────────────────────────────────
document.getElementById("menu-open").onclick=()=>document.getElementById("menu-modal").style.display="flex";
document.getElementById("menu-close").onclick=()=>document.getElementById("menu-modal").style.display="none";
document.getElementById("menu-modal").addEventListener("click",e=>{
  if(e.target===e.currentTarget) e.currentTarget.style.display="none";
});
document.getElementById("export-btn").onclick=()=>{
  const data={mus_logs:logs, mus_last:lastMin, mus_custom:custom, mus_marks:marks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="music-log-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById("menu-modal").style.display="none";
};
document.getElementById("import-btn").onclick=()=>{
  const input=document.createElement("input");
  input.type="file"; input.accept="application/json";
  input.onchange=()=>{
    const f=input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.mus_logs)) throw new Error("bad");
        logs=d.mus_logs; lastMin=d.mus_last||{}; custom=d.mus_custom||[]; marks=d.mus_marks||{};
        persist(); render();
        showToast("✅ 復元しました");
      }catch(e){ showToast("❌ 読み込めなかった…"); }
    };
    r.readAsText(f);
  };
  input.click();
  document.getElementById("menu-modal").style.display="none";
};

// ── PWA service worker ────────────────────────────────────────────────────────
if("serviceWorker" in navigator&&location.protocol==="https:")
  navigator.serviceWorker.register("./sw.js").catch(()=>{});

// 日付が変わったら描き直す(開きっぱなし対策)。タイマー表示の復帰も兼ねる
let lastDay=dateKeyOf(new Date());
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(dateKeyOf(new Date())!==lastDay){ lastDay=dateKeyOf(new Date()); }
  render();
});

render();
</script>
