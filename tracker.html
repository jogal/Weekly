<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="週間トラッカー">
<title>週間トラッカー</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family:-apple-system,"Hiragino Sans","Meiryo",sans-serif;
  background:#F7F8FA; color:#1A1D23; height:100dvh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100dvh; }

#header { background:#1A1D23; color:#fff; padding:14px 16px 0;
  padding-top:max(14px,env(safe-area-inset-top)); flex-shrink:0; }
#app-title { margin:0 0 10px; font-size:16px; font-weight:700; letter-spacing:.04em;
  display:flex; align-items:center; justify-content:space-between; }
#save-indicator { font-size:11px; color:rgba(255,255,255,.5); letter-spacing:.02em; }
#tabs { display:flex; }
.tab-btn { padding:9px 12px; border:none; background:none; cursor:pointer;
  color:rgba(255,255,255,.4); font-weight:400; font-size:13px;
  border-bottom:2px solid transparent; }
.tab-btn.active { color:#fff; font-weight:700; border-bottom-color:#66BB6A; }

#week-nav { display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:#fff; border-bottom:1px solid #EAEAEA; flex-shrink:0; }
.nav-btn { background:none; border:1px solid #DDD; border-radius:6px;
  padding:5px 10px; cursor:pointer; font-size:13px; color:#555; }
#week-label { font-weight:600; font-size:13px; color:#333; }
.badge { font-size:10px; background:#66BB6A; color:#fff;
  border-radius:10px; padding:1px 7px; margin-left:6px; }

#content { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* List */
#list-view { flex:1; overflow-y:auto; padding:12px; }
.day-card { background:#fff; border-radius:10px; margin-bottom:10px;
  border:1px solid #EAEAEA; overflow:hidden; }
.day-card.today { border:2px solid #66BB6A; }
.day-header { display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; background:#FAFAFA; border-bottom:1px solid #EAEAEA; }
.day-card.today .day-header { background:#E8F5E9; }
.day-label { font-weight:700; font-size:13px; }
.day-date { font-weight:400; font-size:11px; color:#999; margin-left:5px; }
.today-badge { font-size:10px; background:#66BB6A; color:#fff;
  border-radius:8px; padding:1px 6px; margin-left:6px; }
.add-btn { background:#66BB6A; color:#fff; border:none;
  border-radius:6px; padding:4px 11px; font-size:12px; cursor:pointer; }
.entry-row { display:flex; align-items:center; padding:8px 12px;
  border-bottom:1px solid #F5F5F5; gap:7px; }
.entry-row:last-child { border-bottom:none; }
.entry-time { font-size:11px; color:#aaa; min-width:80px; flex-shrink:0; }
.entry-name { flex:1; font-size:13px; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entry-name.done { text-decoration:line-through; color:#bbb; }
.cat-chip { font-size:10px; border-radius:8px; padding:2px 7px;
  white-space:nowrap; flex-shrink:0; }
.rec-btn { background:none; border:1px solid #DDD; border-radius:6px;
  padding:3px 8px; font-size:11px; cursor:pointer; color:#666; flex-shrink:0; }
.del-btn { background:none; border:none; color:#ddd; cursor:pointer;
  font-size:18px; flex-shrink:0; line-height:1; padding:0 2px; }
.empty-day { padding:10px 14px; font-size:12px; color:#bbb; margin:0; }
.stars-r { display:inline-flex; gap:2px; flex-shrink:0; font-size:13px; }

/* Calendar */
#cal-view { flex:1; overflow:hidden; display:flex; flex-direction:column; }
#cal-header { display:flex; background:#fff; border-bottom:1px solid #EAEAEA;
  flex-shrink:0; padding-left:36px; }
.cal-day-hdr { flex:1; text-align:center; padding:5px 1px;
  font-size:11px; color:#555; line-height:1.4; }
.cal-day-hdr.today { color:#66BB6A; font-weight:700; }
#cal-scroll { flex:1; overflow-y:auto; }
#cal-grid { display:flex; }
#hour-col { width:36px; flex-shrink:0; }
.hour-cell { height:48px; border-bottom:1px solid #F0F0F0; display:flex;
  align-items:flex-start; justify-content:flex-end; padding:2px 4px 0;
  font-size:10px; color:#bbb; }
.cal-day-col { flex:1; position:relative; border-left:1px solid #F0F0F0;
  min-height:1152px; }
.cal-day-col.today-col { background:rgba(102,187,106,.03); }
.cal-slot { height:48px; border-bottom:1px solid #F0F0F0; cursor:pointer; }
.cal-event { position:absolute; left:1px; right:1px; border-radius:4px;
  padding:2px 4px; overflow:hidden; cursor:pointer; opacity:.9;
  box-shadow:0 1px 3px rgba(0,0,0,.15); touch-action:none; transition:box-shadow .15s; }
.cal-event.dragging { opacity:.95; z-index:50; box-shadow:0 4px 16px rgba(0,0,0,.4);
  outline:2px solid #fff; transition:none; }
.cal-event-title { font-size:10px; color:#fff; font-weight:700;
  line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-event-time { font-size:9px; color:rgba(255,255,255,.85); }
#cal-scroll.no-scroll { overflow:hidden; }
#drag-hint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(26,29,35,.92); color:#fff; border-radius:10px; padding:8px 16px;
  font-size:14px; font-weight:700; z-index:300; display:none; pointer-events:none; }

/* Stats */
#stats-view { flex:1; overflow-y:auto; padding:12px; }
.stats-card { background:#fff; border-radius:10px; padding:14px;
  margin-bottom:10px; border:1px solid #EAEAEA; }
.progress-bar { background:#F0F0F0; border-radius:99px; height:6px;
  margin-bottom:8px; overflow:hidden; }
.progress-fill { height:100%; border-radius:99px; }
.stats-meta { display:flex; gap:14px; font-size:11px; color:#888; }
.part-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:3px; }
/* Period switcher */
.mode-toggle { display:flex; background:#ECECEC; border-radius:8px; padding:3px; margin-bottom:10px; }
.mode-toggle button { flex:1; border:none; background:none; padding:7px; font-size:13px;
  border-radius:6px; cursor:pointer; color:#777; font-family:inherit; }
.mode-toggle button.active { background:#fff; color:#1A1D23; font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.12); }
.period-nav { display:flex; align-items:center; justify-content:space-between;
  background:#fff; border:1px solid #EAEAEA; border-radius:8px; padding:8px 12px; margin-bottom:12px; }
.period-nav button { background:none; border:1px solid #DDD; border-radius:6px;
  padding:4px 12px; cursor:pointer; font-size:14px; color:#555; font-family:inherit; }
.period-nav button:disabled { opacity:.3; cursor:default; }
.period-label { font-weight:700; font-size:14px; }
/* Bar chart */
.bar-chart { display:flex; align-items:flex-end; gap:8px; height:140px;
  padding:8px 4px 0; margin-bottom:6px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; gap:4px; }
.bar-val { font-size:11px; font-weight:700; color:#555; }
.bar { width:100%; max-width:40px; border-radius:5px 5px 0 0; min-height:2px;
  transition:height .3s; }
.bar-lbl { font-size:10px; color:#888; text-align:center; line-height:1.2; }
.num-row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid #F2F2F2; gap:8px; }
.num-row:last-child { border-bottom:none; }
.num-count { margin-left:auto; font-weight:700; font-size:15px; }
.num-min { font-size:11px; color:#999; min-width:54px; text-align:right; }
.section-label { font-size:12px; color:#888; margin:14px 4px 6px; font-weight:700; }

/* Status / Level page */
#status-view { flex:1; overflow-y:auto; padding:12px; }
.hero-card { background:linear-gradient(135deg,#1A1D23,#2D3344); color:#fff;
  border-radius:14px; padding:18px; margin-bottom:14px; text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.18); position:relative; overflow:hidden; }
.hero-card::after { content:""; position:absolute; top:-50%; right:-20%;
  width:160px; height:160px; background:radial-gradient(circle,rgba(102,187,106,.25),transparent 70%); }
.hero-rank { font-size:12px; color:#9FE5A8; font-weight:700; letter-spacing:.08em; }
.hero-level { font-size:42px; font-weight:800; line-height:1.1; margin:2px 0; }
.hero-level small { font-size:16px; font-weight:600; color:rgba(255,255,255,.6); }
.hero-sub { font-size:12px; color:rgba(255,255,255,.65); }
.track-card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
  border:1px solid #EAEAEA; }
.track-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.track-icon { width:38px; height:38px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.track-name { font-weight:700; font-size:14px; }
.track-rank { font-size:11px; color:#999; }
.track-lvl { margin-left:auto; text-align:right; }
.track-lvl-num { font-size:22px; font-weight:800; line-height:1; }
.track-lvl-lbl { font-size:9px; color:#aaa; letter-spacing:.1em; }
.xp-track { background:#EFEFEF; border-radius:99px; height:10px; overflow:hidden; position:relative; }
.xp-fill { height:100%; border-radius:99px; transition:width .6s cubic-bezier(.3,1.2,.5,1); }
.xp-text { font-size:10px; color:#999; text-align:right; margin-top:3px; }
.decay-warn { font-size:11px; color:#E57373; font-weight:700; margin-top:6px;
  background:#FFEBEE; border-radius:6px; padding:4px 8px; }
.decay-soon { font-size:10px; color:#FB8C00; margin-top:6px; }

/* Level-up celebration overlay */
#levelup-overlay { position:fixed; inset:0; z-index:500; display:none;
  align-items:center; justify-content:center; background:rgba(10,12,16,.78);
  backdrop-filter:blur(3px); }
.levelup-box { text-align:center; color:#fff; animation:lvlPop .5s cubic-bezier(.2,1.5,.4,1); }
.levelup-burst { font-size:14px; color:#9FE5A8; font-weight:700; letter-spacing:.2em; }
.levelup-title { font-size:30px; font-weight:800; margin:6px 0 2px;
  background:linear-gradient(90deg,#FFD54F,#FF8A65); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; }
.levelup-cat { font-size:18px; font-weight:700; margin-top:8px; }
.levelup-lvl { font-size:60px; font-weight:800; margin:4px 0; }
.levelup-tap { font-size:12px; color:rgba(255,255,255,.5); margin-top:18px; }
@keyframes lvlPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
.confetti { position:absolute; width:9px; height:9px; top:-12px; border-radius:2px;
  animation:fall linear forwards; }
@keyframes fall { to { transform:translateY(105vh) rotate(540deg); opacity:.4; } }
/* XP gain toast */
#xp-toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:#66BB6A; color:#fff; border-radius:99px; padding:8px 18px;
  font-size:14px; font-weight:700; z-index:200; display:none;
  box-shadow:0 4px 16px rgba(102,187,106,.5); }

/* Modals */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-box { background:#fff; border-radius:12px; padding:22px; width:340px;
  max-width:93vw; box-shadow:0 8px 32px rgba(0,0,0,.18);
  max-height:90dvh; overflow-y:auto; }
.modal-title { margin:0 0 14px; font-size:15px; font-weight:700; }
.modal-sub { font-size:12px; color:#888; margin:0 0 14px; }
.field-label { font-size:11px; color:#777; margin-bottom:4px; display:block; }
.field-input { width:100%; border:1px solid #DDD; border-radius:6px;
  padding:8px 10px; font-size:13px; margin-bottom:10px; font-family:inherit; }
textarea.field-input { height:70px; resize:vertical; }
.chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { padding:4px 10px; border-radius:20px; font-size:12px; cursor:pointer;
  border:1.5px solid; }
.part-row { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
.part-chip { padding:3px 10px; border-radius:20px; font-size:12px;
  cursor:pointer; border:1.5px solid; }
.btn-row { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; padding:9px; border:none; border-radius:7px;
  cursor:pointer; font-size:14px; font-family:inherit; }
.btn-primary { background:#1A1D23; color:#fff; font-weight:700; }
.btn-secondary { background:#F0F0F0; color:#444; }
.check-row { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
.check-row input { width:16px; height:16px; accent-color:#66BB6A; cursor:pointer; }

/* Save toast */
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:#1A1D23; color:#fff; border-radius:10px; padding:10px 20px;
  font-size:13px; z-index:200; display:none; box-shadow:0 4px 16px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <p id="app-title">
      📋 週間トラッカー
      <span id="save-indicator"></span>
    </p>
    <div id="tabs">
      <button class="tab-btn active" data-tab="schedule">リスト</button>
      <button class="tab-btn" data-tab="calendar">カレンダー</button>
      <button class="tab-btn" data-tab="log">成果記録</button>
      <button class="tab-btn" data-tab="status">ステータス</button>
      <button class="tab-btn" data-tab="stats">統計</button>
    </div>
  </div>
  <div id="week-nav">
    <button type="button" class="nav-btn" id="prev-week">← 前週</button>
    <span id="week-label"></span>
    <button type="button" class="nav-btn" id="next-week">次週 →</button>
  </div>
  <div id="content"></div>
</div>

<!-- Add Modal -->
<div class="overlay" id="add-modal" style="display:none">
  <div class="modal-box">
    <h3 class="modal-title" id="add-modal-title"></h3>
    <span class="field-label">カテゴリ</span>
    <div class="chip-row" id="cat-chips"></div>
    <div id="part-section" style="display:none">
      <span class="field-label">部位</span>
      <div class="part-row" id="part-chips"></div>
    </div>
    <span class="field-label">開始時間</span>
    <input type="time" class="field-input" id="add-time" value="07:00">
    <span class="field-label">終了時間</span>
    <input type="time" class="field-input" id="add-endtime" value="08:00">
    <span class="field-label">メモ（任意）</span>
    <input type="text" class="field-input" id="add-label" placeholder="例：デッドリフト3set">
    <div class="btn-row">
      <button class="btn btn-secondary" id="add-cancel">キャンセル</button>
      <button class="btn btn-primary" id="add-save">追加</button>
    </div>
  </div>
</div>

<!-- Record Modal -->
<div class="overlay" id="rec-modal" style="display:none">
  <div class="modal-box">
    <h3 class="modal-title" id="rec-title"></h3>
    <p class="modal-sub" id="rec-sub"></p>
    <span class="field-label">実施時間（分）</span>
    <input type="number" min="0" class="field-input" id="rec-duration" placeholder="例: 45">
    <span class="field-label">評価</span>
    <div id="rec-stars" style="margin-bottom:12px;font-size:22px;display:flex;gap:4px"></div>
    <span class="field-label">メモ</span>
    <textarea class="field-input" id="rec-note" placeholder="内容・気づき・体調など…"></textarea>
    <label class="check-row">
      <input type="checkbox" id="rec-done"> 完了としてマーク
    </label>
    <div class="btn-row">
      <button class="btn btn-secondary" id="rec-cancel">キャンセル</button>
      <button class="btn btn-primary" id="rec-save">保存</button>
    </div>
  </div>
</div>

<div id="toast">✅ 保存しました</div>
<div id="xp-toast"></div>
<div id="drag-hint"></div>
<div id="levelup-overlay">
  <div class="levelup-box">
    <div class="levelup-burst">★ LEVEL UP ★</div>
    <div class="levelup-title">レベルアップ！</div>
    <div class="levelup-cat" id="lvl-cat"></div>
    <div class="levelup-lvl" id="lvl-num"></div>
    <div id="lvl-rank" style="font-size:14px;color:#9FE5A8;font-weight:700"></div>
    <div class="levelup-tap">タップして閉じる</div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const DAYS    = ["月","火","水","木","金","土","日"];
const DAY_KEYS= ["mon","tue","wed","thu","fri","sat","sun"];
const HOUR_H  = 48;

const WORKOUT_PARTS = [
  {id:"chest",    label:"胸",   color:"#EF5350"},
  {id:"back",     label:"背中", color:"#E53935"},
  {id:"shoulder", label:"肩",   color:"#F44336"},
  {id:"arm",      label:"腕",   color:"#EF9A9A"},
  {id:"leg",      label:"脚",   color:"#C62828"},
];
const BASE_CATS = [
  {id:"instrument",label:"楽器練習",icon:"🎵",color:"#7986CB",light:"#E8EAF6"},
  {id:"cooking",   label:"自炊",    icon:"🍳",color:"#66BB6A",light:"#E8F5E9"},
  {id:"medicine",  label:"専門医勉強",icon:"🧠",color:"#FFA726",light:"#FFF3E0"},
  {id:"english",   label:"英語学習",icon:"🌐",color:"#26C6DA",light:"#E0F7FA"},
];
const WORKOUT_CATS = WORKOUT_PARTS.map(p=>({
  id:`workout_${p.id}`,label:`筋トレ（${p.label}）`,icon:"💪",
  color:p.color,light:"#FFEBEE",part:p,
}));
const ALL_CATS = [...WORKOUT_CATS,...BASE_CATS];
const CAT_MAP  = {};
ALL_CATS.forEach(c=>CAT_MAP[c.id]=c);
// Legacy fallback for removed parts (体幹/全身) so old saved entries still render
CAT_MAP["workout_core"]={id:"workout_core",label:"筋トレ（体幹）",icon:"💪",color:"#B71C1C",light:"#FFEBEE",part:{id:"core",label:"体幹",color:"#B71C1C"}};
CAT_MAP["workout_full"]={id:"workout_full",label:"筋トレ（全身）",icon:"💪",color:"#FF5252",light:"#FFEBEE",part:{id:"full",label:"全身",color:"#FF5252"}};
const catById  = id=>CAT_MAP[id];
// Calendar display name: workout → part label only (e.g. "胸"), others → full label
function calName(c){ return c?.part ? c.part.label : (c?.label||""); }

// ── State ─────────────────────────────────────────────────────────────────────
let tab       = "schedule";
let weekKey   = getWeekKey(new Date());
let schedules = JSON.parse(localStorage.getItem("wt_schedules")||"{}");
let records   = JSON.parse(localStorage.getItem("wt_records")||"{}");
let addCtx    = null;
let recCtx    = null;
let addCat    = "workout_chest";
let recRating = 0;
let statsMode = "month";              // "month" | "year"
let statsYear = new Date().getFullYear();
let statsMonth= new Date().getMonth();  // 0-11

// ── Helpers ───────────────────────────────────────────────────────────────────
function getWeekKey(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function getWeekDates(wk){
  const [y,m,d]=wk.split("-").map(Number);
  return DAY_KEYS.map((_,i)=>new Date(y,m-1,d+i));
}
function todayDK(){const d=new Date().getDay();return DAY_KEYS[d===0?6:d-1];}
function timeToMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function emptyWeek(){const w={};DAY_KEYS.forEach(d=>w[d]=[]);return w;}
function getRec(dk,cat){return records?.[weekKey]?.[dk]?.[cat]||{done:false,note:"",duration:"",rating:0};}

function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function starsHTML(val,interactive){
  return[1,2,3,4,5].map(n=>
    `<span style="color:${n<=val?"#FFA726":"#ccc"};cursor:${interactive?"pointer":"default"};user-select:none"
      ${interactive?`data-n="${n}"`:""}>${n<=val?"★":"☆"}</span>`
  ).join("");
}

// ── XP / Level system ─────────────────────────────────────────────────────────
// XP per completed task = 10 base + duration bonus (1xp/5min, max 20) + rating bonus (rating*2)
function xpForRecord(rec){
  if(!rec?.done)return 0;
  let xp=10;
  if(rec.duration)xp+=Math.min(20,Math.floor((parseInt(rec.duration)||0)/5));
  if(rec.rating)xp+=rec.rating*2;
  return xp;
}
// Level curve: XP needed to REACH level L from start = 50 * L^1.6 (cumulative)
// We invert to get level from total XP.
function levelFromXP(totalXP){
  let lvl=1;
  while(totalXP>=xpToReach(lvl+1))lvl++;
  return lvl;
}
function xpToReach(level){ // cumulative XP needed to be AT this level
  if(level<=1)return 0;
  return Math.round(50*Math.pow(level-1,1.6));
}
function levelProgress(totalXP){
  const lvl=levelFromXP(totalXP);
  const cur=xpToReach(lvl), next=xpToReach(lvl+1);
  return { lvl, into:totalXP-cur, span:next-cur, pct:Math.round((totalXP-cur)/(next-cur)*100) };
}
// Rank title based on level
function rankTitle(lvl){
  if(lvl>=40)return "レジェンド";
  if(lvl>=30)return "達人";
  if(lvl>=20)return "エキスパート";
  if(lvl>=12)return "上級者";
  if(lvl>=6) return "中級者";
  if(lvl>=3) return "見習い";
  return "ビギナー";
}
// Compute total XP per category across all records
function computeXP(){
  const xp={};
  ALL_CATS.forEach(c=>xp[c.id]=0);
  // include legacy
  xp["workout_core"]=0; xp["workout_full"]=0;
  Object.keys(records).forEach(wk=>{
    DAY_KEYS.forEach(dk=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(xp[catId]===undefined)xp[catId]=0;
        xp[catId]+=xpForRecord(day[catId]);
      });
    });
  });
  return xp;
}
// Last completion date (Date object) per track ("workout" combined, or base cat id). null if never.
function computeLastDone(){
  const last={};  // trackId → Date
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        const trackId=catId.startsWith("workout_")?"workout":catId;
        const d=dates[di];
        if(!last[trackId]||d>last[trackId])last[trackId]=d;
      });
    });
  });
  return last;
}
// ── Decay config ──
const DECAY_GRACE_DAYS = 7;   // サボってもこの日数までは減らない
const DECAY_PER_DAY    = 8;   // 猶予超過後、1日あたり減るXP（ゆるやか）
function daysSince(date){
  if(!date)return 0;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(date); d.setHours(0,0,0,0);
  return Math.floor((today-d)/(1000*60*60*24));
}
// Apply decay to a raw XP total given the last-done date.
function applyDecay(rawXP, lastDate){
  if(!lastDate||rawXP<=0)return {xp:rawXP, decayDays:0, lost:0};
  const idle=daysSince(lastDate);
  const decayDays=Math.max(0, idle-DECAY_GRACE_DAYS);
  const lost=Math.min(rawXP, decayDays*DECAY_PER_DAY);
  return { xp:Math.max(0,rawXP-lost), decayDays, lost, idle };
}
// Workout XP combined (all parts → one "筋トレ" track)
function workoutTotalXP(xp){
  return WORKOUT_CATS.reduce((a,c)=>a+(xp[c.id]||0),0)+(xp["workout_core"]||0)+(xp["workout_full"]||0);
}
// Overall total level = sum of all category levels
function overallStats(xp){
  let totalLvl=0, totalXP=0;
  const tracks=getTracks(xp);
  tracks.forEach(t=>{ totalLvl+=t.lvl; totalXP+=t.xp; });
  return { totalLvl, totalXP, tracks };
}
// Build display tracks: 筋トレ(合算) + 4 base cats, with decay applied
function getTracks(xp){
  const last=computeLastDone();
  const tracks=[];
  const wRaw=workoutTotalXP(xp);
  const wD=applyDecay(wRaw, last["workout"]);
  const wp=levelProgress(wD.xp);
  tracks.push({ id:"workout", label:"筋トレ", icon:"💪", color:"#E57373",
    xp:wD.xp, rawXP:wRaw, lvl:wp.lvl, into:wp.into, span:wp.span, pct:wp.pct,
    decayDays:wD.decayDays, lost:wD.lost, idle:wD.idle, lastDate:last["workout"]||null });
  BASE_CATS.forEach(c=>{
    const raw=xp[c.id]||0;
    const dd=applyDecay(raw, last[c.id]);
    const p=levelProgress(dd.xp);
    tracks.push({ id:c.id, label:c.label, icon:c.icon, color:c.color,
      xp:dd.xp, rawXP:raw, lvl:p.lvl, into:p.into, span:p.span, pct:p.pct,
      decayDays:dd.decayDays, lost:dd.lost, idle:dd.idle, lastDate:last[c.id]||null });
  });
  return tracks;
}

// ── Drag to move events ───────────────────────────────────────────────────────
function attachDragHandlers(ev, dayIdx, dayKey, entry, entryIdx){
  let pressTimer=null, dragging=false, startX=0, startY=0;
  let grid=null, dayCols=[], colW=0, dur=parseInt(ev.dataset.dur)||60;
  let moved=false;

  function pointerDown(clientX, clientY){
    startX=clientX; startY=clientY; moved=false;
    // Long-press (250ms) to enter drag mode
    pressTimer=setTimeout(()=>{
      dragging=true;
      ev.classList.add("dragging");
      document.getElementById("cal-scroll").classList.add("no-scroll");
      grid=document.getElementById("cal-grid");
      dayCols=Array.from(grid.querySelectorAll(".cal-day-col"));
      colW=dayCols[0].getBoundingClientRect().width;
      if(navigator.vibrate)navigator.vibrate(30);
      showHint(entry.time+(entry.endTime?"〜"+entry.endTime:""));
    },250);
  }

  function pointerMove(clientX, clientY){
    if(Math.abs(clientX-startX)>8||Math.abs(clientY-startY)>8)moved=true;
    if(!dragging){
      // if user moves before long-press completes, cancel (let it scroll)
      if(moved){clearTimeout(pressTimer);}
      return;
    }
    // Determine target column by X
    let targetCol=null;
    for(const col of dayCols){
      const r=col.getBoundingClientRect();
      if(clientX>=r.left&&clientX<r.right){targetCol=col;break;}
    }
    if(!targetCol)targetCol=dayCols[parseInt(ev.dataset.curDayIdx??dayIdx)];
    const colRect=targetCol.getBoundingClientRect();

    // Determine time by Y (relative to column top), snap to 1 hour
    let relY=clientY-colRect.top;
    let hour=Math.round(relY/HOUR_H - 0.5*(dur/60)); // center under finger
    hour=Math.max(0, Math.min(24-Math.ceil(dur/60), hour));

    // Move the element visually into the target column
    if(ev.parentElement!==targetCol)targetCol.appendChild(ev);
    ev.style.top=(hour*HOUR_H)+"px";
    ev.dataset.curDayIdx=targetCol.dataset.dayIdx;
    ev.dataset.curHour=hour;

    const sH=String(hour).padStart(2,"0");
    const eH=String(Math.min(hour+Math.round(dur/60),24)).padStart(2,"0");
    showHint(`${DAYS[targetCol.dataset.dayIdx]} ${sH}:00〜${eH}:00`);
  }

  function pointerUp(){
    clearTimeout(pressTimer);
    hideHint();
    document.getElementById("cal-scroll").classList.remove("no-scroll");
    if(dragging){
      dragging=false;
      ev.classList.remove("dragging");
      const newDayIdx=parseInt(ev.dataset.curDayIdx??dayIdx);
      const newHour=parseInt(ev.dataset.curHour??Math.floor(timeToMin(entry.time)/60));
      commitMove(dayKey, entryIdx, newDayIdx, newHour, dur);
    }else if(!moved){
      // treat as tap → open record
      openRec(dayIdx, dayKey, entry);
    }
  }

  // Touch events
  ev.addEventListener("touchstart",e=>{
    const t=e.touches[0]; pointerDown(t.clientX,t.clientY);
  },{passive:true});
  ev.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    if(dragging)e.preventDefault();
    pointerMove(t.clientX,t.clientY);
  },{passive:false});
  ev.addEventListener("touchend",pointerUp);
  ev.addEventListener("touchcancel",pointerUp);

  // Mouse events (desktop testing)
  ev.addEventListener("mousedown",e=>{
    e.preventDefault(); pointerDown(e.clientX,e.clientY);
    const mm=ev2=>pointerMove(ev2.clientX,ev2.clientY);
    const mu=()=>{pointerUp();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};
    document.addEventListener("mousemove",mm);
    document.addEventListener("mouseup",mu);
  });
}

function commitMove(dayKey, entryIdx, newDayIdx, newHour, dur){
  const ws=schedules[weekKey]||emptyWeek();
  const entry=ws[dayKey]?.[entryIdx];
  if(!entry)return;
  const newDayKey=DAY_KEYS[newDayIdx];
  const newStart=newHour*60;
  const newEnd=Math.min(newStart+dur, 24*60);
  entry.time=`${String(Math.floor(newStart/60)).padStart(2,"0")}:${String(newStart%60).padStart(2,"0")}`;
  entry.endTime=`${String(Math.floor(newEnd/60)).padStart(2,"0")}:${String(newEnd%60).padStart(2,"0")}`;
  // Remove from old day, add to new day
  ws[dayKey].splice(entryIdx,1);
  if(!ws[newDayKey])ws[newDayKey]=[];
  ws[newDayKey].push(entry);
  ws[newDayKey].sort((a,b)=>a.time.localeCompare(b.time));
  schedules[weekKey]=ws;
  saveData();
  renderCalendar();
}

// ── Stats View ────────────────────────────────────────────────────────────────
// Aggregate completed counts for a given period filter.
// filterFn(dateObj) → true if the entry's date is in the selected period.
function aggregateStats(filterFn){
  const st={};
  ALL_CATS.forEach(c=>st[c.id]={done:0,total:0,totalMin:0,ratings:[]});
  Object.keys(schedules).forEach(wk=>{
    const sc=schedules[wk]||{};
    const dates=getWeekDates(wk); // actual date per day index
    DAY_KEYS.forEach((dk,di)=>{
      const dateObj=dates[di];
      if(!filterFn(dateObj))return;
      (sc[dk]||[]).forEach(e=>{
        if(!st[e.cat])return;
        st[e.cat].total++;
        const rec=records[wk]?.[dk]?.[e.cat];
        if(rec?.done){
          st[e.cat].done++;
          if(rec.duration)st[e.cat].totalMin+=parseInt(rec.duration)||0;
          if(rec.rating)st[e.cat].ratings.push(rec.rating);
        }
      });
    });
  });
  return st;
}

  </div>`;
  WORKOUT_PARTS.forEach(p=>{
    const s=st[`workout_${p.id}`];
    wHTML+=`<div class="num-row">
      <span class="part-dot" style="background:${p.color}"></span>
      <span style="font-size:13px">${p.label}</span>
      <span class="num-count" style="color:${p.color}">${s.done}回</span>
      <span class="num-min">${s.totalMin>0?s.totalMin+"分":""}</span>
    </div>`;
  });
  wCard.innerHTML=wHTML;
  wrap.appendChild(wCard);

  // Base categories
  BASE_CATS.forEach(c=>{
    const s=st[c.id];
    const avg=s.ratings.length?(s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length).toFixed(1):"—";
    const card=el("div","stats-card");
    card.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">${c.icon}</span>
      <span style="font-weight:700;font-size:14px">${c.label}</span>
      <span style="margin-left:auto;font-weight:700;font-size:15px;color:${c.color}">${s.done}回</span>
    </div>
    <div class="stats-meta" style="margin-top:6px">
      ${s.totalMin>0?`<span>合計 ${s.totalMin} 分</span>`:""}
      <span>平均評価 ${avg}</span>
    </div>`;
    wrap.appendChild(card);
  });

  cont.appendChild(wrap);
}

// ── Add Modal ─────────────────────────────────────────────────────────────────
function buildCatChips(){
  const row=document.getElementById("cat-chips");row.innerHTML="";
  const isW=addCat.startsWith("workout_");
  const wb=el("button","chip");
  wb.style.cssText=`border-color:#E57373;background:${isW?"#E57373":"#fff"};color:${isW?"#fff":"#E57373"};font-weight:${isW?700:400}`;
  wb.textContent="💪 筋トレ";
  wb.onclick=()=>{addCat=`workout_${addCat.startsWith("workout_")?addCat.replace("workout_",""):"chest"}`;buildCatChips();buildPartChips();};
  row.appendChild(wb);
  BASE_CATS.forEach(c=>{
    const active=addCat===c.id;
    const b=el("button","chip");
    b.style.cssText=`border-color:${c.color};background:${active?c.color:"#fff"};color:${active?"#fff":c.color};font-weight:${active?700:400}`;
    b.textContent=c.icon+" "+c.label;
    b.onclick=()=>{addCat=c.id;buildCatChips();buildPartChips();};
    row.appendChild(b);
  });
}
function buildPartChips(){
  const sec=document.getElementById("part-section");
  const isW=addCat.startsWith("workout_");
  sec.style.display=isW?"":"none";
  if(!isW)return;
  const row=document.getElementById("part-chips");row.innerHTML="";
  const cur=addCat.replace("workout_","");
  WORKOUT_PARTS.forEach(p=>{
    const a=cur===p.id;
    const b=el("button","part-chip");
    b.style.cssText=`border-color:${p.color};background:${a?p.color:"#fff"};color:${a?"#fff":p.color};font-weight:${a?700:400}`;
    b.textContent=p.label;
    b.onclick=()=>{addCat=`workout_${p.id}`;buildPartChips();};
    row.appendChild(b);
  });
}
function openAdd(dayIdx,dayKey,hour){
  addCtx={dayIdx,dayKey};addCat="workout_chest";
  document.getElementById("add-modal-title").textContent=DAYS[dayIdx]+"曜日に予定を追加";
  const hh=hour!==undefined?String(hour).padStart(2,"0"):"07";
  const eh=hour!==undefined?String(Math.min(hour+1,23)).padStart(2,"0"):"08";
  document.getElementById("add-time").value=`${hh}:00`;
  document.getElementById("add-endtime").value=`${eh}:00`;
  document.getElementById("add-label").value="";
  buildCatChips();buildPartChips();
  document.getElementById("add-modal").style.display="flex";
}
document.getElementById("add-time").addEventListener("change",e=>{
  const t=e.target.value;if(!t)return;
  const[h,m]=t.split(":").map(Number);
  const eh=(h+1)%24;
  document.getElementById("add-endtime").value=String(eh).padStart(2,"0")+":"+String(m).padStart(2,"0");
});
document.getElementById("add-cancel").onclick=()=>document.getElementById("add-modal").style.display="none";
document.getElementById("add-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("add-save").onclick=()=>{
  if(!addCtx)return;
  const time=document.getElementById("add-time").value;
  const endTime=document.getElementById("add-endtime").value;
  const label=document.getElementById("add-label").value.trim();
  if(!time)return;
  if(!schedules[weekKey])schedules[weekKey]=emptyWeek();
  const dk=addCtx.dayKey;
  schedules[weekKey][dk].push({cat:addCat,time,endTime,label,id:Date.now()});
  schedules[weekKey][dk].sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById("add-modal").style.display="none";
  saveData();render();
};

// ── Record Modal ──────────────────────────────────────────────────────────────
function renderRecStars(){
  const el=document.getElementById("rec-stars");
  el.innerHTML=starsHTML(recRating,true);
  el.querySelectorAll("span").forEach(s=>{
    s.addEventListener("click",()=>{
      const n=parseInt(s.dataset.n);
      recRating=recRating===n?0:n;
      renderRecStars();
    });
  });
}
function openRec(dayIdx,dayKey,entry){
  recCtx={dayIdx,dayKey,entry};
  const c=catById(entry.cat);
  const rec=getRec(dayKey,entry.cat);
  recRating=rec.rating||0;
  document.getElementById("rec-title").textContent=(c?.icon||"")+" "+(entry.label||c?.label||"");
  document.getElementById("rec-sub").textContent=DAYS[dayIdx]+" "+entry.time+(entry.endTime?"〜"+entry.endTime:"");
  document.getElementById("rec-duration").value=rec.duration||"";
  document.getElementById("rec-note").value=rec.note||"";
  document.getElementById("rec-done").checked=rec.done||false;
  renderRecStars();
  document.getElementById("rec-modal").style.display="flex";
}
function snapshotLevels(){
  const xp=computeXP();
  const tracks=getTracks(xp);
  const map={};
  tracks.forEach(t=>map[t.id]={lvl:t.lvl,label:t.label});
  return map;
}
function trackIdForCat(catId){
  return catId.startsWith("workout_")?"workout":catId;
}
function checkLevelUp(before, gainedXP){
  const after=snapshotLevels();
  let leveledTrack=null;
  Object.keys(after).forEach(id=>{
    if(before[id]&&after[id].lvl>before[id].lvl)
      leveledTrack={id, label:after[id].label, lvl:after[id].lvl};
  });
  if(leveledTrack)showLevelUp(leveledTrack);
  else if(gainedXP>0)showXPToast(gainedXP);
}

function toggleDone(dk,entry){
  const rec=getRec(dk,entry.cat);
  const before=snapshotLevels();
  const wasDone=rec.done;
  if(!records[weekKey])records[weekKey]={};
  if(!records[weekKey][dk])records[weekKey][dk]={};
  records[weekKey][dk][entry.cat]={...rec,done:!rec.done};
  const gained = !wasDone ? xpForRecord(records[weekKey][dk][entry.cat]) : 0;
  saveData();render();
  if(!wasDone)checkLevelUp(before, gained);
}
document.getElementById("rec-cancel").onclick=()=>document.getElementById("rec-modal").style.display="none";
document.getElementById("rec-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("rec-save").onclick=()=>{
  if(!recCtx)return;
  const{dayKey,entry}=recCtx;
  const before=snapshotLevels();
  const prevRec=getRec(dayKey,entry.cat);
  const prevXP=xpForRecord(prevRec);
  if(!records[weekKey])records[weekKey]={};
  if(!records[weekKey][dayKey])records[weekKey][dayKey]={};
  const newRec={
    done:document.getElementById("rec-done").checked,
    note:document.getElementById("rec-note").value,
    duration:document.getElementById("rec-duration").value,
    rating:recRating,
  };
  records[weekKey][dayKey][entry.cat]=newRec;
  const gained=xpForRecord(newRec)-prevXP;
  document.getElementById("rec-modal").style.display="none";
  saveData();render();
  checkLevelUp(before, gained);
};

// ── Level-up celebration ──────────────────────────────────────────────────────
function showLevelUp(track){
  const c = track.id==="workout" ? {icon:"💪",color:"#E57373"} : catById(track.id);
  document.getElementById("lvl-cat").textContent=(c?.icon||"")+" "+track.label;
  document.getElementById("lvl-num").textContent="Lv. "+track.lvl;
  document.getElementById("lvl-rank").textContent=rankTitle(track.lvl);
  const ov=document.getElementById("levelup-overlay");
  ov.style.display="flex";
  spawnConfetti(ov);
  if(navigator.vibrate)navigator.vibrate([40,40,80]);
}
document.getElementById("levelup-overlay").addEventListener("click",function(){
  this.style.display="none";
  this.querySelectorAll(".confetti").forEach(c=>c.remove());
});
function spawnConfetti(container){
  const colors=["#FFD54F","#FF8A65","#66BB6A","#42A5F5","#EF5350","#AB47BC"];
  for(let i=0;i<40;i++){
    const cf=document.createElement("div");
    cf.className="confetti";
    cf.style.left=Math.random()*100+"%";
    cf.style.background=colors[i%colors.length];
    cf.style.animationDuration=(1.5+Math.random()*1.5)+"s";
    cf.style.animationDelay=(Math.random()*0.4)+"s";
    container.appendChild(cf);
  }
}
function showXPToast(xp){
  const t=document.getElementById("xp-toast");
  t.textContent=`+${xp} XP`;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  renderNav();
  if(tab==="calendar")renderCalendar();
  else if(tab==="stats")renderStats();
  else if(tab==="status")renderStatus();
  else renderList();
}
render();
</script>
