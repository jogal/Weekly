<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="週クエ">
<meta name="theme-color" content="#08090b">
<title>週間クエスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/avatar/novice.png" id="home-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0c0c0e; --panel:#131316; --panel2:#1b1b1f; --line:#28282e;
  --txt:#f0f0f2; --dim:#96969e; --faint:#55555e;
  --green:#e01937; --gold:#c8a557; --red:#ff5555;
  --shadow:transparent;
  --cond:"Barlow Condensed","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  background:var(--bg); color:var(--txt); height:100vh; height:100dvh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
body { overscroll-behavior:none; }
button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

#header { background:var(--bg); color:#fff; padding:14px 16px 10px;
  padding-top:max(14px,env(safe-area-inset-top)); flex-shrink:0;
  border-bottom:1px solid var(--line); }
#app-title { margin:0; font-size:16px; font-weight:600; letter-spacing:.12em;
  font-family:var(--cond); text-transform:uppercase; color:var(--txt);
  display:flex; align-items:center; justify-content:space-between; line-height:1; gap:8px; }
#app-title>span:first-child { min-width:0; white-space:nowrap; }
#app-title>span:last-child { display:flex; flex-shrink:0; align-items:center; }
#app-title .t-jp { display:block; font-size:10px; color:var(--dim);
  letter-spacing:.38em; margin-top:5px; font-weight:500; }
#app-title .t-red { color:var(--green); }
.mini-btn { background:none; border:1px solid var(--line); color:var(--dim);
  font-size:10px; padding:7px 9px; cursor:pointer; margin-left:4px;
  font-family:var(--cond); letter-spacing:.12em; text-transform:uppercase;
  text-shadow:none; }

/* Bottom tab bar */
#tabbar { display:flex; background:var(--bg); border-top:1px solid var(--line);
  padding-bottom:max(calc(env(safe-area-inset-bottom) - 12px), 6px); flex-shrink:0; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 7px; border:none; background:none; cursor:pointer;
  color:var(--faint); font-weight:500; font-size:10px; white-space:nowrap;
  border-top:2px solid transparent; min-height:52px; letter-spacing:.14em; }
.tab-btn.active { color:var(--txt); font-weight:700; border-top-color:var(--green); }
.tab-ico { font-size:17px; line-height:1; filter:grayscale(1) brightness(1.7); }
.tab-btn:not(.active) .tab-ico { filter:grayscale(1) brightness(.8); }

/* Settings menu */
.menu-item { display:block; width:100%; text-align:left; background:var(--panel2);
  border:1px solid var(--line); color:var(--txt); padding:14px 12px; font-size:14px;
  cursor:pointer; margin-bottom:10px; }

#content { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* Stats */
#stats-view { flex:1; overflow-y:auto; padding:14px 12px; }
.stats-card { background:var(--panel); padding:14px; margin-bottom:12px;
  border:1px solid var(--line); }
.progress-bar { background:#0f0f12; height:6px; margin-bottom:8px; overflow:hidden;
  border:none; }
.progress-fill { height:100%; }
.stats-meta { display:flex; gap:14px; font-size:11px; color:var(--dim); }
.part-dot { width:8px; height:8px; display:inline-block; margin-right:3px; }
/* Period switcher */
.mode-toggle { display:flex; background:var(--panel); border:1px solid var(--line);
  padding:3px; margin-bottom:12px; }
.mode-toggle button { flex:1; border:none; background:none; padding:7px; font-size:12px;
  cursor:pointer; color:var(--dim); font-family:var(--cond); letter-spacing:.16em; }
.mode-toggle button.active { background:var(--green); color:#fff; font-weight:700; }
.period-nav { display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); padding:8px 12px; margin-bottom:12px; }
.period-nav button { background:none; border:1px solid var(--line);
  padding:4px 12px; cursor:pointer; font-size:14px; color:var(--txt); }
.period-nav button:disabled { opacity:.3; cursor:default; }
.period-label { font-weight:600; font-size:16px; font-family:var(--cond); letter-spacing:.16em; }
/* Bar chart */
.bar-chart { display:flex; align-items:flex-end; gap:8px; height:140px;
  padding:8px 4px 0; margin-bottom:6px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; gap:4px; }
.bar-val { font-size:13px; font-weight:600; color:var(--txt); font-family:var(--cond); }
.bar { width:100%; max-width:40px; min-height:2px; transition:height .3s;
  border:none; }
.bar-lbl { font-size:10px; color:var(--dim); text-align:center; line-height:1.2; }
.num-row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); gap:8px; }
.num-row:last-child { border-bottom:none; }
.num-count { margin-left:auto; font-weight:600; font-size:17px; font-family:var(--cond); }
.num-min { font-size:11px; color:var(--dim); min-width:54px; text-align:right; }
.section-label { font-size:11px; color:var(--dim); margin:16px 4px 8px; font-weight:600;
  font-family:var(--cond); letter-spacing:.3em; text-transform:uppercase; }

/* Status / Level page */
#status-view { flex:1; overflow-y:auto; padding:14px 12px; }
.hero-card { background:var(--panel); color:#fff; border:1px solid var(--line);
  border-top:3px solid var(--green);
  padding:18px; margin-bottom:14px; text-align:center;
  position:relative; overflow:hidden; }
.hero-card::after { display:none; }
.hero-rank { font-size:11px; color:var(--green); font-weight:700; letter-spacing:.4em;
  font-family:var(--cond); text-transform:uppercase; }
.hero-level { font-size:44px; font-weight:700; line-height:1.1; margin:2px 0;
  font-family:var(--cond); letter-spacing:.06em; }
.hero-level small { font-size:15px; font-weight:500; color:var(--dim); letter-spacing:.2em; }
.hero-sub { font-size:11px; color:var(--dim); letter-spacing:.08em; }
.track-card { background:var(--panel); padding:14px; margin-bottom:12px;
  border:1px solid var(--line); }
.track-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.track-icon { width:38px; height:38px; border:1px solid var(--line); display:flex;
  align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  filter:grayscale(1) brightness(1.6); }
.track-name { font-weight:600; font-size:14px; letter-spacing:.06em; }
.track-rank { font-size:11px; color:var(--gold); letter-spacing:.1em; }
.track-lvl { margin-left:auto; text-align:right; }
.track-lvl-num { font-size:26px; font-weight:600; line-height:1; font-family:var(--cond); }
.track-lvl-lbl { font-size:9px; color:var(--faint); letter-spacing:.3em; font-family:var(--cond); }
.xp-track { background:#0f0f12; border:none; height:6px;
  overflow:hidden; position:relative; padding:0; }
.xp-fill { height:100%; transition:width .6s cubic-bezier(.3,1.2,.5,1); }
.xp-text { font-size:10px; color:var(--dim); text-align:right; margin-top:5px;
  font-family:var(--cond); letter-spacing:.12em; }
.decay-warn { font-size:11px; color:var(--red); font-weight:700; margin-top:8px;
  background:rgba(255,85,85,.07); border:1px solid var(--red); padding:4px 8px; }
.decay-soon { font-size:10px; color:var(--gold); margin-top:6px; }

/* Level-up celebration overlay */
#levelup-overlay { position:fixed; inset:0; z-index:500; display:none;
  align-items:center; justify-content:center; background:rgba(8,8,10,.92); }
.levelup-box { text-align:center; color:#fff; animation:lvlPop .5s cubic-bezier(.2,1.5,.4,1);
  border-top:1px solid var(--green); border-bottom:1px solid var(--green);
  padding:34px 46px; }
.levelup-burst { font-size:13px; color:var(--green); font-weight:700; letter-spacing:.55em;
  font-family:var(--cond); text-transform:uppercase; }
.levelup-title { font-size:26px; font-weight:600; margin:8px 0 2px;
  font-family:var(--cond); letter-spacing:.3em; color:var(--txt);
  background:none; -webkit-background-clip:unset; -webkit-text-fill-color:var(--txt); }
.levelup-cat { font-size:16px; font-weight:600; margin-top:10px; letter-spacing:.12em; }
.levelup-lvl { font-size:66px; font-weight:700; margin:4px 0; font-family:var(--cond); }
.levelup-tap { font-size:10px; color:rgba(255,255,255,.45); margin-top:20px;
  letter-spacing:.3em; font-family:var(--cond); text-transform:uppercase; }
@keyframes lvlPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
.confetti { position:absolute; width:3px; height:14px; top:-16px;
  animation:fall linear forwards; }
@keyframes fall { to { transform:translateY(105vh) rotate(200deg); opacity:.3; } }
/* XP gain toast */
#xp-toast { position:fixed; bottom:calc(120px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--bg); color:var(--txt); border:1px solid var(--green);
  padding:8px 20px; font-size:15px; font-weight:600; z-index:200; display:none;
  font-family:var(--cond); letter-spacing:.16em; }

/* Modals */
.overlay { position:fixed; inset:0; background:rgba(8,8,10,.78);
  display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-box { background:var(--panel); border:1px solid var(--line);
  border-top:3px solid var(--green);
  padding:22px; width:340px; max-width:93vw;
  max-height:90dvh; overflow-y:auto; }
.modal-title { margin:0 0 14px; font-size:15px; font-weight:600; color:var(--txt);
  font-family:var(--cond); letter-spacing:.2em; }
.modal-sub { font-size:12px; color:var(--dim); margin:0 0 14px; }
.field-label { font-size:10px; color:var(--dim); margin-bottom:4px; display:block;
  font-family:var(--cond); letter-spacing:.26em; text-transform:uppercase; }
/* 16px inputs: prevents iOS Safari from auto-zooming the page on focus */
.field-input { width:100%; border:1px solid var(--line); background:#0f0f12;
  color:var(--txt); padding:10px 12px; font-size:16px; margin-bottom:10px; font-family:inherit; }
.field-input::placeholder { color:var(--faint); }
textarea.field-input { height:76px; resize:vertical; }
.chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
.chip { padding:8px 13px; font-size:13px; cursor:pointer; border:1px solid; background:none; }
.part-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.part-chip { padding:7px 13px; font-size:13px; cursor:pointer; border:1px solid; background:none; }
.btn-row { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; padding:13px; cursor:pointer; font-size:14px; letter-spacing:.08em; }
.btn-primary { background:var(--green); color:#fff; border:1px solid var(--green); font-weight:700; }
.btn-secondary { background:none; color:var(--txt); border:1px solid var(--line); }
.check-row { display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer;
  padding:6px 0; }
.check-row input { width:20px; height:20px; accent-color:var(--green); cursor:pointer; }

/* Save toast */
#toast { position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--bg); color:#fff; border:1px solid var(--txt); padding:10px 20px;
  font-size:13px; z-index:200; display:none; }

/* Monthly achievement calendar */
.mcal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
.mcal-hdr { text-align:center; font-size:10px; color:var(--dim); padding:1px 0;
  font-family:var(--cond); letter-spacing:.1em; }
.mcal-cell { background:var(--panel2); border:1px solid var(--line); padding:2px 2px 3px; }
.mcal-cell.empty { background:none; border-color:transparent; }
.mcal-cell.today { border-color:var(--green); }
.mcal-num { font-size:9px; color:var(--dim); line-height:1.1; }
.mcal-cell.today .mcal-num { color:var(--green); font-weight:700; }
.mcal-slots { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; margin-top:2px; }
.mcal-slot { aspect-ratio:1; background:#0f0f12; border:1px solid #1e1e24; }
.mcal-legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:10px; color:var(--dim); }
.mcal-legend span { display:inline-flex; align-items:center; gap:3px; }
.mcal-legend i { width:9px; height:9px; display:inline-block; }

/* Heatmap (month calendar / year grid) */
.hm-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.hm-chip { background:none; border:1px solid var(--line); color:var(--dim); font-size:11px;
  padding:4px 9px; cursor:pointer; font-family:var(--cond); letter-spacing:.08em; }
.hm-chip.active { color:#fff; border-color:transparent; font-weight:700; }
.hm-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
.hm-summary div { background:var(--panel2); border:1px solid var(--line); padding:6px 2px; text-align:center; }
.hm-summary b { display:block; font-size:16px; font-family:var(--cond); letter-spacing:.06em; line-height:1.2; }
.hm-summary span { font-size:9px; color:var(--dim); }
.tr-row { display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:10px; padding:7px 0;
  border-bottom:1px solid var(--line); font-size:12px; }
.tr-row:last-of-type { border-bottom:none; }
.tr-row.now .tr-lbl { color:var(--gold); }
.tr-lbl { font-family:var(--cond); letter-spacing:.06em; color:var(--txt); }
.tr-bar { height:8px; background:#ffffff10; position:relative; overflow:hidden; }
.tr-bar i { position:absolute; inset:0 auto 0 0; background:var(--gold); }
.tr-val { color:var(--dim); text-align:right; white-space:nowrap; font-size:11px; }
.tr-val b { color:var(--txt); font-weight:600; font-size:12px; }
.hm-jump { display:block; margin:8px 0 0 auto; min-height:36px; padding:0 14px; border-radius:999px;
  border:1px solid var(--line); background:none; color:var(--gold); font-size:12px; cursor:pointer; }
.hm-jump[hidden] { display:none; }
.hm-month { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.hm-cell { aspect-ratio:1; background:#0f0f12; border:1px solid #1e1e24; position:relative;
  font-size:9px; color:var(--dim); padding:2px 3px; cursor:pointer; box-sizing:border-box; }
.hm-cell.empty { background:none; border-color:transparent; cursor:default; }
.hm-cell.today { border-color:#fff; }
.hm-cell.lit { color:#fff; }
.hm-cell.sel { outline:2px solid var(--gold); outline-offset:-1px; }
.hm-cell .hm-n { position:absolute; right:3px; bottom:1px; font-size:11px; font-weight:700; }
.hm-year-row { display:flex; align-items:flex-start; }
.hm-ylabels { display:grid; grid-template-rows:repeat(7,11px); gap:2px; font-size:8px; color:var(--dim);
  margin-right:4px; margin-top:14px; flex-shrink:0; line-height:11px; }
.hm-year-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; flex:1; }
.hm-months { display:grid; grid-auto-flow:column; grid-auto-columns:13px; font-size:9px; color:var(--dim);
  height:12px; margin-bottom:2px; white-space:nowrap; }
.hm-year { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); grid-auto-columns:11px; gap:2px; }
.hm-ycell { width:11px; height:11px; background:#0f0f12; border:1px solid #1e1e24; box-sizing:border-box; cursor:pointer; }
.hm-ycell.today { border-color:#fff; }
.hm-ycell.sel { outline:2px solid var(--gold); outline-offset:-1px; }
.hm-ycell.empty { visibility:hidden; }
.hm-info { font-size:11px; color:var(--dim); margin-top:8px; min-height:14px; }
.hm-legend { display:flex; align-items:center; gap:3px; font-size:9px; color:var(--dim);
  margin-top:6px; justify-content:flex-end; }
.hm-legend i { width:10px; height:10px; display:inline-block; background:#0f0f12; border:1px solid #1e1e24; }

/* Hero character (dossier profile style) */
.hero-sprite { width:auto; height:148px; display:block;
  filter:saturate(.9) contrast(1.03); }
/* 2-frame idle animation: the img holds both frames side by side, the clip
   shows one frame, and the img steps left by exactly one frame width */
.hero-sprite-clip { display:block; overflow:hidden; }
.hero-sprite.anim2 { animation:heroStep 1s steps(1,end) infinite; }
@keyframes heroStep { 50% { transform:translateX(-50%); } }
.hero-sprite.monk-idle.anim2 { animation-duration:1.6s; }
@media(prefers-reduced-motion:reduce) { .hero-sprite.monk-idle { animation:none; } }
/* Tap-to-expand fullscreen viewer */
.hero-compact .hero-sprite-box { cursor:pointer; }
#hero-zoom { flex-direction:column; gap:12px; background:rgba(10,10,12,.96); cursor:pointer; }
#hero-zoom .hero-sprite { height:min(56vh,460px); }
#hero-zoom .hero-sprite.monk-idle { height:min(56vh,460px,108vw); }
.hero-zoom-job { font-size:13px; color:var(--gold); letter-spacing:.3em;
  font-family:var(--cond); text-transform:uppercase; }
.hero-zoom-lvl { font-size:30px; font-weight:700; line-height:1; }
.hero-zoom-hint { font-size:11px; color:var(--dim); margin-top:10px; }
.hero-job { font-size:11px; color:var(--gold); letter-spacing:.3em; margin-bottom:4px;
  font-family:var(--cond); text-transform:uppercase; }
/* Compact side-by-side: character left, level+job+stats right */
.hero-compact { display:flex; align-items:center; gap:14px; text-align:left; padding:14px; }
.hero-compact .hero-sprite { margin:0; }
.hero-compact .hero-sprite-box { flex-shrink:0;
  border:1px solid var(--line); padding:6px; background:#0f0f12; }
.hero-compact::after { display:none; }
.hero-info { flex:1; min-width:0; }
.hero-info .hero-level { font-size:30px; margin:0; line-height:1; }
.hero-info .hero-job { font-size:10px; margin:2px 0 7px; }
.hero-info .hero-sub { font-size:10px; margin-top:6px; }
.char-stat-row { display:flex; align-items:center; gap:6px; padding:2px 0; }
.char-stat-lbl { font-size:11px; min-width:74px; }
.char-stat-bar { flex:1; background:#0f0f12; border:none; height:5px; padding:0; }
.char-stat-fill { height:100%; }
.char-stat-val { font-size:13px; font-weight:600; min-width:20px; text-align:right;
  font-family:var(--cond); }

/* Press feedback: flat dim instead of pixel shift */
.nav-btn:active,.add-btn:active,.btn:active,.rec-btn:active,.mini-btn:active,
.period-nav button:active { opacity:.55; }

/* ── Habits: 今日 tab ─────────────────────────────────────────────────────── */
.cal-switch { margin-top:12px; padding:6px 12px; font-size:12px; cursor:pointer; color:var(--txt); }
.cal-back { align-self:flex-start; margin:0 16px 10px; }
#today-view { flex:1; overflow-y:auto; padding:6px 16px 28px; }
.hb-top { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:4px 2px 14px; }
.hb-top .eyebrow { margin:0 0 4px; color:var(--gold); font:500 10px var(--cond); letter-spacing:.18em; }
.hb-top h1 { margin:0; font-size:24px; letter-spacing:-.03em; line-height:1.2; }
.hb-wallet { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.hb-pill { display:inline-flex; align-items:center; gap:4px; min-height:36px; padding:0 11px; border-radius:999px;
  border:1px solid #3a3528; background:#17181c; color:var(--txt); font:600 14px var(--cond); letter-spacing:.04em; cursor:pointer; }
.hb-pill.shield { border-color:#2a2c32; color:var(--dim); cursor:default; }
.hb-add { width:40px; height:40px; border-radius:50%; border:1px solid #4a4335; background:#1d1b16; color:var(--gold);
  font-size:22px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.hb-weeknav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 6px; min-height:36px; }
.hb-weeknav button { min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:none;
  color:var(--dim); font-size:12px; cursor:pointer; }
.hb-weeknav button:disabled { opacity:.35; cursor:default; }
.hb-weeknav span { font:500 12px var(--cond); letter-spacing:.08em; color:var(--dim); }
.hb-pick { position:relative; display:inline-block; cursor:pointer; }
.hb-pick input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; }
.hb-pick h1::after { content:"▾"; font-size:13px; color:var(--dim); margin-left:6px; vertical-align:middle; }
.hb-days { display:flex; gap:4px; margin:0 -2px 8px; padding:0 2px; overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.hb-days::-webkit-scrollbar { display:none; }

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const DAYS    = ["月","火","水","木","金","土","日"];
const DAY_KEYS= ["mon","tue","wed","thu","fri","sat","sun"];

const WORKOUT_PARTS = [
  {id:"chest",    label:"胸",   color:"#EF5350"},
  {id:"back",     label:"背中", color:"#E53935"},
  {id:"shoulder", label:"肩",   color:"#F44336"},
  {id:"arm",      label:"腕",   color:"#EF9A9A"},
  {id:"leg",      label:"脚",   color:"#C62828"},
];
const BASE_CATS = [
  {id:"instrument",label:"楽器練習",icon:"🎵",color:"#7986CB",light:"#E8EAF6"},
  {id:"cooking",   label:"自炊",    icon:"🍳",color:"#66BB6A",light:"#E8F5E9"},
  {id:"medicine",  label:"専門医勉強",icon:"🧠",color:"#FFA726",light:"#FFF3E0"},
  {id:"english",   label:"英語学習",icon:"🌐",color:"#26C6DA",light:"#E0F7FA"},
];
const WORKOUT_CATS = WORKOUT_PARTS.map(p=>({
  id:`workout_${p.id}`,label:`筋トレ（${p.label}）`,icon:"💪",
  color:p.color,light:"#FFEBEE",part:p,
}));
const ALL_CATS = [...WORKOUT_CATS,...BASE_CATS];
const CAT_MAP  = {};
ALL_CATS.forEach(c=>CAT_MAP[c.id]=c);
// Legacy fallback for removed parts (体幹/全身) so old saved entries still render
CAT_MAP["workout_core"]={id:"workout_core",label:"筋トレ（体幹）",icon:"💪",color:"#B71C1C",light:"#FFEBEE",part:{id:"core",label:"体幹",color:"#B71C1C"}};
CAT_MAP["workout_full"]={id:"workout_full",label:"筋トレ（全身）",icon:"💪",color:"#FF5252",light:"#FFEBEE",part:{id:"full",label:"全身",color:"#FF5252"}};
const catById  = id=>CAT_MAP[id];

// ── State ─────────────────────────────────────────────────────────────────────
let tab       = "today";
let records   = JSON.parse(localStorage.getItem("wt_records")||"{}");
let statsMode = "month";              // "week" | "month" | "year"
let statsWeek = getWeekKey(new Date()); // 週間表示の月曜日
let statsYear = new Date().getFullYear();
let statsMonth= new Date().getMonth();  // 0-11
let heatTrack = "all";                 // "all" | CAL_TRACKS id
let heatSel   = null;                  // tapped date key in the heatmap

// ── Helpers ───────────────────────────────────────────────────────────────────
function getWeekKey(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function getWeekDates(wk){
  const [y,m,d]=wk.split("-").map(Number);
  return DAY_KEYS.map((_,i)=>new Date(y,m-1,d+i));
}
function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
// ── XP / Level system ─────────────────────────────────────────────────────────
// XP per completed task = 10 base + duration bonus (1xp/5min, max 20) + rating bonus (rating*2)
// 評価の入力はなくなったが、過去の記録の評価ぶんはレベルが下がらないよう残している
function xpForRecord(rec){
  if(!rec?.done)return 0;
  let xp=10;
  if(rec.duration)xp+=Math.min(20,Math.floor((parseInt(rec.duration)||0)/5));
  if(rec.rating)xp+=rec.rating*2;
  return xp;
}
// Level curve: XP needed to REACH level L from start = 50 * L^1.6 (cumulative)
// We invert to get level from total XP.
function levelFromXP(totalXP){
  let lvl=1;
  while(totalXP>=xpToReach(lvl+1))lvl++;
  return lvl;
}
function xpToReach(level){ // cumulative XP needed to be AT this level
  if(level<=1)return 0;
  return Math.round(50*Math.pow(level-1,1.6));
}
function levelProgress(totalXP){
  const lvl=levelFromXP(totalXP);
  const cur=xpToReach(lvl), next=xpToReach(lvl+1);
  return { lvl, into:totalXP-cur, span:next-cur, pct:Math.round((totalXP-cur)/(next-cur)*100) };
}
// Rank title based on level
function rankTitle(lvl){
  if(lvl>=40)return "レジェンド";
  if(lvl>=30)return "達人";
  if(lvl>=20)return "エキスパート";
  if(lvl>=12)return "上級者";
  if(lvl>=6) return "中級者";
  if(lvl>=3) return "見習い";
  return "ビギナー";
}
// Compute total XP per category across all records
function computeXP(){
  const xp={};
  ALL_CATS.forEach(c=>xp[c.id]=0);
  // include legacy
  xp["workout_core"]=0; xp["workout_full"]=0;
  Object.keys(records).forEach(wk=>{
    DAY_KEYS.forEach(dk=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(xp[catId]===undefined)xp[catId]=0;
        xp[catId]+=xpForRecord(day[catId]);
      });
    });
  });
  return xp;
}
// Last completion date (Date object) per track ("workout" combined, or base cat id). null if never.
function computeLastDone(){
  const last={};  // trackId → Date
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        const trackId=catId.startsWith("workout_")?"workout":catId;
        const d=dates[di];
        if(!last[trackId]||d>last[trackId])last[trackId]=d;
      });
    });
  });
  return last;
}
// ── Decay config ──
const DECAY_GRACE_DAYS = 7;   // サボってもこの日数までは減らない
const DECAY_PER_DAY    = 8;   // 猶予超過後、1日あたり減るXP（ゆるやか）
function daysSince(date){
  if(!date)return 0;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(date); d.setHours(0,0,0,0);
  return Math.floor((today-d)/(1000*60*60*24));
}
// Apply decay to a raw XP total given the last-done date.
function applyDecay(rawXP, lastDate){
  if(!lastDate||rawXP<=0)return {xp:rawXP, decayDays:0, lost:0};
  const idle=daysSince(lastDate);
  const decayDays=Math.max(0, idle-DECAY_GRACE_DAYS);
  const lost=Math.min(rawXP, decayDays*DECAY_PER_DAY);
  return { xp:Math.max(0,rawXP-lost), decayDays, lost, idle };
}
// Workout XP combined (all parts → one "筋トレ" track)
function workoutTotalXP(xp){
  return WORKOUT_CATS.reduce((a,c)=>a+(xp[c.id]||0),0)+(xp["workout_core"]||0)+(xp["workout_full"]||0);
}
// Overall total level = sum of all category levels
function overallStats(xp){
  let totalLvl=0, totalXP=0;
  const tracks=getTracks(xp);
  tracks.forEach(t=>{ totalLvl+=t.lvl; totalXP+=t.xp; });
  return { totalLvl, totalXP, tracks };
}
// Build display tracks: 筋トレ(合算) + 4 base cats, with decay applied
function getTracks(xp){
  const last=computeLastDone();
  const tracks=[];
  const wRaw=workoutTotalXP(xp);
  const wD=applyDecay(wRaw, last["workout"]);
  const wp=levelProgress(wD.xp);
  tracks.push({ id:"workout", label:"筋トレ", icon:"💪", color:"#E57373",
    xp:wD.xp, rawXP:wRaw, lvl:wp.lvl, into:wp.into, span:wp.span, pct:wp.pct,
    decayDays:wD.decayDays, lost:wD.lost, idle:wD.idle, lastDate:last["workout"]||null });
  BASE_CATS.forEach(c=>{
    const raw=xp[c.id]||0;
    const dd=applyDecay(raw, last[c.id]);
    const p=levelProgress(dd.xp);
    tracks.push({ id:c.id, label:c.label, icon:c.icon, color:c.color,
      xp:dd.xp, rawXP:raw, lvl:p.lvl, into:p.into, span:p.span, pct:p.pct,
      decayDays:dd.decayDays, lost:dd.lost, idle:dd.idle, lastDate:last[c.id]||null });
  });
  return tracks;
}

// ── Save to localStorage ──────────────────────────────────────────────────────
function persist(){
  localStorage.setItem("wt_records",   JSON.stringify(records));
}
function saveData(){
  persist();
  showToast();
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg||"✅ 保存しました";
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1800);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tab-btn");if(!b)return;
  tab=b.dataset.tab;
  render();
});

// ── Job character (external PNG sprites, job × level-tier) ────────────────────
// Same person throughout; the job comes from what you keep doing, and the
// costume evolves with level (Lv1 = modern life → Lv30 = full fantasy).
// Art: sprites/<file>_lv<tier>.png (tier 1/10/20/30). Missing tiers fall back
// to lower tiers → sprites/<file>.png → the primary base job's art, so new
// art can be dropped in one file at a time without breaking anything.
const TRACK_JOB={workout:"monk",instrument:"trickster",english:"redmage",medicine:"whitemage",cooking:"traveler"};
const JOB_DEF={
  // base jobs (one per habit)
  novice:    {name:"みならい",   file:"novice"},
  monk:      {name:"モンク",     file:"monk"},
  trickster: {name:"遊び人",     file:"bard"},
  redmage:   {name:"赤魔道士",   file:"redmage"},
  whitemage: {name:"白魔道士",   file:"whitemage"},
  traveler:  {name:"旅人",       file:"chef"},
  // composite jobs (both habits at the tier level unlock these)
  paladin:   {name:"パラディン", file:"paladin",   pair:["workout","medicine"]},
  sage:      {name:"賢者",       file:"sage",      pair:["medicine","english"]},
  bardic:    {name:"吟遊詩人",   file:"bardic",    pair:["instrument","english"]},
  ranger:    {name:"レンジャー", file:"ranger",    pair:["workout","cooking"]},
  apothecary:{name:"薬師",       file:"apothecary",pair:["medicine","cooking"]},
  adventurer:{name:"冒険家",     file:"adventurer",pair:["english","cooking"]},
  dancer:    {name:"踊り子",     file:"dancer",    pair:["workout","instrument"]},
};
const TIER_PREFIX={10:"見習い",20:"",30:"マスター",40:"マスター"};
function tierOf(lvl){return lvl>=40?40:lvl>=30?30:lvl>=20?20:lvl>=10?10:1;}
// Decide the current job: a qualifying composite pair (both >= Lv10) beats the
// single top stat; among pairs, the one with the higher shared level wins.
function jobState(tracks){
  const by=id=>tracks.find(t=>t.id===id);
  let best=null;
  Object.entries(JOB_DEF).forEach(([key,def])=>{
    if(!def.pair)return;
    const a=by(def.pair[0]),b=by(def.pair[1]);
    if(!a||!b)return;
    const m=Math.min(a.lvl,b.lvl);
    if(m>=10&&(!best||m>best.min))
      best={key,min:m,primary:TRACK_JOB[a.lvl>=b.lvl?a.id:b.id]};
  });
  if(best)return {key:best.key,tier:tierOf(best.min),primary:best.primary,composite:true};
  const max=Math.max(...tracks.map(t=>t.lvl));
  const top=tracks.filter(t=>t.lvl===max);
  if(max<=1||top.length===tracks.length)return {key:"novice",tier:1,primary:"novice",composite:false};
  const jk=TRACK_JOB[top[0].id]||"novice";
  return {key:jk,tier:tierOf(max),primary:jk,composite:false};
}
function jobDisplayName(st){
  const base=JOB_DEF[st.key].name;
  return st.composite?(TIER_PREFIX[st.tier]??"")+base:base;
}
// Ordered list of sprite paths to try for this job state.
// "<file>_lv<t>x2.png" is a 2-frame idle-animation sheet (frames side by side,
// equal width); it is preferred over the still "<file>_lv<t>.png".
function spriteCandidates(st){
  const tiers=[40,30,20,10,1].filter(t=>t<=st.tier);
  const out=[];
  const push=file=>{
    tiers.forEach(t=>{
      if(file==='monk')out.push(`sprites/monk-idle/lv${t}.webp`,`sprites/monk-actions/lv${t}.webp`);
      out.push(`sprites/${file}_lv${t}x2.png`);out.push(`sprites/${file}_lv${t}.png`);
    });
    out.push(`sprites/${file}x2.png`);
    out.push(`sprites/${file}.png`);
  };
  push(JOB_DEF[st.key].file);
  if(st.key!==st.primary)push(JOB_DEF[st.primary].file);
  if(!out.includes("sprites/novice.png"))out.push("sprites/novice.png");
  return out;
}
function sizeHeroSprite(img){
  const idle=img.src.includes('sprites/monk-idle/');
  const action=img.src.includes('sprites/monk-actions/');
  const two=idle||img.src.includes('x2.png');
  const frames=action?3:two?2:1;
  img.classList.toggle('monk-idle',idle||action);
  img.classList.toggle('anim2',two);
  const clip=img.closest('.hero-sprite-clip');
  if(clip)clip.style.width=frames>1?(img.offsetWidth/frames)+'px':'';
}
function setHeroSprite(img,st){
  const cands=spriteCandidates(st);
  let i=0;
  img.onerror=()=>{i++;if(i<cands.length)img.src=cands[i];else img.onerror=null;};
  img.onload=()=>sizeHeroSprite(img);
  img.src=cands[0];
}
window.addEventListener('resize',()=>{
  document.querySelectorAll('.hero-sprite').forEach(img=>{
    if(img.complete&&img.naturalWidth&&img.getClientRects().length)sizeHeroSprite(img);
  });
});
// Home-screen icon = the hero's face for the current job × tier
// (icons/avatar/, made by tools/make_home_icon.py). iPhone copies the
// apple-touch-icon once, when "Add to Home Screen" is tapped, so the icon shows
// the avatar as of that moment; it does not follow later level-ups.
const AVATAR_ICONS=new Set(["bard","bard_lv1","bard_lv10","bard_lv20","bard_lv30","bard_lv40","blackmage","chef","monk","monk_lv1","monk_lv10","monk_lv20","monk_lv30","monk_lv40","novice","redmage_lv1","redmage_lv10","redmage_lv20","redmage_lv30","redmage_lv40","whitemage","whitemage_lv1","whitemage_lv10","whitemage_lv20","whitemage_lv30","whitemage_lv40"]);
function updateHomeIcon(){
  const link=document.getElementById("home-icon");
  if(!link)return;
  const name=spriteCandidates(jobState(getTracks(computeXP())))
    .map(p=>p.match(/^sprites\/(\w+?)(_lv\d+)?(?:x2)?\.png$/))
    .filter(Boolean).map(m=>m[1]+(m[2]||"")).find(n=>AVATAR_ICONS.has(n));
  const href=`icons/avatar/${name||"novice"}.png`;
  if(link.getAttribute("href")!==href)link.setAttribute("href",href);
}
// Fullscreen character viewer
function openHeroZoom(src,jobName,lvl){
  const ov=document.getElementById("hero-zoom");
  const img=ov.querySelector("img");
  const clip=ov.querySelector(".hero-sprite-clip");
  img.classList.remove("anim2","monk-idle"); clip.style.width="";
  img.onload=()=>sizeHeroSprite(img);
  img.src=src;
  ov.querySelector(".hero-zoom-job").textContent="JOB─"+jobName;
  ov.querySelector(".hero-zoom-lvl").textContent="Lv."+lvl;
  ov.style.display="flex";
}
document.getElementById("hero-zoom").addEventListener("click",e=>{
  e.currentTarget.style.display="none";
});

// ── Status / Level View ───────────────────────────────────────────────────────
function renderStatus(){
  const cont=document.getElementById("content");
  cont.innerHTML="";
  const wrap=el("div","");wrap.id="status-view";
  cont.appendChild(wrap);   // attach now so the hero canvas is connected when first drawn

  const xp=computeXP();
  const tracks=getTracks(xp);
  const totalLvl=tracks.reduce((a,t)=>a+t.lvl,0);
  const totalXP=tracks.reduce((a,t)=>a+t.xp,0);

  // RPG-style stat labels: each track becomes a stat
  const STAT_DEFS=[
    {id:"workout",   label:"ちから"},
    {id:"medicine",  label:"かしこさ"},
    {id:"instrument",label:"センス"},
    {id:"english",   label:"ことば"},
    {id:"cooking",   label:"たいりょく"},
  ];
  let doneTotal=0; const doneDays=new Set();
  Object.keys(records).forEach(wk=>{
    const wdates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(cid=>{
        if(day[cid]?.done){doneTotal++;doneDays.add(wdates[di].toDateString());}
      });
    });
  });
  const maxStat=Math.max(10,...tracks.map(t=>t.lvl));

  // Compact hero card: character on the left, level + job + stat bars on the right
  const jobSt=jobState(tracks);
  const jobName=jobDisplayName(jobSt);
  const hero=el("div","hero-card hero-compact");
  hero.innerHTML=`
    <span class="hero-sprite-box"><span class="hero-sprite-clip"><img class="hero-sprite" alt="${jobName}"></span></span>
    <div class="hero-info">
      <div class="hero-level">Lv.${totalLvl}</div>
      <div class="hero-job">JOB─${jobName}</div>
      ${STAT_DEFS.map(s=>{
        const t=tracks.find(x=>x.id===s.id);
        if(!t)return "";
        const pct=Math.round(t.lvl/maxStat*100);
        return `<div class="char-stat-row">
          <span class="char-stat-lbl">${t.icon} ${s.label}</span>
          <div class="char-stat-bar"><div class="char-stat-fill" style="width:${pct}%;background:${t.color}"></div></div>
          <span class="char-stat-val">${t.lvl}</span>
        </div>`;
      }).join("")}
      <div class="hero-sub">総XP ${totalXP} ・ 冒険 ${doneDays.size}日 ・ 達成 ${doneTotal}回</div>
    </div>`;
  wrap.appendChild(hero);
  const heroImg=hero.querySelector(".hero-sprite");
  setHeroSprite(heroImg,jobSt);
  hero.querySelector(".hero-sprite-box").onclick=()=>openHeroZoom(heroImg.src,jobName,totalLvl);
  window.HabitUI?.renderRewardCard(wrap);

  // Track cards
  tracks.forEach(t=>{
    const card=el("div","track-card");
    // Decay status line
    let statusLine="";
    if(t.rawXP>0){
      if(t.decayDays>0){
        // Currently decaying
        statusLine=`<div class="decay-warn">⚠️ ${t.idle}日サボり中 ・ 減衰 −${t.lost} XP</div>`;
      }else if(t.lastDate){
        const remain=DECAY_GRACE_DAYS-(t.idle||0);
        if((t.idle||0)>=4){
          statusLine=`<div class="decay-soon">あと${remain}日で減衰開始（最後の実施から${t.idle}日）</div>`;
        }
      }
    }
    card.innerHTML=`
      <div class="track-top">
        <div class="track-icon" style="background:${t.color}22">${t.icon}</div>
        <div>
          <div class="track-name">${t.label}</div>
          <div class="track-rank">${rankTitle(t.lvl)}</div>
        </div>
        <div class="track-lvl">
          <div class="track-lvl-num" style="color:${t.color}">${t.lvl}</div>
          <div class="track-lvl-lbl">LEVEL</div>
        </div>
      </div>
      <div class="xp-track"><div class="xp-fill" style="width:${t.pct}%;background:${t.color}"></div></div>
      <div class="xp-text">${t.into} / ${t.span} XP　（次のレベルまで ${t.span-t.into}）</div>
      ${statusLine}`;
    wrap.appendChild(card);
  });

  // Info note
  wrap.appendChild(el("p","",
    `<span style="font-size:11px;color:#bbb;display:block;text-align:center;margin-top:8px;line-height:1.6">
      予定を「完了」にするとXP獲得（基本10 + 時間ボーナス + 評価ボーナス）<br>
      筋トレは全部位の合算でレベルアップします<br>
      ${DECAY_GRACE_DAYS}日以上あくと1日 −${DECAY_PER_DAY} XP ずつゆるやかに減衰します
    </span>`));
}

// ── Stats View ────────────────────────────────────────────────────────────────
// Aggregate completed counts for a given period filter.
// filterFn(dateObj) → true if the entry's date is in the selected period.
function aggregateStats(filterFn){
  const st={};
  ALL_CATS.forEach(c=>st[c.id]={done:0,total:0,totalMin:0});
  // 予定の有無に関係なく、完了した記録をすべて数える(今日タブ・ジム・Neuro Learnの記録も含む)
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      if(!filterFn(dates[di]))return;
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(cat=>{
        const rec=day[cat];
        if(!st[cat]||!rec?.done)return;
        st[cat].done++;
        if(rec.duration)st[cat].totalMin+=parseInt(rec.duration)||0;
      });
    });
  });
  return st;
}

// Fixed 5-track order for the achievement calendar (matches the STATUS panel)
const CAL_TRACKS=[
  {id:"workout",   color:"#E57373", label:"筋トレ", icon:"💪"},
  {id:"medicine",  color:"#FFA726", label:"専門医", icon:"🧠"},
  {id:"instrument",color:"#7986CB", label:"楽器",   icon:"🎵"},
  {id:"english",   color:"#26C6DA", label:"英語",   icon:"🌐"},
  {id:"cooking",   color:"#66BB6A", label:"自炊",   icon:"🍳"},
];
function trackOf(catId){return catId.startsWith("workout_")?"workout":catId;}
// Which of the 5 tracks were completed each day: {dayOfMonth: Set(trackId)}
function completedTracksForMonth(year,month){
  const map={};
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      const d=dates[di];
      if(d.getFullYear()!==year||d.getMonth()!==month)return;
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        (map[d.getDate()]=map[d.getDate()]||new Set()).add(trackOf(catId));
      });
    });
  });
  return map;
}

// ── Heatmap ───────────────────────────────────────────────────────────────────
function dateKeyOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
// All completed quests per calendar day: {dateKey: {total, byTrack:{workout:n,...}}}
function dailyDoneMap(){
  const map={};
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      const key=dateKeyOf(dates[di]);
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        const m=(map[key]=map[key]||{total:0,byTrack:{}});
        m.total++;
        const t=trackOf(catId);
        m.byTrack[t]=(m.byTrack[t]||0)+1;
      });
    });
  });
  return map;
}
// 統計の表示期間 {from,to}(Date, 両端を含む)
function statsRange(){
  if(statsMode==="week"){
    const [y,m,d]=statsWeek.split("-").map(Number);
    return {from:new Date(y,m-1,d),to:new Date(y,m-1,d+6)};
  }
  if(statsMode==="month")return {from:new Date(statsYear,statsMonth,1),to:new Date(statsYear,statsMonth+1,0)};
  return {from:new Date(statsYear,0,1),to:new Date(statsYear,11,31)};
}
// 日ごとの合計時間(分) {dateKey: 分}
function dailyMinutesMap(){
  const map={};
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      const key=dateKeyOf(dates[di]);
      Object.values(day).forEach(r=>{
        const n=r?.done?parseInt(r.duration,10)||0:0;
        if(n>0)map[key]=(map[key]||0)+n;
      });
    });
  });
  return map;
}
function fmtMin(n){
  if(!n)return "—";
  const h=Math.floor(n/60),m=n%60;
  return h?`${h}時間${m?m+"分":""}`:`${m}分`;
}
// 推移: 週間=日ごと、月間=週ごと、年間=月ごとのまとめ
function renderTrendCard(){
  const done=dailyDoneMap(), mins=dailyMinutesMap();
  const {from,to}=statsRange();
  const today=new Date(); today.setHours(0,0,0,0);
  const buckets=[];
  if(statsMode==="week"){
    for(const d=new Date(from);d<=to;d.setDate(d.getDate()+1))
      buckets.push({label:`${d.getMonth()+1}/${d.getDate()}(${DAYS[(d.getDay()+6)%7]})`,from:new Date(d),to:new Date(d)});
  }else if(statsMode==="month"){
    const d=new Date(from); d.setDate(d.getDate()-((d.getDay()+6)%7));
    for(;d<=to;d.setDate(d.getDate()+7)){
      const a=new Date(Math.max(d,from)), e=new Date(d); e.setDate(e.getDate()+6);
      const b=new Date(Math.min(e,to));
      buckets.push({label:`${a.getMonth()+1}/${a.getDate()}〜`,from:a,to:b});
    }
  }else{
    for(let m=0;m<12;m++)buckets.push({label:`${m+1}月`,from:new Date(statsYear,m,1),to:new Date(statsYear,m+1,0)});
  }
  buckets.forEach(b=>{
    b.active=0;b.total=0;b.min=0;
    for(const d=new Date(b.from);d<=b.to;d.setDate(d.getDate()+1)){
      const k=dateKeyOf(d), n=done[k]?.total||0;
      if(n>0)b.active++;
      b.total+=n; b.min+=mins[k]||0;
    }
    b.now=today>=b.from&&today<=b.to;
    b.future=b.from>today;
  });
  const max=Math.max(1,...buckets.map(b=>b.total));
  const card=el("div","stats-card");
  buckets.forEach(b=>{
    const row=el("div","tr-row"+(b.now?" now":""));
    row.innerHTML=`<span class="tr-lbl">${b.label}</span>
      <span class="tr-bar"><i style="width:${(b.total/max*100).toFixed(1)}%"></i></span>
      <span class="tr-val">${b.future?"—":`<b>${b.total}</b>件${statsMode==="week"?"":` · ${b.active}日`} · ${fmtMin(b.min)}`}</span>`;
    card.appendChild(row);
  });
  const sum=buckets.reduce((a,b)=>({total:a.total+b.total,active:a.active+b.active,min:a.min+b.min}),{total:0,active:0,min:0});
  card.appendChild(el("p","hb-note",`合計 ${sum.total}件 ・ 活動 ${sum.active}日 ・ ${fmtMin(sum.min)}　（件数は完了した記録の数、時間は記録した分数の合計）`));
  return card;
}
function heatCount(m,track){
  if(!m)return 0;
  return track==="all"?m.total:(m.byTrack[track]||0);
}
const HEAT_ALPHA=[0,.3,.52,.76,1];
function heatLevel(n,track){
  if(n<=0)return 0;
  // 単一習慣は1日1回が普通なので1回で濃く、2回以上で最大
  return track==="all"?Math.min(4,n):Math.min(4,n+2);
}
function hexA(hex,a){
  const h=hex.replace("#","");
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
function heatBase(track){
  return track==="all"?"#c8a557":(CAL_TRACKS.find(t=>t.id===track)?.color||"#e01937");
}
function heatColor(n,track){
  const lv=heatLevel(n,track);
  return lv?hexA(heatBase(track),HEAT_ALPHA[lv]):"";
}
// Streak that ends on `d` (walks backwards while each day has a hit)
function streakEndingAt(map,track,d){
  const c=new Date(d); let n=0;
  while(heatCount(map[dateKeyOf(c)],track)>0){n++;c.setDate(c.getDate()-1);}
  return n;
}
// Period summary: active days / total count / best streak inside the period /
// current streak (only when the period includes today; a quiet today keeps
// yesterday's streak alive)
function heatSummary(map,track,from,to){
  let active=0,total=0,best=0,run=0;
  const today=new Date(); today.setHours(0,0,0,0);
  for(const d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    const n=heatCount(map[dateKeyOf(d)],track);
    if(n>0){active++;total+=n;run++;if(run>best)best=run;}else run=0;
  }
  let cur=null;
  if(today>=from&&today<=to){
    cur=streakEndingAt(map,track,today);
    if(cur===0){const y=new Date(today);y.setDate(y.getDate()-1);cur=streakEndingAt(map,track,y);}
  }
  return {active,total,best,cur};
}
function heatInfoText(map,key){
  const m=map[key];
  const [y,mo,d]=key.split("-").map(Number);
  const dt=new Date(y,mo-1,d);
  const head=`${mo}/${d}(${DAYS[(dt.getDay()+6)%7]})`;
  if(!m)return `${head} 記録なし`;
  const parts=CAL_TRACKS.filter(t=>m.byTrack[t.id])
    .map(t=>`${t.icon}${t.label}${m.byTrack[t.id]>1?"×"+m.byTrack[t.id]:""}`);
  return `${head} ${m.total}件 · ${parts.join("　")}`;
}

function renderHeatmapCard(){
  const map=dailyDoneMap();
  const card=el("div","stats-card");
  const today=new Date(); today.setHours(0,0,0,0);
  const todayKey=dateKeyOf(today);

  // ── Track filter chips ──
  const chips=el("div","hm-chips");
  [{id:"all",label:"すべて",color:"#c8a557"},...CAL_TRACKS].forEach(t=>{
    const b=el("button","hm-chip"+(heatTrack===t.id?" active":""),(t.icon||"")+t.label);
    if(heatTrack===t.id)b.style.background=t.color;
    b.onclick=()=>{heatTrack=t.id;heatSel=null;renderStats();};
    chips.appendChild(b);
  });
  card.appendChild(chips);

  // ── Period range ──
  const {from,to}=statsRange();
  const sm=heatSummary(map,heatTrack,from,to);
  const summary=el("div","hm-summary");
  summary.innerHTML=
    `<div><b>${sm.active}</b><span>活動日</span></div>`+
    `<div><b>${sm.total}</b><span>達成数</span></div>`+
    `<div><b>${sm.best}</b><span>最長連続</span></div>`+
    `<div><b>${sm.cur===null?"—":sm.cur}</b><span>現在連続</span></div>`;
  card.appendChild(summary);

  const info=el("div","hm-info");
  const jump=el("button","hm-jump","この日の記録を開く ›");
  jump.type="button";
  jump.onclick=()=>{ if(!heatSel)return; tab="today"; window.HabitUI?.openDay(heatSel); render(); };
  const select=(key,cell)=>{
    heatSel=key;
    card.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));
    if(cell)cell.classList.add("sel");
    info.textContent=heatInfoText(map,key);
    jump.hidden=key>todayKey;
  };

  if(statsMode!=="year"){
    // ── Week / Month: calendar heatmap ──
    const grid=el("div","hm-month");
    DAYS.forEach(d=>grid.appendChild(el("div","mcal-hdr",d)));
    const offset=(from.getDay()+6)%7;
    for(let i=0;i<offset;i++)grid.appendChild(el("div","hm-cell empty"));
    for(const day=new Date(from);day<=to;day.setDate(day.getDate()+1)){
      const dd=day.getDate();
      const key=dateKeyOf(day);
      const n=heatCount(map[key],heatTrack);
      const cell=el("div","hm-cell"+(key===todayKey?" today":"")+(n>0?" lit":"")+(key===heatSel?" sel":""));
      const bg=heatColor(n,heatTrack);
      if(bg)cell.style.background=bg;
      cell.appendChild(el("span","",String(dd)));
      if(n>0)cell.appendChild(el("span","hm-n",String(n)));
      cell.onclick=()=>select(key,cell);
      grid.appendChild(cell);
    }
    card.appendChild(grid);
  }else{
    // ── Year: week-column grid (Monday-start), horizontally scrollable ──
    const row=el("div","hm-year-row");
    const labels=el("div","hm-ylabels");
    DAYS.forEach((d,i)=>labels.appendChild(el("div","",i%2===0?d:"")));
    row.appendChild(labels);
    const scroll=el("div","hm-year-wrap");
    const months=el("div","hm-months");
    const grid=el("div","hm-year");
    const start=new Date(from); start.setDate(start.getDate()-((start.getDay()+6)%7)); // Monday on/before Jan 1
    let lastMonth=-1, col=0;
    for(const d=new Date(start);d<=to;d.setDate(d.getDate()+1)){
      const inYear=d.getFullYear()===statsYear;
      const isMon=(d.getDay()+6)%7===0;
      if(isMon){
        const lbl=el("div","");
        if(inYear&&d.getMonth()!==lastMonth){lbl.textContent=`${d.getMonth()+1}月`;lastMonth=d.getMonth();}
        months.appendChild(lbl);
        col++;
      }
      const key=dateKeyOf(d);
      const n=inYear?heatCount(map[key],heatTrack):0;
      const cell=el("div","hm-ycell"+(inYear?"":" empty")+(key===todayKey?" today":"")+(key===heatSel?" sel":""));
      const bg=heatColor(n,heatTrack);
      if(bg)cell.style.background=bg;
      if(inYear)cell.onclick=()=>select(key,cell);
      grid.appendChild(cell);
    }
    scroll.appendChild(months);scroll.appendChild(grid);
    row.appendChild(scroll);
    card.appendChild(row);
    // scroll to the latest week for the current year
    if(statsYear===today.getFullYear())requestAnimationFrame(()=>{scroll.scrollLeft=scroll.scrollWidth;});
  }

  const legend=el("div","hm-legend");
  legend.innerHTML=`少<i></i>`+[1,2,3,4].map(l=>`<i style="background:${hexA(heatBase(heatTrack),HEAT_ALPHA[l])}"></i>`).join("")+`多`;
  card.appendChild(legend);
  if(heatSel)info.textContent=heatInfoText(map,heatSel);
  else info.textContent="日をタップすると内訳を表示";
  card.appendChild(info);
  jump.hidden=!heatSel||heatSel>todayKey;
  card.appendChild(jump);
  return card;
}

function renderStats(){
  const cont=document.getElementById("content");
  cont.innerHTML="";
  const wrap=el("div","");wrap.id="stats-view";

  // ── Mode toggle ──
  const toggle=el("div","mode-toggle");
  [["week","週間"],["month","月間"],["year","年間"]].forEach(([m,label])=>{
    const b=el("button",statsMode===m?"active":"",label);
    b.onclick=()=>{statsMode=m;heatSel=null;renderStats();};
    toggle.appendChild(b);
  });
  wrap.appendChild(toggle);

  // ── Period nav ──
  const now=new Date();
  const pNav=el("div","period-nav");
  const prevB=el("button",null,"←");
  const nextB=el("button",null,"→");
  const lbl=el("span","period-label");
  if(statsMode==="week"){
    const {from,to}=statsRange();
    lbl.textContent=`${from.getMonth()+1}/${from.getDate()} 〜 ${to.getMonth()+1}/${to.getDate()}`;
    const step=n=>{const d=new Date(from);d.setDate(d.getDate()+7*n);statsWeek=getWeekKey(d);heatSel=null;renderStats();};
    prevB.onclick=()=>step(-1);
    nextB.onclick=()=>step(1);
    if(statsWeek>=getWeekKey(now))nextB.disabled=true;
  }else if(statsMode==="month"){
    lbl.textContent=`${statsYear}年 ${statsMonth+1}月`;
    prevB.onclick=()=>{statsMonth--;if(statsMonth<0){statsMonth=11;statsYear--;}heatSel=null;renderStats();};
    nextB.onclick=()=>{statsMonth++;if(statsMonth>11){statsMonth=0;statsYear++;}heatSel=null;renderStats();};
    // disable next if future
    if(statsYear>now.getFullYear()||(statsYear===now.getFullYear()&&statsMonth>=now.getMonth()))
      nextB.disabled=true;
  }else{
    lbl.textContent=`${statsYear}年`;
    prevB.onclick=()=>{statsYear--;heatSel=null;renderStats();};
    nextB.onclick=()=>{statsYear++;heatSel=null;renderStats();};
    if(statsYear>=now.getFullYear())nextB.disabled=true;
  }
  pNav.appendChild(prevB);pNav.appendChild(lbl);pNav.appendChild(nextB);
  wrap.appendChild(pNav);

  // ── Filter ──
  const range=statsRange();
  const filterFn=(d)=>d>=range.from&&d<=range.to;
  const st=aggregateStats(filterFn);

  // ── Heatmap (month calendar / year grid) ──
  wrap.appendChild(el("p","section-label","ヒートマップ"));
  wrap.appendChild(renderHeatmapCard());
  wrap.appendChild(el("p","section-label",statsMode==="week"?"日ごとのまとめ":statsMode==="month"?"週ごとのまとめ":"月ごとのまとめ"));
  wrap.appendChild(renderTrendCard());
  window.HabitUI?.renderHabitStats(wrap);

  // ── Monthly achievement dot calendar ──
  if(statsMode==="month"){
    wrap.appendChild(el("p","section-label","達成カレンダー"));
    const calCard=el("div","stats-card");
    const grid=el("div","mcal-grid");
    DAYS.forEach(d=>grid.appendChild(el("div","mcal-hdr",d)));
    const doneMap=completedTracksForMonth(statsYear,statsMonth);
    const offset=(new Date(statsYear,statsMonth,1).getDay()+6)%7; // Monday-start
    const daysIn=new Date(statsYear,statsMonth+1,0).getDate();
    const today=new Date();
    for(let i=0;i<offset;i++)grid.appendChild(el("div","mcal-cell empty"));
    for(let dd=1;dd<=daysIn;dd++){
      const isToday=today.getFullYear()===statsYear&&today.getMonth()===statsMonth&&today.getDate()===dd;
      const cell=el("div","mcal-cell"+(isToday?" today":""));
      cell.appendChild(el("div","mcal-num",String(dd)));
      const done=doneMap[dd]||new Set();
      const slots=el("div","mcal-slots");
      CAL_TRACKS.forEach(t=>{
        const slot=el("div","mcal-slot");
        if(done.has(t.id))slot.style.background=t.color;
        slots.appendChild(slot);
      });
      cell.appendChild(slots);
      grid.appendChild(cell);
    }
    calCard.appendChild(grid);
    // legend
    const legend=el("div","mcal-legend");
    CAL_TRACKS.forEach(t=>{
      const s=el("span","");
      s.innerHTML=`<i style="background:${t.color}"></i>${t.label}`;
      legend.appendChild(s);
    });
    calCard.appendChild(legend);
    wrap.appendChild(calCard);
  }

  // ── Bar chart: completed counts per category (workout split by part) ──
  // Order: 7 workout parts + 4 base cats
  const barCats=[...WORKOUT_CATS,...BASE_CATS];
  const maxDone=Math.max(1,...barCats.map(c=>st[c.id].done));
  wrap.appendChild(el("p","section-label","達成回数"));
  const chartCard=el("div","stats-card");
  const chart=el("div","bar-chart");
  barCats.forEach(c=>{
    const s=st[c.id];
    const h=Math.round(s.done/maxDone*110);
    const col=el("div","bar-col");
    const shortLbl=c.part?c.part.label:c.label.replace("学習","").replace("練習","").replace("専門医","専門");
    col.innerHTML=
      `<span class="bar-val">${s.done}</span>`+
      `<div class="bar" style="height:${s.done>0?Math.max(h,6):2}px;background:${c.color}"></div>`+
      `<span class="bar-lbl">${c.part?"":c.icon+"<br>"}${shortLbl}</span>`;
    chart.appendChild(col);
  });
  chartCard.appendChild(chart);
  chartCard.appendChild(el("p","",`<span style="font-size:10px;color:#bbb">左7本＝筋トレ部位　右4本＝その他</span>`));
  wrap.appendChild(chartCard);

  // ── Number list ──
  wrap.appendChild(el("p","section-label","カテゴリ別 達成回数"));

  // Workout group card
  const wDone=WORKOUT_CATS.reduce((a,c)=>a+st[c.id].done,0);
  const wMin=WORKOUT_CATS.reduce((a,c)=>a+st[c.id].totalMin,0);
  const wCard=el("div","stats-card");
  let wHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span style="font-size:18px">💪</span>
    <span style="font-weight:700;font-size:14px">筋トレ</span>
    <span style="margin-left:auto;font-weight:700;font-size:15px;color:#E57373">${wDone}回</span>
  </div>`;
  WORKOUT_PARTS.forEach(p=>{
    const s=st[`workout_${p.id}`];
    wHTML+=`<div class="num-row">
      <span class="part-dot" style="background:${p.color}"></span>
      <span style="font-size:13px">${p.label}</span>
      <span class="num-count" style="color:${p.color}">${s.done}回</span>
      <span class="num-min">${s.totalMin>0?s.totalMin+"分":""}</span>
    </div>`;
  });
  wCard.innerHTML=wHTML;
  wrap.appendChild(wCard);

  // Base categories
  BASE_CATS.forEach(c=>{
    const s=st[c.id];
    const card=el("div","stats-card");
    card.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">${c.icon}</span>
      <span style="font-weight:700;font-size:14px">${c.label}</span>
      <span style="margin-left:auto;font-weight:700;font-size:15px;color:${c.color}">${s.done}回</span>
    </div>
    <div class="stats-meta" style="margin-top:6px">
      ${s.totalMin>0?`<span>合計 ${s.totalMin} 分</span>`:""}
    </div>`;
    wrap.appendChild(card);
  });

  window.ReadingUI?.renderReadingStats(wrap,statsRange(),statsMode);
  cont.appendChild(wrap);
}

function snapshotLevels(){
  const xp=computeXP();
  const tracks=getTracks(xp);
  const map={};
  tracks.forEach(t=>map[t.id]={lvl:t.lvl,label:t.label});
  return map;
}
function trackIdForCat(catId){
  return catId.startsWith("workout_")?"workout":catId;
}
function checkLevelUp(before, gainedXP){
  const after=snapshotLevels();
  let leveledTrack=null;
  Object.keys(after).forEach(id=>{
    if(before[id]&&after[id].lvl>before[id].lvl)
      leveledTrack={id, label:after[id].label, lvl:after[id].lvl};
  });
  if(leveledTrack)showLevelUp(leveledTrack);
  else if(gainedXP>0)showXPToast(gainedXP);
}

// ── Level-up celebration ──────────────────────────────────────────────────────
function showLevelUp(track){
  const c = track.id==="workout" ? {icon:"💪",color:"#E57373"} : catById(track.id);
  document.getElementById("lvl-cat").textContent=(c?.icon||"")+" "+track.label;
  document.getElementById("lvl-num").textContent="Lv. "+track.lvl;
  document.getElementById("lvl-rank").textContent=rankTitle(track.lvl);
  const ov=document.getElementById("levelup-overlay");
  ov.style.display="flex";
  spawnConfetti(ov);
  if(navigator.vibrate)navigator.vibrate([40,40,80]);
}
document.getElementById("levelup-overlay").addEventListener("click",function(){
  this.style.display="none";
  this.querySelectorAll(".confetti").forEach(c=>c.remove());
});
function spawnConfetti(container){
  const colors=["#e01937","#f0f0f2","#96969e","#c8a557","#e01937","#f0f0f2"];
  for(let i=0;i<40;i++){
    const cf=document.createElement("div");
    cf.className="confetti";
    cf.style.left=Math.random()*100+"%";
    cf.style.background=colors[i%colors.length];
    cf.style.animationDuration=(1.5+Math.random()*1.5)+"s";
    cf.style.animationDelay=(Math.random()*0.4)+"s";
    container.appendChild(cf);
  }
}
function showXPToast(xp){
  const t=document.getElementById("xp-toast");
  t.textContent=`+${xp} XP`;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}

// ── Neuro Learn 連携 ──────────────────────────────────────────────────────────
// Neuro Learn は別オリジンのため localStorage を共有できない。受け取り口は3つ：
//   1) 自動同期 … Neuro Learn が学習のたびに自分のサーバー（/api/quest）へ累計を送り、
//      週クエは起動・復帰時にそこへ取りに行く。設定（接続コード）を一度貼れば以後は全自動
//   2) 記録コードのペースト（ヘッダーの 🧠 ボタン）… サーバー未設定時の手動経路
//   3) URLハンドオフ `tracker.html#nl=<base64url JSON>` … 同じブラウザで使っている場合
// 1日分の payload は {d:"YYYY-MM-DD", min:学習分, q:回答数, c:正解数, l:読了レッスン数} で、
// **その日の累計**なので何度取り込んでも上書きになり二重加算されない。
// 「専門医勉強」(medicine) をその日の完了扱いにして XP を入れる。
const NL_MARK="🧠";
function dayKeyOfDate(d){ return DAY_KEYS[(d.getDay()+6)%7]; }
// `#nl=…` を含む文字列（URL全体でもコード単体でも可）から payload を取り出す
function parseNeuroToken(text){
  const m=String(text||"").match(/[#&]nl=([A-Za-z0-9_-]+)/);
  if(!m)return null;
  try{
    const bin=atob(m[1].replace(/-/g,"+").replace(/_/g,"/"));
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}
// 1日分を records にマージする（保存・描画・演出はしない）。
// 戻り値: null（不正・実績なし）/ {changed, gained}
function mergeNeuroDay(p){
  if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(p.d||""))return null;
  const [y,mo,dd]=p.d.split("-").map(Number);
  const dateObj=new Date(y,mo-1,dd);
  if(isNaN(dateObj)||daysSince(dateObj)<0||daysSince(dateObj)>30)return null; // 未来日・古すぎる日付は無視
  const min=Math.max(0,Math.min(600,Math.round(Number(p.min)||0)));
  const q=Math.max(0,Math.round(Number(p.q)||0));
  const c=Math.max(0,Math.min(q,Math.round(Number(p.c)||0)));
  const l=Math.max(0,Math.round(Number(p.l)||0));
  if(min<=0&&q<=0&&l<=0)return null; // 学習実績が空なら何もしない

  const wk=getWeekKey(dateObj), dk=dayKeyOfDate(dateObj);
  records[wk]=records[wk]||{}; records[wk][dk]=records[wk][dk]||{};
  const prev=records[wk][dk]["medicine"]||{done:false,note:"",duration:"",rating:0};
  const prevXP=xpForRecord(prev);
  const entry={...prev,done:true};
  // 手入力の実施時間は減らさない（累計なので max を取れば再取り込みも安全）
  if(min>0)entry.duration=String(Math.max(parseInt(prev.duration)||0,min));
  // メモは自分（🧠始まり）が書いたものだけ書き換え、手書きメモは残す
  const parts=[];
  if(l>0)parts.push(`レッスン${l}本読了`);
  if(q>0)parts.push(`${q}問中${c}問正解`);
  if(!prev.note||prev.note.startsWith(NL_MARK))
    entry.note=NL_MARK+" Neuro Learn"+(parts.length?"："+parts.join("・"):"");
  const changed=JSON.stringify(prev)!==JSON.stringify(entry);
  records[wk][dk]["medicine"]=entry;
  return { changed, gained:xpForRecord(entry)-prevXP };
}
// 手動経路（コード・URLハッシュ）用：1日分を取り込んで保存・演出まで行う
function applyNeuroPayload(p){
  if(!p||p.v!==1)return false;
  const before=snapshotLevels();
  const r=mergeNeuroDay(p);
  if(!r)return false;
  persist();
  render();
  showToast("🧠 Neuro Learnの学習を専門医勉強に記録しました");
  if(r.gained>0)checkLevelUp(before,r.gained);
  return true;
}
// 経路2: 🧠 ボタン → クリップボードの記録コードを取り込む（iOSはペースト許可が出る）
document.getElementById("nl-import").onclick=async()=>{
  // 自動同期を設定済みなら、ボタンは「いますぐ同期」としても働く
  const conf=nlConf();
  if(conf.url&&conf.key){
    const n=await nlAutoSync(true);
    if(n===0)showToast("🧠 新しい学習記録はありませんでした");
    else if(n<0)showToast("⚠️ Neuro Learnに接続できませんでした");
    return;
  }
  let text="";
  try{ text=await navigator.clipboard.readText(); }
  catch(e){ showToast("📋 ペーストが許可されませんでした"); return; }
  const p=parseNeuroToken(text);
  if(!p){ showToast("🧠 記録コードが見つかりません。Neuro Learnで「記録コードをコピー」してから押してください"); return; }
  if(!applyNeuroPayload(p)) showToast("🧠 取り込める学習記録がありませんでした");
};
// 経路3: URLハッシュ
function importNeuroLearn(){
  const p=parseNeuroToken(location.hash);
  if(!p)return;
  // リロードで再取り込みしないよう、先にハッシュを消す
  history.replaceState(null,"",location.pathname+location.search);
  applyNeuroPayload(p);
}
importNeuroLearn();

// ── 経路1: 自動同期（Neuro Learn のサーバーから直近の学習を取り込む） ────────
function nlConf(){
  return { url:localStorage.getItem("wt_nl_url")||"", key:localStorage.getItem("wt_nl_key")||"" };
}
async function nlFetchDays(url,key){
  const res=await fetch(url.replace(/\/+$/,"")+"/api/quest?key="+encodeURIComponent(key));
  if(!res.ok){
    let msg="";
    try{ msg=(await res.json()).error||""; }catch(e){}
    throw new Error(msg||("HTTP "+res.status));
  }
  const data=await res.json();
  return Array.isArray(data.days)?data.days:[];
}
let nlSyncing=false, nlLastSync=0;
// 戻り値: 取り込んで変化のあった日数（エラー時は -1）
async function nlAutoSync(force){
  const {url,key}=nlConf();
  if(!url||!key)return 0;
  const now=Date.now();
  if(!force&&(nlSyncing||now-nlLastSync<60000))return 0; // 1分以内の再実行はスキップ
  nlSyncing=true;
  try{
    const days=await nlFetchDays(url,key);
    nlLastSync=Date.now();
    const before=snapshotLevels();
    let changed=0, gained=0;
    days.forEach(day=>{
      const r=mergeNeuroDay(day);
      if(r&&r.changed){ changed++; gained+=r.gained; }
    });
    if(changed>0){
      persist();
      render();
      showToast("🧠 Neuro Learnの学習を専門医勉強に記録しました");
      if(gained>0)checkLevelUp(before,gained);
    }
    return changed;
  }catch(e){
    return -1;
  }finally{
    nlSyncing=false;
  }
}
// 起動時・アプリに戻ってきた時に自動で取り込む
nlAutoSync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)nlAutoSync();});
window.addEventListener("pageshow",e=>{if(e.persisted)nlAutoSync();});

// 設定モーダル（接続コード = <Neuro LearnのURL>|<同期キー>）
function setNlStatus(msg){document.getElementById("nl-status").textContent=msg;}
document.getElementById("nl-open").onclick=()=>{
  const {url,key}=nlConf();
  document.getElementById("nl-code").value=url&&key?url+"|"+key:"";
  setNlStatus(url&&key?"✅ 自動同期ON：起動時にNeuro Learnの学習を取り込みます":"");
  document.getElementById("nl-modal").style.display="flex";
};
document.getElementById("nl-close").onclick=()=>document.getElementById("nl-modal").style.display="none";
document.getElementById("nl-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("nl-save").onclick=async()=>{
  const raw=document.getElementById("nl-code").value.trim();
  if(!raw){
    localStorage.removeItem("wt_nl_url");
    localStorage.removeItem("wt_nl_key");
    setNlStatus("自動同期を解除しました");
    return;
  }
  const parts=raw.split("|").map(s=>s.trim());
  const url=parts[0]||"", key=parts[1]||"";
  if(!/^https?:\/\//.test(url)||!key){
    setNlStatus("❌ 形式が違います。Neuro Learnの「🔗 接続コードをコピー」で取得した1行（URL|キー）をそのまま貼ってください");
    return;
  }
  setNlStatus("接続中…");
  try{
    const days=await nlFetchDays(url,key);
    localStorage.setItem("wt_nl_url",url);
    localStorage.setItem("wt_nl_key",key);
    setNlStatus(`✅ 接続できました（学習データ ${days.length}日分）。以後は開くだけで自動反映されます`);
    nlAutoSync(true);
  }catch(err){
    setNlStatus("❌ 接続失敗: "+(err.message||"")+"（URLとキー、Neuro Learn側のサーバー設定を確認してください）");
  }
};

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  if(tab==="today"){
    if(window.HabitUI)window.HabitUI.renderToday();
    else document.getElementById("content").innerHTML='<div id="today-view"></div>';
  }
  else if(tab==="stats")renderStats();
  else if(tab==="status")renderStatus();
  window.HabitUI?.updateQuestBadge();
  updateHomeIcon();
}
render();

// ── 外部アプリ連携: ディープリンクAPI ──────────────────────────────────────────
// 例: tracker.html?quest=medicine&min=30&label=Neurolearn%20Ch.5
// NeurolearnなどからこのURLを開くと、今日の該当カテゴリを「完了」として記録し、
// XP獲得・レベルアップ演出を実行する。同じ日に複数回呼ぶと実施時間(min)が加算される。
function handleQuestParam(){
  const params=new URLSearchParams(location.search);
  const cat=params.get("quest");
  if(!cat)return;
  history.replaceState(null,"",location.pathname);   // 再読込での二重記録を防ぐ
  if(!catById(cat)){showToast("⚠️ 不明なカテゴリ: "+cat);return;}
  const min=parseInt(params.get("min")||"",10);
  const label=params.get("label")||"";
  const today=new Date();
  const wk=getWeekKey(today);
  const dk=DAY_KEYS[(today.getDay()+6)%7];
  const before=snapshotLevels();
  if(!records[wk])records[wk]={};
  if(!records[wk][dk])records[wk][dk]={};
  const prev=records[wk][dk][cat]||{done:false,note:"",duration:"",rating:0};
  const prevXP=xpForRecord(prev);
  const totalMin=(parseInt(prev.duration,10)||0)+(isNaN(min)?0:min);
  records[wk][dk][cat]={
    done:true,
    note:label?(prev.note?prev.note+" / ":"")+label:prev.note,
    duration:totalMin>0?String(totalMin):prev.duration,
    rating:prev.rating,
  };
  const gained=xpForRecord(records[wk][dk][cat])-prevXP;
  saveData();render();
  checkLevelUp(before,gained);
}
handleQuestParam();

<!-- 読書記録: ヘッダーの本棚・今日タブの読書カード・統計の読書まとめ。ロジックは js/reading-core.mjs。
     今日タブの描画で使うので、習慣トラッカーより先に読み込む -->
<script type="module" src="js/reading-ui.mjs"></script>
<!-- 習慣トラッカー: 今日タブ・目標・ゴールド・ショップ。ロジックは js/habit-core.mjs -->
<script type="module">
import * as H from "./js/habit-core.mjs";
import * as Q from "./js/quest-core.mjs";
import * as T from "./js/todo-core.mjs";
import * as RC from "./js/reading-core.mjs";

const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(n).toLocaleString("ja-JP");
const GOAL_LABEL = { check: "チェック", count: "回数", minutes: "時間" };
const FREQ_LABEL = { daily: "毎日", days: "曜日指定", weekly: "週N回" };
let selDay = null, lastToday = null;
let stripDays = 28, stripRight = 0, stripFocus = false; // 日付ストリップ: 描く日数・右端からの位置・選んだ日へ寄せるか

// ── state ──────────────────────────────────────────────────────────────────
function readingBooks(today) { return RC.normalize(read(RC.KEY), today).books; }
function ctxOf(s) {
  const books = readingBooks(s.today); // 読書は本棚(wt_reading_v1)から。進んだページ・読了をゴールドに足し、習慣「読書」の進み具合にする
  let floorKey = H.dataFloor(records, s.log);
  const rf = RC.firstLogDay(books);
  if (rf && (!floorKey || rf < floorKey)) floorKey = rf;
  return { records, log: s.log, freezes: s.reward.freezes, floorKey, today: s.today,
    readPages: k => RC.pagesOnDay(books, k),
    extraGold: k => ({ ...T.dayGoldItems(s.todo, k), ...RC.dayGoldItems(books, k) }) };
}
// 読み込みのたびに未確定日のゴールドを精算する(ジムやNeuro Learnの記録もここで反映)
function loadState() {
  const today = H.keyOfDate(new Date());
  const savedHabits = read(H.KEYS.habits);
  const hs = H.ensureHabits(savedHabits, today, RC.firstLogDay(readingBooks(today)));
  if (!Array.isArray(savedHabits?.habits) || savedHabits.habits.length !== hs.habits.length) write(H.KEYS.habits, hs);
  const s = { today, habits: hs.habits, log: read(H.KEYS.log) || {}, reward: null, todo: T.normalizeTodo(read(T.KEY), today) };
  const saved = read(H.KEYS.reward);
  s.reward = H.normalizeReward(saved, today);
  const settled = H.settle(s.reward, s.habits, ctxOf(s), today);
  if (!saved || JSON.stringify(settled) !== JSON.stringify(saved)) write(H.KEYS.reward, settled);
  s.reward = settled;
  return s;
}
function saveHabits(list) { write(H.KEYS.habits, { habits: list }); }
function saveTodo(t) { write(T.KEY, t); }
function curDay(s) {
  if (lastToday !== s.today) { selDay = null; stripRight = 0; lastToday = s.today; }
  return selDay && selDay <= s.today ? selDay : s.today;
}
function showDay(k, today) {
  selDay = k > today ? today : k;
  stripFocus = true;
  renderToday();
}
function dayLabel(k, today) {
  if (k === today) return "今日";
  if (k === H.addDays(today, -1)) return "昨日";
  const [y, m, d] = k.split("-").map(Number);
  return `${y !== Number(today.slice(0, 4)) ? y + "/" : ""}${m}/${d}(${H.WEEKDAY_LABELS[H.weekdayIdx(k)]})`;
}
const totalXP = () => Object.values(computeXP()).reduce((a, b) => a + b, 0);

// 区切りのあるリング: 達成した習慣をそれぞれの色で先頭から並べ、残りは薄い線
function segRingSvg(size, sw, segs, track = "#ffffff1f") {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, n = segs.length;
  if (!n) return ringSvg(size, sw, 0, "#000", track);
  const gap = n > 1 ? Math.min(3, c / n / 3) : 0, len = c / n - gap;
  const sorted = [...segs.filter(x => x.done), ...segs.filter(x => !x.done)];
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${sorted.map((x, i) =>
    `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${x.done ? x.color : track}" stroke-width="${sw}"
      ${x.done ? 'class="seg-on"' : ""} stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-(i * c / n) - gap / 2).toFixed(2)}"/>`).join("")}</svg>`;
}
function ringSvg(size, sw, ratio, color, track = "#ffffff1f") {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, ratio));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/>
    ${f > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - f)).toFixed(2)}"/>` : ""}</svg>`;
}

// ── writes ─────────────────────────────────────────────────────────────────
// op: {toggle} | {delta} | {set} | {part,on}
function applyChange(h, day, op) {
  if (h.link === "reading") return; // 読書は本棚(ReadingUI)で記録する
  const s0 = loadState();
  const before = snapshotLevels(), xp0 = totalXP();
  if (h.link) {
    const wk = H.mondayOf(day), dk = H.DAY_KEYS[H.weekdayIdx(day)];
    let change;
    if (op.part) change = { type: "part", part: op.part, on: op.on };
    else if (op.toggle) change = { type: "toggle" };
    else if (op.set != null) change = { type: "minutes", delta: op.set - H.progressOf(h, day, ctxOf(s0)) };
    else change = { type: "minutes", delta: op.delta || 0 };
    if (!records[wk]) records[wk] = {};
    records[wk][dk] = H.linkedDayPatch(records[wk][dk] || {}, h, change);
    persist();
  } else {
    const cur = Number(s0.log?.[day]?.[h.id]?.n) || 0;
    const n = op.toggle ? (cur >= 1 ? 0 : 1) : op.set != null ? op.set : Math.max(0, cur + (op.delta || 0));
    write(H.KEYS.log, H.setLogValue(s0.log, day, h.id, n));
  }
  const s1 = loadState();
  render();
  feedback(h, day, s0, s1);
  const gained = totalXP() - xp0;
  if (h.link && gained > 0) checkLevelUp(before, gained);
}
function applyRest(h, day, on) {
  const s0 = loadState();
  write(H.KEYS.log, H.setRest(s0.log, day, h.id, on));
  const s1 = loadState();
  render();
  if (!feedback(h, day, s0, s1, true)) showToast(on ? "🌙 休息日にしました（連続記録はそのまま）" : "休息日を取り消しました");
}
function feedback(h, day, s0, s1, quiet = false) {
  const had = H.medals(s0.reward);
  const fresh = H.medals(s1.reward).filter(m => !had.some(x => x.habitId === m.habitId && x.unit === m.unit && x.tier === m.tier));
  if (fresh.length) { celebrate(fresh[0], s1); return true; }
  const dg = H.balance(s1.reward) - H.balance(s0.reward);
  if (dg === 0) { if (!quiet) showToast("✅ 記録しました"); return !quiet; }
  const st = H.currentStreak(h, day, ctxOf(s1));
  showToast(`🪙 ${dg > 0 ? "+" : ""}${dg}G${dg > 0 && st.n > 1 ? `　🔥${H.streakLabel(st)}連続` : ""}`);
  return true;
}

    if (k === day) b.setAttribute("aria-current", "date");
    b.innerHTML = `<span class="hb-dow">${H.WEEKDAY_LABELS[H.weekdayIdx(k)]}</span>
      <span class="hb-dnum">${segRingSvg(36, 3, H.daySegments(active, k, ctx))}${Number(k.slice(8))}</span>`;
    b.onclick = () => { selDay = k; renderToday(); };
    return b;
  };
  for (let i = stripDays - 1; i >= 0; i--) strip.appendChild(dayBtn(H.addDays(s.today, -i)));
  // 左端に近づいたら、さらに4週間ぶん前の日を足す(見えている位置は動かさない)
  strip.addEventListener("scroll", () => {
    stripRight = strip.scrollWidth - strip.clientWidth - strip.scrollLeft;

    stripDays += 28;
    strip.prepend(frag);
    strip.scrollLeft = strip.scrollWidth - strip.clientWidth - stripRight;

  if (!shown.length) v.appendChild(el("div", "hb-empty", "習慣がまだありません。<br>＋ から追加しましょう。"));
  main.forEach(h => v.appendChild(habitCard(h, day, ctx)));
  if (off.length) {
    v.appendChild(el("p", "hb-group", "予定外の習慣"));
    off.forEach(h => v.appendChild(habitCard(h, day, ctx, true)));
  }
  renderRoutines(v, s, day);
  window.ReadingUI?.renderTodayBooks(v, day);
  v.appendChild(el("p", "hb-hint", "リングをタップで記録 ・ 長押しで休息日<br>カードをタップすると細かく記録・編集できます<br>タスクはタップでステップを開く ・ 日課はタップで済み、長押しで編集"));
  const archived = s.habits.filter(h => h.archived);
