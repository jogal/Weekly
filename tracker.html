<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="週クエ">
<meta name="theme-color" content="#0c0c0e">
<title>週間クエスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0c0c0e; --panel:#131316; --panel2:#1b1b1f; --line:#28282e;
  --txt:#f0f0f2; --dim:#96969e; --faint:#55555e;
  --green:#e01937; --gold:#c8a557; --red:#ff5555;
  --shadow:transparent;
  --cond:"Barlow Condensed","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  background:var(--bg); color:var(--txt); height:100dvh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100dvh; }
body { overscroll-behavior:none; }
button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

#header { background:var(--bg); color:#fff; padding:14px 16px 10px;
  padding-top:max(14px,env(safe-area-inset-top)); flex-shrink:0;
  border-bottom:1px solid var(--line); }
#app-title { margin:0; font-size:16px; font-weight:600; letter-spacing:.12em;
  font-family:var(--cond); text-transform:uppercase; color:var(--txt);
  display:flex; align-items:center; justify-content:space-between; line-height:1; gap:8px; }
#app-title>span:first-child { min-width:0; white-space:nowrap; }
#app-title>span:last-child { display:flex; flex-shrink:0; align-items:center; }
#app-title .t-jp { display:block; font-size:10px; color:var(--dim);
  letter-spacing:.38em; margin-top:5px; font-weight:500; }
#app-title .t-red { color:var(--green); }
.mini-btn { background:none; border:1px solid var(--line); color:var(--dim);
  font-size:10px; padding:7px 9px; cursor:pointer; margin-left:4px;
  font-family:var(--cond); letter-spacing:.12em; text-transform:uppercase;
  text-shadow:none; }

/* Bottom tab bar */
#tabbar { display:flex; background:var(--bg); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); flex-shrink:0; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 7px; border:none; background:none; cursor:pointer;
  color:var(--faint); font-weight:500; font-size:10px; white-space:nowrap;
  border-top:2px solid transparent; min-height:52px; letter-spacing:.14em; }
.tab-btn.active { color:var(--txt); font-weight:700; border-top-color:var(--green); }
.tab-ico { font-size:17px; line-height:1; filter:grayscale(1) brightness(1.7); }
.tab-btn:not(.active) .tab-ico { filter:grayscale(1) brightness(.8); }

/* Settings menu */
.menu-item { display:block; width:100%; text-align:left; background:var(--panel2);
  border:1px solid var(--line); color:var(--txt); padding:14px 12px; font-size:14px;
  cursor:pointer; margin-bottom:10px; }

#week-nav { display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; }
.nav-btn { background:none; border:1px solid var(--line);
  padding:10px 14px; cursor:pointer; font-size:12px; color:var(--txt);
  font-family:var(--cond); letter-spacing:.1em; }
#week-label { font-weight:600; font-size:14px; color:var(--txt);
  font-family:var(--cond); letter-spacing:.12em; }
.badge { font-size:10px; background:var(--green); color:#fff;
  padding:1px 8px; margin-left:6px; font-family:var(--cond); letter-spacing:.14em; }

#content { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* List */
#list-view { flex:1; overflow-y:auto; padding:14px 12px; }
.day-card { background:var(--panel); margin-bottom:12px;
  border:1px solid var(--line); overflow:hidden; }
.day-card.today { border-left:3px solid var(--green); }
.day-header { display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; background:transparent; border-bottom:1px solid var(--line); }
.day-card.today .day-header { background:rgba(224,25,55,.06); }
.day-label { font-weight:600; font-size:15px; font-family:var(--cond); letter-spacing:.18em; }
.day-date { font-weight:500; font-size:11px; color:var(--dim); margin-left:6px; letter-spacing:.1em; }
.today-badge { font-size:10px; background:var(--green); color:#fff;
  padding:1px 7px; margin-left:8px; font-family:var(--cond); letter-spacing:.14em; }
.add-btn { background:none; color:var(--txt); border:1px solid var(--dim);
  padding:8px 14px; font-size:12px; cursor:pointer; font-weight:600;
  font-family:var(--cond); letter-spacing:.14em; }
.entry-row { display:flex; align-items:center; padding:10px;
  border-bottom:1px solid var(--line); gap:7px; }
.entry-row:last-child { border-bottom:none; }
.entry-time { font-size:11px; color:var(--dim); min-width:78px; flex-shrink:0;
  font-family:var(--cond); letter-spacing:.08em; font-size:13px; }
.entry-name { flex:1; font-size:14px; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entry-name.done { text-decoration:line-through; color:var(--faint); }
.cat-chip { font-size:10px; padding:2px 8px; white-space:nowrap; flex-shrink:0;
  letter-spacing:.06em; }
.rec-btn { background:none; border:1px solid var(--dim);
  padding:9px 13px; font-size:11px; cursor:pointer; color:var(--txt); flex-shrink:0;
  font-family:var(--cond); letter-spacing:.12em; }
.gcal-btn { background:none; border:1px solid var(--line); color:var(--dim);
  padding:8px 10px; font-size:13px; cursor:pointer; flex-shrink:0; }
.del-btn { background:none; border:none; color:var(--faint); cursor:pointer;
  font-size:17px; flex-shrink:0; line-height:1; padding:10px; }
.empty-day { padding:10px 14px; font-size:12px; color:var(--faint); margin:0; }
.stars-r { display:inline-flex; gap:2px; flex-shrink:0; font-size:13px; }

/* Calendar */
#cal-view { flex:1; overflow:hidden; display:flex; flex-direction:column; }
#cal-header { display:flex; background:var(--panel); border-bottom:1px solid var(--line);
  flex-shrink:0; padding-left:36px; }
.cal-day-hdr { flex:1; text-align:center; padding:5px 1px;
  font-size:11px; color:var(--dim); line-height:1.4; font-family:var(--cond); letter-spacing:.1em; }
.cal-day-hdr.today { color:var(--green); font-weight:700; }
#cal-scroll { flex:1; overflow-y:auto; }
#cal-grid { display:flex; }
#hour-col { width:36px; flex-shrink:0; }
.hour-cell { height:48px; border-bottom:1px solid #1a1a1f; display:flex;
  align-items:flex-start; justify-content:flex-end; padding:2px 4px 0;
  font-size:10px; color:var(--faint); font-family:var(--cond); }
.cal-day-col { flex:1; position:relative; border-left:1px solid #1a1a1f;
  min-height:1152px; }
.cal-day-col.today-col { background:rgba(224,25,55,.04); }
.cal-slot { height:48px; border-bottom:1px solid #1a1a1f; cursor:pointer; }
.cal-event { position:absolute; left:1px; right:1px;
  padding:2px 4px; overflow:hidden; cursor:pointer; opacity:.95;
  border:none; border-left:3px solid rgba(255,255,255,.55);
  touch-action:none; transition:outline .15s; }
.cal-event.dragging { opacity:.95; z-index:50;
  outline:1px solid #fff; transition:none; }
.cal-event-title { font-size:10px; color:#fff; font-weight:700;
  line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-event-time { font-size:9px; color:rgba(255,255,255,.85); }
#cal-scroll.no-scroll { overflow:hidden; }
#drag-hint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--bg); color:#fff; border:1px solid #fff; padding:8px 16px;
  font-size:14px; font-weight:700; z-index:300; display:none; pointer-events:none; }

/* Stats */
#stats-view { flex:1; overflow-y:auto; padding:14px 12px; }
.stats-card { background:var(--panel); padding:14px; margin-bottom:12px;
  border:1px solid var(--line); }
.progress-bar { background:#0f0f12; height:6px; margin-bottom:8px; overflow:hidden;
  border:none; }
.progress-fill { height:100%; }
.stats-meta { display:flex; gap:14px; font-size:11px; color:var(--dim); }
.part-dot { width:8px; height:8px; display:inline-block; margin-right:3px; }
/* Period switcher */
.mode-toggle { display:flex; background:var(--panel); border:1px solid var(--line);
  padding:3px; margin-bottom:12px; }
.mode-toggle button { flex:1; border:none; background:none; padding:7px; font-size:12px;
  cursor:pointer; color:var(--dim); font-family:var(--cond); letter-spacing:.16em; }
.mode-toggle button.active { background:var(--green); color:#fff; font-weight:700; }
.period-nav { display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); padding:8px 12px; margin-bottom:12px; }
.period-nav button { background:none; border:1px solid var(--line);
  padding:4px 12px; cursor:pointer; font-size:14px; color:var(--txt); }
.period-nav button:disabled { opacity:.3; cursor:default; }
.period-label { font-weight:600; font-size:16px; font-family:var(--cond); letter-spacing:.16em; }
/* Bar chart */
.bar-chart { display:flex; align-items:flex-end; gap:8px; height:140px;
  padding:8px 4px 0; margin-bottom:6px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; gap:4px; }
.bar-val { font-size:13px; font-weight:600; color:var(--txt); font-family:var(--cond); }
.bar { width:100%; max-width:40px; min-height:2px; transition:height .3s;
  border:none; }
.bar-lbl { font-size:10px; color:var(--dim); text-align:center; line-height:1.2; }
.num-row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); gap:8px; }
.num-row:last-child { border-bottom:none; }
.num-count { margin-left:auto; font-weight:600; font-size:17px; font-family:var(--cond); }
.num-min { font-size:11px; color:var(--dim); min-width:54px; text-align:right; }
.section-label { font-size:11px; color:var(--dim); margin:16px 4px 8px; font-weight:600;
  font-family:var(--cond); letter-spacing:.3em; text-transform:uppercase; }

/* Status / Level page */
#status-view { flex:1; overflow-y:auto; padding:14px 12px; }
.hero-card { background:var(--panel); color:#fff; border:1px solid var(--line);
  border-top:3px solid var(--green);
  padding:18px; margin-bottom:14px; text-align:center;
  position:relative; overflow:hidden; }
.hero-card::after { display:none; }
.hero-rank { font-size:11px; color:var(--green); font-weight:700; letter-spacing:.4em;
  font-family:var(--cond); text-transform:uppercase; }
.hero-level { font-size:44px; font-weight:700; line-height:1.1; margin:2px 0;
  font-family:var(--cond); letter-spacing:.06em; }
.hero-level small { font-size:15px; font-weight:500; color:var(--dim); letter-spacing:.2em; }
.hero-sub { font-size:11px; color:var(--dim); letter-spacing:.08em; }
.track-card { background:var(--panel); padding:14px; margin-bottom:12px;
  border:1px solid var(--line); }
.track-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.track-icon { width:38px; height:38px; border:1px solid var(--line); display:flex;
  align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  filter:grayscale(1) brightness(1.6); }
.track-name { font-weight:600; font-size:14px; letter-spacing:.06em; }
.track-rank { font-size:11px; color:var(--gold); letter-spacing:.1em; }
.track-lvl { margin-left:auto; text-align:right; }
.track-lvl-num { font-size:26px; font-weight:600; line-height:1; font-family:var(--cond); }
.track-lvl-lbl { font-size:9px; color:var(--faint); letter-spacing:.3em; font-family:var(--cond); }
.xp-track { background:#0f0f12; border:none; height:6px;
  overflow:hidden; position:relative; padding:0; }
.xp-fill { height:100%; transition:width .6s cubic-bezier(.3,1.2,.5,1); }
.xp-text { font-size:10px; color:var(--dim); text-align:right; margin-top:5px;
  font-family:var(--cond); letter-spacing:.12em; }
.decay-warn { font-size:11px; color:var(--red); font-weight:700; margin-top:8px;
  background:rgba(255,85,85,.07); border:1px solid var(--red); padding:4px 8px; }
.decay-soon { font-size:10px; color:var(--gold); margin-top:6px; }

/* Level-up celebration overlay */
#levelup-overlay { position:fixed; inset:0; z-index:500; display:none;
  align-items:center; justify-content:center; background:rgba(8,8,10,.92); }
.levelup-box { text-align:center; color:#fff; animation:lvlPop .5s cubic-bezier(.2,1.5,.4,1);
  border-top:1px solid var(--green); border-bottom:1px solid var(--green);
  padding:34px 46px; }
.levelup-burst { font-size:13px; color:var(--green); font-weight:700; letter-spacing:.55em;
  font-family:var(--cond); text-transform:uppercase; }
.levelup-title { font-size:26px; font-weight:600; margin:8px 0 2px;
  font-family:var(--cond); letter-spacing:.3em; color:var(--txt);
  background:none; -webkit-background-clip:unset; -webkit-text-fill-color:var(--txt); }
.levelup-cat { font-size:16px; font-weight:600; margin-top:10px; letter-spacing:.12em; }
.levelup-lvl { font-size:66px; font-weight:700; margin:4px 0; font-family:var(--cond); }
.levelup-tap { font-size:10px; color:rgba(255,255,255,.45); margin-top:20px;
  letter-spacing:.3em; font-family:var(--cond); text-transform:uppercase; }
@keyframes lvlPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
.confetti { position:absolute; width:3px; height:14px; top:-16px;
  animation:fall linear forwards; }
@keyframes fall { to { transform:translateY(105vh) rotate(200deg); opacity:.3; } }
/* XP gain toast */
#xp-toast { position:fixed; bottom:calc(120px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--bg); color:var(--txt); border:1px solid var(--green);
  padding:8px 20px; font-size:15px; font-weight:600; z-index:200; display:none;
  font-family:var(--cond); letter-spacing:.16em; }

/* Modals */
.overlay { position:fixed; inset:0; background:rgba(8,8,10,.78);
  display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-box { background:var(--panel); border:1px solid var(--line);
  border-top:3px solid var(--green);
  padding:22px; width:340px; max-width:93vw;
  max-height:90dvh; overflow-y:auto; }
.modal-title { margin:0 0 14px; font-size:15px; font-weight:600; color:var(--txt);
  font-family:var(--cond); letter-spacing:.2em; }
.modal-sub { font-size:12px; color:var(--dim); margin:0 0 14px; }
.field-label { font-size:10px; color:var(--dim); margin-bottom:4px; display:block;
  font-family:var(--cond); letter-spacing:.26em; text-transform:uppercase; }
/* 16px inputs: prevents iOS Safari from auto-zooming the page on focus */
.field-input { width:100%; border:1px solid var(--line); background:#0f0f12;
  color:var(--txt); padding:10px 12px; font-size:16px; margin-bottom:10px; font-family:inherit; }
.field-input::placeholder { color:var(--faint); }
textarea.field-input { height:76px; resize:vertical; }
.chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
.chip { padding:8px 13px; font-size:13px; cursor:pointer; border:1px solid; background:none; }
.part-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.part-chip { padding:7px 13px; font-size:13px; cursor:pointer; border:1px solid; background:none; }
.btn-row { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; padding:13px; cursor:pointer; font-size:14px; letter-spacing:.08em; }
.btn-primary { background:var(--green); color:#fff; border:1px solid var(--green); font-weight:700; }
.btn-secondary { background:none; color:var(--txt); border:1px solid var(--line); }
.check-row { display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer;
  padding:6px 0; }
.check-row input { width:20px; height:20px; accent-color:var(--green); cursor:pointer; }

/* Save toast */
#toast { position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--bg); color:#fff; border:1px solid var(--txt); padding:10px 20px;
  font-size:13px; z-index:200; display:none; }

/* Monthly achievement calendar */
.mcal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
.mcal-hdr { text-align:center; font-size:10px; color:var(--dim); padding:1px 0;
  font-family:var(--cond); letter-spacing:.1em; }
.mcal-cell { background:var(--panel2); border:1px solid var(--line); padding:2px 2px 3px; }
.mcal-cell.empty { background:none; border-color:transparent; }
.mcal-cell.today { border-color:var(--green); }
.mcal-num { font-size:9px; color:var(--dim); line-height:1.1; }
.mcal-cell.today .mcal-num { color:var(--green); font-weight:700; }
.mcal-slots { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; margin-top:2px; }
.mcal-slot { aspect-ratio:1; background:#0f0f12; border:1px solid #1e1e24; }
.mcal-legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:10px; color:var(--dim); }
.mcal-legend span { display:inline-flex; align-items:center; gap:3px; }
.mcal-legend i { width:9px; height:9px; display:inline-block; }

/* Hero character (dossier profile style) */
.hero-sprite { width:auto; height:148px; display:block;
  filter:saturate(.9) contrast(1.03); }
/* 2-frame idle animation: the img holds both frames side by side, the clip
   shows one frame, and the img steps left by exactly one frame width */
.hero-sprite-clip { display:block; overflow:hidden; }
.hero-sprite.anim2 { animation:heroStep 1s steps(1,end) infinite; }
@keyframes heroStep { 50% { transform:translateX(-50%); } }
.hero-job { font-size:11px; color:var(--gold); letter-spacing:.3em; margin-bottom:4px;
  font-family:var(--cond); text-transform:uppercase; }
/* Compact side-by-side: character left, level+job+stats right */
.hero-compact { display:flex; align-items:center; gap:14px; text-align:left; padding:14px; }
.hero-compact .hero-sprite { margin:0; }
.hero-compact .hero-sprite-box { flex-shrink:0;
  border:1px solid var(--line); padding:6px; background:#0f0f12; }
.hero-compact::after { display:none; }
.hero-info { flex:1; min-width:0; }
.hero-info .hero-level { font-size:30px; margin:0; line-height:1; }
.hero-info .hero-job { font-size:10px; margin:2px 0 7px; }
.hero-info .hero-sub { font-size:10px; margin-top:6px; }
.char-stat-row { display:flex; align-items:center; gap:6px; padding:2px 0; }
.char-stat-lbl { font-size:11px; min-width:74px; }
.char-stat-bar { flex:1; background:#0f0f12; border:none; height:5px; padding:0; }
.char-stat-fill { height:100%; }
.char-stat-val { font-size:13px; font-weight:600; min-width:20px; text-align:right;
  font-family:var(--cond); }

/* Press feedback: flat dim instead of pixel shift */
.nav-btn:active,.add-btn:active,.btn:active,.rec-btn:active,.mini-btn:active,
.period-nav button:active { opacity:.55; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <p id="app-title">
      <span>WEEKLY <span class="t-red">QUEST</span><span class="t-jp">週間クエスト</span></span>
      <span>
        <a class="mini-btn" href="gym.html" style="text-decoration:none">GYM</a>
        <a class="mini-btn" href="music.html" style="text-decoration:none">MUSIC</a>
        <a class="mini-btn" href="spots.html" style="text-decoration:none">TOUR</a>
        <button type="button" class="mini-btn" id="menu-open">設定</button>
      </span>
    </p>
  </div>
  <div id="week-nav">
    <button type="button" class="nav-btn" id="prev-week">← 前週</button>
    <span id="week-label"></span>
    <button type="button" class="nav-btn" id="next-week">次週 →</button>
  </div>
  <div id="content"></div>
  <div id="tabbar">
    <button class="tab-btn active" data-tab="schedule"><span class="tab-ico">📝</span>予定</button>
    <button class="tab-btn" data-tab="calendar"><span class="tab-ico">📅</span>週間</button>
    <button class="tab-btn" data-tab="log"><span class="tab-ico">✅</span>記録</button>
    <button class="tab-btn" data-tab="status"><span class="tab-ico">⚔️</span>育成</button>
    <button class="tab-btn" data-tab="stats"><span class="tab-ico">📊</span>統計</button>
  </div>
</div>

<!-- Settings Menu Modal -->
<div class="overlay" id="menu-modal" style="display:none">
  <div class="modal-box">
    <h3 class="modal-title">⚙ 設定</h3>
    <button type="button" class="menu-item" id="gcal-open">📅 Googleカレンダー連携</button>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const DAYS    = ["月","火","水","木","金","土","日"];
const DAY_KEYS= ["mon","tue","wed","thu","fri","sat","sun"];
const HOUR_H  = 48;

const WORKOUT_PARTS = [
  {id:"chest",    label:"胸",   color:"#EF5350"},
  {id:"back",     label:"背中", color:"#E53935"},
  {id:"shoulder", label:"肩",   color:"#F44336"},
  {id:"arm",      label:"腕",   color:"#EF9A9A"},
  {id:"leg",      label:"脚",   color:"#C62828"},
];
const BASE_CATS = [
  {id:"instrument",label:"楽器練習",icon:"🎵",color:"#7986CB",light:"#E8EAF6"},
  {id:"cooking",   label:"自炊",    icon:"🍳",color:"#66BB6A",light:"#E8F5E9"},
  {id:"medicine",  label:"専門医勉強",icon:"🧠",color:"#FFA726",light:"#FFF3E0"},
  {id:"english",   label:"英語学習",icon:"🌐",color:"#26C6DA",light:"#E0F7FA"},
];
const WORKOUT_CATS = WORKOUT_PARTS.map(p=>({
  id:`workout_${p.id}`,label:`筋トレ（${p.label}）`,icon:"💪",
  color:p.color,light:"#FFEBEE",part:p,
}));
const ALL_CATS = [...WORKOUT_CATS,...BASE_CATS];
const CAT_MAP  = {};
ALL_CATS.forEach(c=>CAT_MAP[c.id]=c);
// Legacy fallback for removed parts (体幹/全身) so old saved entries still render
CAT_MAP["workout_core"]={id:"workout_core",label:"筋トレ（体幹）",icon:"💪",color:"#B71C1C",light:"#FFEBEE",part:{id:"core",label:"体幹",color:"#B71C1C"}};
CAT_MAP["workout_full"]={id:"workout_full",label:"筋トレ（全身）",icon:"💪",color:"#FF5252",light:"#FFEBEE",part:{id:"full",label:"全身",color:"#FF5252"}};
const catById  = id=>CAT_MAP[id];
// Calendar display name: workout → part label only (e.g. "胸"), others → full label
function calName(c){ return c?.part ? c.part.label : (c?.label||""); }

// ── State ─────────────────────────────────────────────────────────────────────
let tab       = "schedule";
let weekKey   = getWeekKey(new Date());
let schedules = JSON.parse(localStorage.getItem("wt_schedules")||"{}");
let records   = JSON.parse(localStorage.getItem("wt_records")||"{}");
let addCtx    = null;
let recCtx    = null;
let addCat    = "workout_chest";
let recRating = 0;
let statsMode = "month";              // "month" | "year"
let statsYear = new Date().getFullYear();
let statsMonth= new Date().getMonth();  // 0-11

// ── Helpers ───────────────────────────────────────────────────────────────────
function getWeekKey(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function getWeekDates(wk){
  const [y,m,d]=wk.split("-").map(Number);
  return DAY_KEYS.map((_,i)=>new Date(y,m-1,d+i));
}
function todayDK(){const d=new Date().getDay();return DAY_KEYS[d===0?6:d-1];}
function timeToMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function emptyWeek(){const w={};DAY_KEYS.forEach(d=>w[d]=[]);return w;}
function getRec(dk,cat){return records?.[weekKey]?.[dk]?.[cat]||{done:false,note:"",duration:"",rating:0};}
// Google Calendar "add event" template URL for an entry on a given date
function gcalUrl(entry,dateObj){
  const c=catById(entry.cat);
  const title=((c?.icon||"")+" "+(entry.label||c?.label||"")).trim();
  const y=dateObj.getFullYear();
  const m=String(dateObj.getMonth()+1).padStart(2,"0");
  const d=String(dateObj.getDate()).padStart(2,"0");
  const s=entry.time.replace(":","")+"00";
  const e=(entry.endTime||entry.time).replace(":","")+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(title)
    +`&dates=${y}${m}${d}T${s}/${y}${m}${d}T${e}`
    +"&ctz=Asia/Tokyo";
}

function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function starsHTML(val,interactive){
  return[1,2,3,4,5].map(n=>
    `<span style="color:${n<=val?"#c8a557":"#3d3d45"};cursor:${interactive?"pointer":"default"};user-select:none"
      ${interactive?`data-n="${n}"`:""}>${n<=val?"★":"☆"}</span>`
  ).join("");
}

// ── XP / Level system ─────────────────────────────────────────────────────────
// XP per completed task = 10 base + duration bonus (1xp/5min, max 20) + rating bonus (rating*2)
function xpForRecord(rec){
  if(!rec?.done)return 0;
  let xp=10;
  if(rec.duration)xp+=Math.min(20,Math.floor((parseInt(rec.duration)||0)/5));
  if(rec.rating)xp+=rec.rating*2;
  return xp;
}
// Level curve: XP needed to REACH level L from start = 50 * L^1.6 (cumulative)
// We invert to get level from total XP.
function levelFromXP(totalXP){
  let lvl=1;
  while(totalXP>=xpToReach(lvl+1))lvl++;
  return lvl;
}
function xpToReach(level){ // cumulative XP needed to be AT this level
  if(level<=1)return 0;
  return Math.round(50*Math.pow(level-1,1.6));
}
function levelProgress(totalXP){
  const lvl=levelFromXP(totalXP);
  const cur=xpToReach(lvl), next=xpToReach(lvl+1);
  return { lvl, into:totalXP-cur, span:next-cur, pct:Math.round((totalXP-cur)/(next-cur)*100) };
}
// Rank title based on level
function rankTitle(lvl){
  if(lvl>=40)return "レジェンド";
  if(lvl>=30)return "達人";
  if(lvl>=20)return "エキスパート";
  if(lvl>=12)return "上級者";
  if(lvl>=6) return "中級者";
  if(lvl>=3) return "見習い";
  return "ビギナー";
}
// Compute total XP per category across all records
function computeXP(){
  const xp={};
  ALL_CATS.forEach(c=>xp[c.id]=0);
  // include legacy
  xp["workout_core"]=0; xp["workout_full"]=0;
  Object.keys(records).forEach(wk=>{
    DAY_KEYS.forEach(dk=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(xp[catId]===undefined)xp[catId]=0;
        xp[catId]+=xpForRecord(day[catId]);
      });
    });
  });
  return xp;
}
// Last completion date (Date object) per track ("workout" combined, or base cat id). null if never.
function computeLastDone(){
  const last={};  // trackId → Date
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        const trackId=catId.startsWith("workout_")?"workout":catId;
        const d=dates[di];
        if(!last[trackId]||d>last[trackId])last[trackId]=d;
      });
    });
  });
  return last;
}
// ── Decay config ──
const DECAY_GRACE_DAYS = 7;   // サボってもこの日数までは減らない
const DECAY_PER_DAY    = 8;   // 猶予超過後、1日あたり減るXP（ゆるやか）
function daysSince(date){
  if(!date)return 0;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(date); d.setHours(0,0,0,0);
  return Math.floor((today-d)/(1000*60*60*24));
}
// Apply decay to a raw XP total given the last-done date.
function applyDecay(rawXP, lastDate){
  if(!lastDate||rawXP<=0)return {xp:rawXP, decayDays:0, lost:0};
  const idle=daysSince(lastDate);
  const decayDays=Math.max(0, idle-DECAY_GRACE_DAYS);
  const lost=Math.min(rawXP, decayDays*DECAY_PER_DAY);
  return { xp:Math.max(0,rawXP-lost), decayDays, lost, idle };
}
// Workout XP combined (all parts → one "筋トレ" track)
function workoutTotalXP(xp){
  return WORKOUT_CATS.reduce((a,c)=>a+(xp[c.id]||0),0)+(xp["workout_core"]||0)+(xp["workout_full"]||0);
}
// Overall total level = sum of all category levels
function overallStats(xp){
  let totalLvl=0, totalXP=0;
  const tracks=getTracks(xp);
  tracks.forEach(t=>{ totalLvl+=t.lvl; totalXP+=t.xp; });
  return { totalLvl, totalXP, tracks };
}
// Build display tracks: 筋トレ(合算) + 4 base cats, with decay applied
function getTracks(xp){
  const last=computeLastDone();
  const tracks=[];
  const wRaw=workoutTotalXP(xp);
  const wD=applyDecay(wRaw, last["workout"]);
  const wp=levelProgress(wD.xp);
  tracks.push({ id:"workout", label:"筋トレ", icon:"💪", color:"#E57373",
    xp:wD.xp, rawXP:wRaw, lvl:wp.lvl, into:wp.into, span:wp.span, pct:wp.pct,
    decayDays:wD.decayDays, lost:wD.lost, idle:wD.idle, lastDate:last["workout"]||null });
  BASE_CATS.forEach(c=>{
    const raw=xp[c.id]||0;
    const dd=applyDecay(raw, last[c.id]);
    const p=levelProgress(dd.xp);
    tracks.push({ id:c.id, label:c.label, icon:c.icon, color:c.color,
      xp:dd.xp, rawXP:raw, lvl:p.lvl, into:p.into, span:p.span, pct:p.pct,
      decayDays:dd.decayDays, lost:dd.lost, idle:dd.idle, lastDate:last[c.id]||null });
  });
  return tracks;
}

// ── Save to localStorage ──────────────────────────────────────────────────────
function persist(){
  localStorage.setItem("wt_schedules", JSON.stringify(schedules));
  localStorage.setItem("wt_records",   JSON.stringify(records));
}
function saveData(){
  persist();
  showToast();
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg||"✅ 保存しました";
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1800);
}

// ── Google Calendar auto-sync (Google Identity Services + Calendar API) ──────
const GCAL_SCOPE="https://www.googleapis.com/auth/calendar";
const GCAL_CAL_NAME="週間クエスト";
let gcalToken=null, gcalTokenExp=0, gcalTokenClient=null;
function gcalClientId(){return localStorage.getItem("wt_gcal_client_id")||"";}
function gcalAuto(){return localStorage.getItem("wt_gcal_auto")==="1"&&!!gcalClientId();}
function gcalGetToken(forceConsent){
  return new Promise((resolve,reject)=>{
    if(!forceConsent&&gcalToken&&Date.now()<gcalTokenExp-60000)return resolve(gcalToken);
    if(!window.google?.accounts?.oauth2)return reject(new Error("Google認証ライブラリが未読み込みです"));
    if(!gcalClientId())return reject(new Error("クライアントID未設定"));
    if(!gcalTokenClient){
      gcalTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:gcalClientId(), scope:GCAL_SCOPE, callback:()=>{},
      });
    }
    gcalTokenClient.callback=resp=>{
      if(resp.error)return reject(new Error(resp.error));
      gcalToken=resp.access_token;
      gcalTokenExp=Date.now()+(resp.expires_in||3600)*1000;
      resolve(gcalToken);
    };
    // forceConsent: re-show the consent screen so newly-added scopes are actually granted
    gcalTokenClient.requestAccessToken({prompt:forceConsent?"consent":""});
  });
}
function gcalEventBody(entry,dateObj){
  const c=catById(entry.cat);
  const dstr=`${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,"0")}-${String(dateObj.getDate()).padStart(2,"0")}`;
  return {
    summary:((c?.icon||"")+" "+(entry.label||c?.label||"")).trim(),
    start:{dateTime:`${dstr}T${entry.time}:00`,timeZone:"Asia/Tokyo"},
    end:{dateTime:`${dstr}T${entry.endTime||entry.time}:00`,timeZone:"Asia/Tokyo"},
    visibility:"private",
  };
}
async function gcalApi(path,method,body){
  const token=await gcalGetToken();
  const res=await fetch("https://www.googleapis.com/calendar/v3"+path,{
    method,
    headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined,
  });
  if(!res.ok&&res.status!==410){
    // Surface Google's real reason (API disabled / insufficient scope / rate limit …)
    let detail="";
    try{const j=await res.json();detail=j.error?.message||j.error?.errors?.[0]?.reason||"";}catch(e){}
    const err=new Error("Calendar API "+res.status+(detail?" — "+detail:""));
    err.status=res.status;
    throw err;
  }
  return res.status===204||res.status===410?null:res.json();
}
// Dedicated app calendar: find or create "週間クエスト" so events stay out of マイカレンダー.
// Falls back to "primary" (events still marked private) if calendar management is not permitted.
function gcalEnsureCalendar(){
  const saved=localStorage.getItem("wt_gcal_cal_id");
  if(saved)return Promise.resolve(saved);
  return gcalApi("/users/me/calendarList?minAccessRole=owner","GET").then(list=>{
    const hit=(list.items||[]).find(c=>c.summary===GCAL_CAL_NAME);
    if(hit)return hit.id;
    return gcalApi("/calendars","POST",{summary:GCAL_CAL_NAME,timeZone:"Asia/Tokyo"}).then(c=>c.id);
  }).then(id=>{localStorage.setItem("wt_gcal_cal_id",id);return id;});
}
// Fire-and-forget sync helpers: never block the UI, toast on success/failure
function gcalSyncInsert(entry,dateObj){
  if(!gcalAuto())return;
  (async()=>{
    let cal;
    try{ cal=await gcalEnsureCalendar(); }
    catch(e){ cal="primary"; }   // no calendar-create permission → private event on primary
    const ev=await gcalApi(`/calendars/${encodeURIComponent(cal)}/events`,"POST",gcalEventBody(entry,dateObj));
    entry.gcalId=ev.id; entry.gcalCal=cal; persist();
    showToast(cal==="primary"?"📅 カレンダーに登録（非公開）":"📅 週間クエストに登録しました");
  })().catch(err=>showToast("⚠️ 同期失敗: "+(err.message||"")));
}
function gcalSyncPatch(entry,dateObj){
  if(!gcalAuto()||!entry.gcalId)return;
  const cal=encodeURIComponent(entry.gcalCal||"primary");
  gcalApi(`/calendars/${cal}/events/${entry.gcalId}`,"PATCH",gcalEventBody(entry,dateObj))
    .catch(()=>showToast("⚠️ カレンダー同期に失敗しました"));
}
function gcalSyncDelete(entry){
  if(!gcalAuto()||!entry.gcalId)return;
  const cal=encodeURIComponent(entry.gcalCal||"primary");
  gcalApi(`/calendars/${cal}/events/${entry.gcalId}`,"DELETE")
    .catch(()=>showToast("⚠️ カレンダー同期に失敗しました"));
}

// ── Week nav ──────────────────────────────────────────────────────────────────
function renderNav(){
  const dates=getWeekDates(weekKey);
  const isNow=weekKey===getWeekKey(new Date());
  document.getElementById("week-label").innerHTML=
    `${dates[0].getMonth()+1}/${dates[0].getDate()} 〜 `+
    `${dates[6].getMonth()+1}/${dates[6].getDate()}`+
    (isNow?`<span class="badge">今週</span>`:"");
}
document.getElementById("prev-week").addEventListener("click",()=>{
  const [y,m,d]=weekKey.split("-").map(Number);
  const dt=new Date(y,m-1,d-7);weekKey=getWeekKey(dt);render();});
document.getElementById("next-week").addEventListener("click",()=>{
  const [y,m,d]=weekKey.split("-").map(Number);
  const dt=new Date(y,m-1,d+7);weekKey=getWeekKey(dt);render();});

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tab-btn");if(!b)return;
  tab=b.dataset.tab;
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  render();
});

// ── List View ─────────────────────────────────────────────────────────────────
function renderList(){
  const cont=document.getElementById("content");
  cont.innerHTML="";
  const wrap=el("div","");wrap.id="list-view";
  const ws=schedules[weekKey]||emptyWeek();
  const dates=getWeekDates(weekKey);
  const isNow=weekKey===getWeekKey(new Date());
  const tdk=todayDK();

  DAY_KEYS.forEach((dk,di)=>{
    const isToday=isNow&&dk===tdk;
    const entries=ws[dk]||[];
    const card=el("div","day-card"+(isToday?" today":""));

    const hdr=el("div","day-header");
    hdr.appendChild(el("span","day-label",
      DAYS[di]+`<span class="day-date">${dates[di].getMonth()+1}/${dates[di].getDate()}</span>`+
      (isToday?`<span class="today-badge">今日</span>`:"")));
    const ab=el("button","add-btn","＋ 予定");
    ab.onclick=()=>openAdd(di,dk);
    hdr.appendChild(ab);
    card.appendChild(hdr);

    // 予定外だが完了記録がある種目(ジムアプリ⚡からの自動記録など)は記録タブに行を出す
    const extraRecs = tab==="log"
      ? Object.entries(records?.[weekKey]?.[dk]||{})
          .filter(([catId,r])=>r?.done && !entries.some(e=>e.cat===catId))
      : [];
    if(!entries.length&&!extraRecs.length){card.appendChild(el("p","empty-day","予定なし"));}
    else entries.forEach((e,ei)=>{
      const c=catById(e.cat);
      const rec=getRec(dk,e.cat);
      const row=el("div","entry-row");

      if(tab==="log"){
        const cb=document.createElement("input");
        cb.type="checkbox";cb.checked=rec.done;
        cb.style.cssText=`accent-color:${c?.color||"#999"};width:16px;height:16px;cursor:pointer;flex-shrink:0`;
        cb.onchange=()=>toggleDone(dk,e);
        row.appendChild(cb);
      }
      row.appendChild(el("span","",c?.icon||""));
      row.appendChild(el("span","entry-time",e.time+(e.endTime?`〜${e.endTime}`:"")));
      row.appendChild(el("span","entry-name"+(tab==="log"&&rec.done?" done":""),e.label||c?.label||""));
      const chip=el("span","cat-chip",c?.label||"");
      chip.style.cssText=`border:1px solid ${c?.color||"#666"};color:${c?.color||"#aaa"};background:transparent`;
      row.appendChild(chip);
      if(tab==="log"){

// ── Drag to move events ───────────────────────────────────────────────────────
function attachDragHandlers(ev, dayIdx, dayKey, entry, entryIdx){
  let pressTimer=null, dragging=false, startX=0, startY=0;
  let grid=null, dayCols=[], colW=0, dur=parseInt(ev.dataset.dur)||60;
  let moved=false;

  function pointerDown(clientX, clientY){
    startX=clientX; startY=clientY; moved=false;
    // Long-press (250ms) to enter drag mode
    pressTimer=setTimeout(()=>{
      dragging=true;
      ev.classList.add("dragging");
      document.getElementById("cal-scroll").classList.add("no-scroll");
      grid=document.getElementById("cal-grid");
      dayCols=Array.from(grid.querySelectorAll(".cal-day-col"));
      colW=dayCols[0].getBoundingClientRect().width;
      if(navigator.vibrate)navigator.vibrate(30);
      showHint(entry.time+(entry.endTime?"〜"+entry.endTime:""));
    },250);
  }

  function pointerMove(clientX, clientY){
    if(Math.abs(clientX-startX)>8||Math.abs(clientY-startY)>8)moved=true;
    if(!dragging){
      // if user moves before long-press completes, cancel (let it scroll)
      if(moved){clearTimeout(pressTimer);}
      return;
    }
    // Determine target column by X
    let targetCol=null;
    for(const col of dayCols){
      const r=col.getBoundingClientRect();
      if(clientX>=r.left&&clientX<r.right){targetCol=col;break;}
    }
    if(!targetCol)targetCol=dayCols[parseInt(ev.dataset.curDayIdx??dayIdx)];
    const colRect=targetCol.getBoundingClientRect();

    // Determine time by Y (relative to column top), snap to 1 hour
    let relY=clientY-colRect.top;
    let hour=Math.round(relY/HOUR_H - 0.5*(dur/60)); // center under finger
    hour=Math.max(0, Math.min(24-Math.ceil(dur/60), hour));

    // Move the element visually into the target column
    if(ev.parentElement!==targetCol)targetCol.appendChild(ev);
    ev.style.top=(hour*HOUR_H)+"px";
    ev.dataset.curDayIdx=targetCol.dataset.dayIdx;
    ev.dataset.curHour=hour;

    const sH=String(hour).padStart(2,"0");
    const eH=String(Math.min(hour+Math.round(dur/60),24)).padStart(2,"0");
    showHint(`${DAYS[targetCol.dataset.dayIdx]} ${sH}:00〜${eH}:00`);
  }

  function pointerUp(){
    clearTimeout(pressTimer);
    hideHint();
    document.getElementById("cal-scroll").classList.remove("no-scroll");
    if(dragging){
      dragging=false;
      ev.classList.remove("dragging");
      const newDayIdx=parseInt(ev.dataset.curDayIdx??dayIdx);
      const newHour=parseInt(ev.dataset.curHour??Math.floor(timeToMin(entry.time)/60));
      commitMove(dayKey, entryIdx, newDayIdx, newHour, dur);
    }else if(!moved){
      // treat as tap → open record
      openRec(dayIdx, dayKey, entry);
    }
  }

  // Touch events
  ev.addEventListener("touchstart",e=>{
    const t=e.touches[0]; pointerDown(t.clientX,t.clientY);
  },{passive:true});
  ev.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    if(dragging)e.preventDefault();
    pointerMove(t.clientX,t.clientY);
  },{passive:false});
  ev.addEventListener("touchend",pointerUp);
  ev.addEventListener("touchcancel",pointerUp);

  // Mouse events (desktop testing)
  ev.addEventListener("mousedown",e=>{
    e.preventDefault(); pointerDown(e.clientX,e.clientY);
    const mm=ev2=>pointerMove(ev2.clientX,ev2.clientY);
    const mu=()=>{pointerUp();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};
    document.addEventListener("mousemove",mm);
    document.addEventListener("mouseup",mu);
  });
}

function commitMove(dayKey, entryIdx, newDayIdx, newHour, dur){
  const ws=schedules[weekKey]||emptyWeek();
  const entry=ws[dayKey]?.[entryIdx];
  if(!entry)return;
  const newDayKey=DAY_KEYS[newDayIdx];
  const newStart=newHour*60;
  const newEnd=Math.min(newStart+dur, 24*60);
  entry.time=`${String(Math.floor(newStart/60)).padStart(2,"0")}:${String(newStart%60).padStart(2,"0")}`;
  entry.endTime=`${String(Math.floor(newEnd/60)).padStart(2,"0")}:${String(newEnd%60).padStart(2,"0")}`;
  // Remove from old day, add to new day
  ws[dayKey].splice(entryIdx,1);
  if(!ws[newDayKey])ws[newDayKey]=[];
  ws[newDayKey].push(entry);
  ws[newDayKey].sort((a,b)=>a.time.localeCompare(b.time));
  schedules[weekKey]=ws;
  saveData();
  gcalSyncPatch(entry, getWeekDates(weekKey)[newDayIdx]);
  renderCalendar();
}

}

// ── Job character (external PNG sprites, job × level-tier) ────────────────────
// Same person throughout; the job comes from what you keep doing, and the
// costume evolves with level (Lv1 = modern life → Lv30 = full fantasy).
// Art: sprites/<file>_lv<tier>.png (tier 1/10/20/30). Missing tiers fall back
// to lower tiers → sprites/<file>.png → the primary base job's art, so new
// art can be dropped in one file at a time without breaking anything.
const TRACK_JOB={workout:"monk",instrument:"trickster",english:"redmage",medicine:"whitemage",cooking:"traveler"};
const JOB_DEF={
  // base jobs (one per habit)
  novice:    {name:"みならい",   file:"novice"},
  monk:      {name:"モンク",     file:"monk"},
  trickster: {name:"遊び人",     file:"bard"},
  redmage:   {name:"赤魔道士",   file:"novice"},
  whitemage: {name:"白魔道士",   file:"whitemage"},
  traveler:  {name:"旅人",       file:"chef"},
  // composite jobs (both habits at the tier level unlock these)
  paladin:   {name:"パラディン", file:"paladin",   pair:["workout","medicine"]},
  sage:      {name:"賢者",       file:"sage",      pair:["medicine","english"]},
  bardic:    {name:"吟遊詩人",   file:"bardic",    pair:["instrument","english"]},
  ranger:    {name:"レンジャー", file:"ranger",    pair:["workout","cooking"]},
  apothecary:{name:"薬師",       file:"apothecary",pair:["medicine","cooking"]},
  adventurer:{name:"冒険家",     file:"adventurer",pair:["english","cooking"]},
  dancer:    {name:"踊り子",     file:"dancer",    pair:["workout","instrument"]},
};
const TIER_PREFIX={10:"見習い",20:"",30:"マスター"};
function tierOf(lvl){return lvl>=30?30:lvl>=20?20:lvl>=10?10:1;}
// Decide the current job: a qualifying composite pair (both >= Lv10) beats the
// single top stat; among pairs, the one with the higher shared level wins.
function jobState(tracks){
  const by=id=>tracks.find(t=>t.id===id);
  let best=null;
  Object.entries(JOB_DEF).forEach(([key,def])=>{
    if(!def.pair)return;
    const a=by(def.pair[0]),b=by(def.pair[1]);
    if(!a||!b)return;
    const m=Math.min(a.lvl,b.lvl);
    if(m>=10&&(!best||m>best.min))
      best={key,min:m,primary:TRACK_JOB[a.lvl>=b.lvl?a.id:b.id]};
  });
  if(best)return {key:best.key,tier:tierOf(best.min),primary:best.primary,composite:true};
  const max=Math.max(...tracks.map(t=>t.lvl));
  const top=tracks.filter(t=>t.lvl===max);
  if(max<=1||top.length===tracks.length)return {key:"novice",tier:1,primary:"novice",composite:false};
  const jk=TRACK_JOB[top[0].id]||"novice";
  return {key:jk,tier:tierOf(max),primary:jk,composite:false};
}
function jobDisplayName(st){
  const base=JOB_DEF[st.key].name;
  return st.composite?(TIER_PREFIX[st.tier]??"")+base:base;
}
// Ordered list of sprite paths to try for this job state.
// "<file>_lv<t>x2.png" is a 2-frame idle-animation sheet (frames side by side,
// equal width); it is preferred over the still "<file>_lv<t>.png".
function spriteCandidates(st){
  const tiers=[30,20,10,1].filter(t=>t<=st.tier);
  const out=[];
  const push=file=>{
    tiers.forEach(t=>{out.push(`sprites/${file}_lv${t}x2.png`);out.push(`sprites/${file}_lv${t}.png`);});
    out.push(`sprites/${file}x2.png`);
    out.push(`sprites/${file}.png`);
  };
  push(JOB_DEF[st.key].file);
  if(st.key!==st.primary)push(JOB_DEF[st.primary].file);
  if(!out.includes("sprites/novice.png"))out.push("sprites/novice.png");
  return out;
}
function setHeroSprite(img,st){
  const cands=spriteCandidates(st);
  let i=0;
  img.onerror=()=>{i++;if(i<cands.length)img.src=cands[i];else img.onerror=null;};
  img.onload=()=>{
    const two=img.src.includes("x2.png");
    img.classList.toggle("anim2",two);
    const clip=img.closest(".hero-sprite-clip");
    if(clip)clip.style.width=two?(img.getBoundingClientRect().width/2)+"px":"";
  };
  img.src=cands[0];
}

// ── Stats View ────────────────────────────────────────────────────────────────
// Aggregate completed counts for a given period filter.
// filterFn(dateObj) → true if the entry's date is in the selected period.
function aggregateStats(filterFn){
  const st={};
  ALL_CATS.forEach(c=>st[c.id]={done:0,total:0,totalMin:0,ratings:[]});
  Object.keys(schedules).forEach(wk=>{
    const sc=schedules[wk]||{};
    const dates=getWeekDates(wk); // actual date per day index
    DAY_KEYS.forEach((dk,di)=>{
      const dateObj=dates[di];
      if(!filterFn(dateObj))return;
      (sc[dk]||[]).forEach(e=>{
        if(!st[e.cat])return;
        st[e.cat].total++;
        const rec=records[wk]?.[dk]?.[e.cat];
        if(rec?.done){
          st[e.cat].done++;
          if(rec.duration)st[e.cat].totalMin+=parseInt(rec.duration)||0;
          if(rec.rating)st[e.cat].ratings.push(rec.rating);
        }
      });
    });
  });
  return st;
}

// Fixed 5-track order for the achievement calendar (matches the STATUS panel)
const CAL_TRACKS=[
  {id:"workout",   color:"#E57373", label:"筋トレ", icon:"💪"},
  {id:"medicine",  color:"#FFA726", label:"専門医", icon:"🧠"},
  {id:"instrument",color:"#7986CB", label:"楽器",   icon:"🎵"},
  {id:"english",   color:"#26C6DA", label:"英語",   icon:"🌐"},
  {id:"cooking",   color:"#66BB6A", label:"自炊",   icon:"🍳"},
];
function trackOf(catId){return catId.startsWith("workout_")?"workout":catId;}
// Which of the 5 tracks were completed each day: {dayOfMonth: Set(trackId)}
function completedTracksForMonth(year,month){
  const map={};
  Object.keys(records).forEach(wk=>{
    const dates=getWeekDates(wk);
    DAY_KEYS.forEach((dk,di)=>{
      const day=records[wk]?.[dk];
      if(!day)return;
      const d=dates[di];
      if(d.getFullYear()!==year||d.getMonth()!==month)return;
      Object.keys(day).forEach(catId=>{
        if(!day[catId]?.done)return;
        (map[d.getDate()]=map[d.getDate()]||new Set()).add(trackOf(catId));
      });
    });
  });
  return map;
}

function renderStats(){
  const cont=document.getElementById("content");
  cont.innerHTML="";
  const wrap=el("div","");wrap.id="stats-view";

  // ── Mode toggle ──
  const toggle=el("div","mode-toggle");
  const mBtn=el("button",statsMode==="month"?"active":"","月間");
  const yBtn=el("button",statsMode==="year"?"active":"","年間");
  mBtn.onclick=()=>{statsMode="month";renderStats();};
  yBtn.onclick=()=>{statsMode="year";renderStats();};
  toggle.appendChild(mBtn);toggle.appendChild(yBtn);
  wrap.appendChild(toggle);

  // ── Period nav ──
  const now=new Date();
  const pNav=el("div","period-nav");
  const prevB=el("button",null,"←");
  const nextB=el("button",null,"→");
  const lbl=el("span","period-label");
  if(statsMode==="month"){
    lbl.textContent=`${statsYear}年 ${statsMonth+1}月`;
    prevB.onclick=()=>{statsMonth--;if(statsMonth<0){statsMonth=11;statsYear--;}renderStats();};
    nextB.onclick=()=>{statsMonth++;if(statsMonth>11){statsMonth=0;statsYear++;}renderStats();};
    // disable next if future
    if(statsYear>now.getFullYear()||(statsYear===now.getFullYear()&&statsMonth>=now.getMonth()))
      nextB.disabled=true;
  }else{
    lbl.textContent=`${statsYear}年`;
    prevB.onclick=()=>{statsYear--;renderStats();};
    nextB.onclick=()=>{statsYear++;renderStats();};
    if(statsYear>=now.getFullYear())nextB.disabled=true;
  }
  pNav.appendChild(prevB);pNav.appendChild(lbl);pNav.appendChild(nextB);
  wrap.appendChild(pNav);

  // ── Filter ──
  const filterFn=(d)=>{
    if(statsMode==="month")return d.getFullYear()===statsYear&&d.getMonth()===statsMonth;
    return d.getFullYear()===statsYear;
  };
  const st=aggregateStats(filterFn);

  // ── Monthly achievement dot calendar ──
  if(statsMode==="month"){
    wrap.appendChild(el("p","section-label","達成カレンダー"));
    const calCard=el("div","stats-card");
    const grid=el("div","mcal-grid");
    DAYS.forEach(d=>grid.appendChild(el("div","mcal-hdr",d)));
    const doneMap=completedTracksForMonth(statsYear,statsMonth);
    const offset=(new Date(statsYear,statsMonth,1).getDay()+6)%7; // Monday-start
    const daysIn=new Date(statsYear,statsMonth+1,0).getDate();
    const today=new Date();
    for(let i=0;i<offset;i++)grid.appendChild(el("div","mcal-cell empty"));
    for(let dd=1;dd<=daysIn;dd++){
      const isToday=today.getFullYear()===statsYear&&today.getMonth()===statsMonth&&today.getDate()===dd;
      const cell=el("div","mcal-cell"+(isToday?" today":""));
      cell.appendChild(el("div","mcal-num",String(dd)));
      const done=doneMap[dd]||new Set();
      const slots=el("div","mcal-slots");
      CAL_TRACKS.forEach(t=>{
        const slot=el("div","mcal-slot");
        if(done.has(t.id))slot.style.background=t.color;
        slots.appendChild(slot);
      });
      cell.appendChild(slots);
      grid.appendChild(cell);
    }
    calCard.appendChild(grid);
    // legend
    const legend=el("div","mcal-legend");
    CAL_TRACKS.forEach(t=>{
      const s=el("span","");
      s.innerHTML=`<i style="background:${t.color}"></i>${t.label}`;
      legend.appendChild(s);
    });
    calCard.appendChild(legend);
    wrap.appendChild(calCard);
  }

  // ── Bar chart: completed counts per category (workout split by part) ──
  // Order: 7 workout parts + 4 base cats
  const barCats=[...WORKOUT_CATS,...BASE_CATS];
  const maxDone=Math.max(1,...barCats.map(c=>st[c.id].done));
  wrap.appendChild(el("p","section-label","達成回数"));
  const chartCard=el("div","stats-card");
  const chart=el("div","bar-chart");
  barCats.forEach(c=>{
    const s=st[c.id];
    const h=Math.round(s.done/maxDone*110);
    const col=el("div","bar-col");
    const shortLbl=c.part?c.part.label:c.label.replace("学習","").replace("練習","").replace("専門医","専門");
    col.innerHTML=
      `<span class="bar-val">${s.done}</span>`+
      `<div class="bar" style="height:${s.done>0?Math.max(h,6):2}px;background:${c.color}"></div>`+
      `<span class="bar-lbl">${c.part?"":c.icon+"<br>"}${shortLbl}</span>`;
    chart.appendChild(col);
  });
  chartCard.appendChild(chart);
  chartCard.appendChild(el("p","",`<span style="font-size:10px;color:#bbb">左7本＝筋トレ部位　右4本＝その他</span>`));
  wrap.appendChild(chartCard);

  // ── Number list ──
  wrap.appendChild(el("p","section-label","カテゴリ別 達成回数"));

  // Workout group card
  const wDone=WORKOUT_CATS.reduce((a,c)=>a+st[c.id].done,0);
  const wMin=WORKOUT_CATS.reduce((a,c)=>a+st[c.id].totalMin,0);
  const wCard=el("div","stats-card");
  let wHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span style="font-size:18px">💪</span>
    <span style="font-weight:700;font-size:14px">筋トレ</span>
    <span style="margin-left:auto;font-weight:700;font-size:15px;color:#E57373">${wDone}回</span>
  </div>`;
  WORKOUT_PARTS.forEach(p=>{
    const s=st[`workout_${p.id}`];
    wHTML+=`<div class="num-row">
      <span class="part-dot" style="background:${p.color}"></span>
      <span style="font-size:13px">${p.label}</span>
      <span class="num-count" style="color:${p.color}">${s.done}回</span>
      <span class="num-min">${s.totalMin>0?s.totalMin+"分":""}</span>
    </div>`;
  });
  wCard.innerHTML=wHTML;
  wrap.appendChild(wCard);

  // Base categories
  BASE_CATS.forEach(c=>{
    const s=st[c.id];
    const avg=s.ratings.length?(s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length).toFixed(1):"—";
    const card=el("div","stats-card");
    card.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">${c.icon}</span>
      <span style="font-weight:700;font-size:14px">${c.label}</span>
      <span style="margin-left:auto;font-weight:700;font-size:15px;color:${c.color}">${s.done}回</span>
    </div>
    <div class="stats-meta" style="margin-top:6px">
      ${s.totalMin>0?`<span>合計 ${s.totalMin} 分</span>`:""}
      <span>平均評価 ${avg}</span>
    </div>`;
    wrap.appendChild(card);
  });

  cont.appendChild(wrap);
}

// ── Add Modal ─────────────────────────────────────────────────────────────────
function buildCatChips(){
  const row=document.getElementById("cat-chips");row.innerHTML="";
  const isW=addCat.startsWith("workout_");
  const wb=el("button","chip");
  wb.style.cssText=`border-color:#E57373;background:${isW?"#E57373":"transparent"};color:${isW?"#fff":"#E57373"};font-weight:${isW?700:400}`;
  wb.textContent="💪 筋トレ";
  wb.onclick=()=>{addCat=`workout_${addCat.startsWith("workout_")?addCat.replace("workout_",""):"chest"}`;buildCatChips();buildPartChips();};
  row.appendChild(wb);
  BASE_CATS.forEach(c=>{
    const active=addCat===c.id;
    const b=el("button","chip");
    b.style.cssText=`border-color:${c.color};background:${active?c.color:"transparent"};color:${active?"#fff":c.color};font-weight:${active?700:400}`;
    b.textContent=c.icon+" "+c.label;
    b.onclick=()=>{addCat=c.id;buildCatChips();buildPartChips();};
    row.appendChild(b);
  });
}
function buildPartChips(){
  const sec=document.getElementById("part-section");
  const isW=addCat.startsWith("workout_");
  sec.style.display=isW?"":"none";
  if(!isW)return;
  const row=document.getElementById("part-chips");row.innerHTML="";
  const cur=addCat.replace("workout_","");
  WORKOUT_PARTS.forEach(p=>{
    const a=cur===p.id;
    const b=el("button","part-chip");
    b.style.cssText=`border-color:${p.color};background:${a?p.color:"transparent"};color:${a?"#fff":p.color};font-weight:${a?700:400}`;
    b.textContent=p.label;
    b.onclick=()=>{addCat=`workout_${p.id}`;buildPartChips();};
    row.appendChild(b);
  });
}
function openAdd(dayIdx,dayKey,hour){
  addCtx={dayIdx,dayKey};addCat="workout_chest";
  document.getElementById("add-modal-title").textContent=DAYS[dayIdx]+"曜日に予定を追加";
  const hh=hour!==undefined?String(hour).padStart(2,"0"):"07";
  const eh=hour!==undefined?String(Math.min(hour+1,23)).padStart(2,"0"):"08";
  document.getElementById("add-time").value=`${hh}:00`;
  document.getElementById("add-endtime").value=`${eh}:00`;
  document.getElementById("add-label").value="";
  buildCatChips();buildPartChips();
  document.getElementById("add-modal").style.display="flex";
}
document.getElementById("add-time").addEventListener("change",e=>{
  const t=e.target.value;if(!t)return;
  const[h,m]=t.split(":").map(Number);
  const eh=(h+1)%24;
  document.getElementById("add-endtime").value=String(eh).padStart(2,"0")+":"+String(m).padStart(2,"0");
});
document.getElementById("add-cancel").onclick=()=>document.getElementById("add-modal").style.display="none";
document.getElementById("add-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("add-save").onclick=()=>{
  if(!addCtx)return;
  const time=document.getElementById("add-time").value;
  const endTime=document.getElementById("add-endtime").value;
  const label=document.getElementById("add-label").value.trim();
  if(!time)return;
  if(!schedules[weekKey])schedules[weekKey]=emptyWeek();
  const dk=addCtx.dayKey;
  const newEntry={cat:addCat,time,endTime,label,id:Date.now()};
  schedules[weekKey][dk].push(newEntry);
  schedules[weekKey][dk].sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById("add-modal").style.display="none";
  saveData();render();
  gcalSyncInsert(newEntry, getWeekDates(weekKey)[addCtx.dayIdx]);
};

// ── Record Modal ──────────────────────────────────────────────────────────────
function renderRecStars(){
  const el=document.getElementById("rec-stars");
  el.innerHTML=starsHTML(recRating,true);
  el.querySelectorAll("span").forEach(s=>{
    s.addEventListener("click",()=>{
      const n=parseInt(s.dataset.n);
      recRating=recRating===n?0:n;
      renderRecStars();
    });
  });
}
function openRec(dayIdx,dayKey,entry){
  recCtx={dayIdx,dayKey,entry};
  const c=catById(entry.cat);
  const rec=getRec(dayKey,entry.cat);
  recRating=rec.rating||0;
  document.getElementById("rec-title").textContent=(c?.icon||"")+" "+(entry.label||c?.label||"");
  document.getElementById("rec-sub").textContent=DAYS[dayIdx]+" "+entry.time+(entry.endTime?"〜"+entry.endTime:"");
  document.getElementById("rec-duration").value=rec.duration||"";
  document.getElementById("rec-note").value=rec.note||"";
  document.getElementById("rec-done").checked=rec.done||false;
  renderRecStars();
  document.getElementById("rec-modal").style.display="flex";
}
function snapshotLevels(){
  const xp=computeXP();
  const tracks=getTracks(xp);
  const map={};
  tracks.forEach(t=>map[t.id]={lvl:t.lvl,label:t.label});
  return map;
}
function trackIdForCat(catId){
  return catId.startsWith("workout_")?"workout":catId;
}
function checkLevelUp(before, gainedXP){
  const after=snapshotLevels();
  let leveledTrack=null;
  Object.keys(after).forEach(id=>{
    if(before[id]&&after[id].lvl>before[id].lvl)
      leveledTrack={id, label:after[id].label, lvl:after[id].lvl};
  });
  if(leveledTrack)showLevelUp(leveledTrack);
  else if(gainedXP>0)showXPToast(gainedXP);
}

function toggleDone(dk,entry){
  const rec=getRec(dk,entry.cat);
  const before=snapshotLevels();
  const wasDone=rec.done;
  if(!records[weekKey])records[weekKey]={};
  if(!records[weekKey][dk])records[weekKey][dk]={};
  records[weekKey][dk][entry.cat]={...rec,done:!rec.done};
  const gained = !wasDone ? xpForRecord(records[weekKey][dk][entry.cat]) : 0;
  saveData();render();
  if(!wasDone)checkLevelUp(before, gained);
}
document.getElementById("rec-cancel").onclick=()=>document.getElementById("rec-modal").style.display="none";
document.getElementById("rec-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("rec-save").onclick=()=>{
  if(!recCtx)return;
  const{dayKey,entry}=recCtx;
  const before=snapshotLevels();
  const prevRec=getRec(dayKey,entry.cat);
  const prevXP=xpForRecord(prevRec);
  if(!records[weekKey])records[weekKey]={};
  if(!records[weekKey][dayKey])records[weekKey][dayKey]={};
  const newRec={
    done:document.getElementById("rec-done").checked,
    note:document.getElementById("rec-note").value,
    duration:document.getElementById("rec-duration").value,
    rating:recRating,
  };
  records[weekKey][dayKey][entry.cat]=newRec;
  const gained=xpForRecord(newRec)-prevXP;
  document.getElementById("rec-modal").style.display="none";
  saveData();render();
  checkLevelUp(before, gained);
};

// ── Level-up celebration ──────────────────────────────────────────────────────
function showLevelUp(track){
  const c = track.id==="workout" ? {icon:"💪",color:"#E57373"} : catById(track.id);
  document.getElementById("lvl-cat").textContent=(c?.icon||"")+" "+track.label;
  document.getElementById("lvl-num").textContent="Lv. "+track.lvl;
  document.getElementById("lvl-rank").textContent=rankTitle(track.lvl);
  const ov=document.getElementById("levelup-overlay");
  ov.style.display="flex";
  spawnConfetti(ov);
  if(navigator.vibrate)navigator.vibrate([40,40,80]);
}
document.getElementById("levelup-overlay").addEventListener("click",function(){
  this.style.display="none";
  this.querySelectorAll(".confetti").forEach(c=>c.remove());
});
function spawnConfetti(container){
  const colors=["#e01937","#f0f0f2","#96969e","#c8a557","#e01937","#f0f0f2"];
  for(let i=0;i<40;i++){
    const cf=document.createElement("div");
    cf.className="confetti";
    cf.style.left=Math.random()*100+"%";
    cf.style.background=colors[i%colors.length];
    cf.style.animationDuration=(1.5+Math.random()*1.5)+"s";
    cf.style.animationDelay=(Math.random()*0.4)+"s";
    container.appendChild(cf);
  }
}
function showXPToast(xp){
  const t=document.getElementById("xp-toast");
  t.textContent=`+${xp} XP`;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}

// ── Settings menu ─────────────────────────────────────────────────────────────
document.getElementById("menu-open").onclick=()=>document.getElementById("menu-modal").style.display="flex";
document.getElementById("menu-close").onclick=()=>document.getElementById("menu-modal").style.display="none";
document.getElementById("menu-modal").addEventListener("click",e=>{
  if(e.target===e.currentTarget||e.target.closest(".menu-item"))
    document.getElementById("menu-modal").style.display="none";
});

// ── Data export / import ──────────────────────────────────────────────────────
document.getElementById("export-btn").onclick=()=>{
  const blob=new Blob([JSON.stringify({schedules,records})],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="weekly-quest-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("import-btn").onclick=()=>{
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    f.text().then(t=>{
      try{
        const d=JSON.parse(t);
        if(!d.schedules&&!d.records)throw new Error("bad format");
        if(d.schedules)schedules=d.schedules;
        if(d.records)records=d.records;
        saveData();render();
      }catch(err){ alert("データを読み込めませんでした"); }
    });
  };
  inp.click();
};

// ── Google Calendar sync settings modal ───────────────────────────────────────
function setGcalStatus(msg){document.getElementById("gcal-status").textContent=msg;}
document.getElementById("gcal-open").onclick=()=>{
  document.getElementById("gcal-client-id").value=gcalClientId();
  document.getElementById("gcal-auto-check").checked=localStorage.getItem("wt_gcal_auto")!=="0";
  setGcalStatus(gcalAuto()?"✅ 自動同期ON: 週間クエスト（非公開）に同期中":(gcalClientId()?"設定済み（自動同期OFF）":""));
  document.getElementById("gcal-modal").style.display="flex";
};
document.getElementById("gcal-close").onclick=()=>document.getElementById("gcal-modal").style.display="none";
document.getElementById("gcal-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.style.display="none";});
document.getElementById("gcal-test").onclick=()=>{
  // Normalize: strip all whitespace/newlines that sneak in when copying between devices
  const id=document.getElementById("gcal-client-id").value.replace(/\s+/g,"");
  const auto=document.getElementById("gcal-auto-check").checked;
  localStorage.setItem("wt_gcal_client_id",id);
  localStorage.setItem("wt_gcal_auto",auto?"1":"0");
  gcalTokenClient=null; gcalToken=null;
  if(!id){setGcalStatus("クライアントIDを入力してください");return;}
  if(!/^[\w-]+\.apps\.googleusercontent\.com$/.test(id)){
    setGcalStatus("❌ IDの形式が違います。「数字-英数字.apps.googleusercontent.com」の形の文字列全体を貼り付けてください（クライアントシークレットではありません）");
    return;
  }
  document.getElementById("gcal-client-id").value=id;
  setGcalStatus("接続中…（許可画面が出たら承認してください）");
  // forceConsent=true so the newly-added full calendar scope is actually granted
  gcalGetToken(true)
    .then(()=>gcalEnsureCalendar())
    .then(cal=>{
      if(cal==="primary")
        setGcalStatus("✅ 接続OK（マイカレンダーに非公開で同期）。専用カレンダーを使うにはCalendar APIの有効化が必要です");
      else
        setGcalStatus("✅ 接続できました！専用カレンダー『週間クエスト』に非公開で同期されます");
    })
    .catch(err=>{
      let hint="";
      if(String(err.message).includes("403")){
        hint="（403）Google Cloudで①Calendar APIが有効か ②OAuth同意画面のスコープ に問題がある可能性。"
            +"Calendar APIの有効化: console.cloud.google.com のAPIライブラリで『Google Calendar API』を有効化してください";
      }
      setGcalStatus("❌ 接続失敗: "+err.message+" "+hint);
    });
};

// ── PWA service worker ────────────────────────────────────────────────────────
if("serviceWorker" in navigator&&location.protocol==="https:")
  navigator.serviceWorker.register("./sw.js").catch(()=>{});

// ── 外部(ジムアプリ⚡等)の書き込みを取り込む ─────────────────────────────────
// メモリ上の古いコピーで localStorage を上書きしてジムの記録を消さないよう、
// 画面に戻ってきた時・他タブが書いた時に必ず読み直す。
function reloadFromStorage(){
  try{
    schedules=JSON.parse(localStorage.getItem("wt_schedules")||"{}");
    records  =JSON.parse(localStorage.getItem("wt_records")||"{}");
  }catch(e){ return; }
  render();
}
window.addEventListener("storage",e=>{
  if(e.key==="wt_records"||e.key==="wt_schedules")reloadFromStorage();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reloadFromStorage();});
window.addEventListener("pageshow",e=>{if(e.persisted)reloadFromStorage();});

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  renderNav();
  if(tab==="calendar")renderCalendar();
  else if(tab==="stats")renderStats();
  else if(tab==="status")renderStatus();
  else renderList();
}
render();
