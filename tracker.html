  strip.scrollLeft = strip.scrollWidth - strip.clientWidth - stripRight;
  const sel = strip.querySelector(".hb-day.sel");
  if (sel && (stripFocus || sel.offsetLeft < strip.scrollLeft || sel.offsetLeft + sel.offsetWidth > strip.scrollLeft + strip.clientWidth))
    strip.scrollLeft = sel.offsetLeft - (strip.clientWidth - sel.offsetWidth) / 2;
  stripFocus = false;
  stripRight = strip.scrollWidth - strip.clientWidth - strip.scrollLeft;
  bindDaySwipe(v, s.today, day);
  // ステップを足した直後は、続けて入力できるよう同じ欄に戻す
  if (refocusTask) { v.querySelector(`.td-tbox[data-tid="${refocusTask}"] .td-addstep input`)?.focus(); refocusTask = null; }
}
// 習慣の一覧を左右にスワイプすると前の日/次の日へ(縦スクロールや日付ストリップの上では反応しない)
function bindDaySwipe(v, today, day) {
  let x0 = null, y0 = 0;
  v.addEventListener("touchstart", e => {
    x0 = e.touches.length === 1 && !e.target.closest(".hb-days, .hb-pick, button, input") ? e.touches[0].clientX : null;
    y0 = e.touches[0].clientY;
  }, { passive: true });
  v.addEventListener("touchend", e => {
    if (x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
    const k = H.addDays(day, dx > 0 ? -1 : 1);
    if (k > today) return;
    selDay = k;
    renderToday();
  }, { passive: true });
}

function habitCard(h, day, ctx, isOff = false) {
  const p = H.progressOf(h, day, ctx), t = H.targetOf(h), ach = p >= t;
  const rest = !ach && H.isRest(h, day, ctx);
  const weekRatio = h.freq.type === "weekly" ? Math.min(1, H.weekCount(h, H.mondayOf(day), ctx) / h.freq.times) : null;
  const fill = weekRatio ?? Math.min(1, p / t);
  const st = H.currentStreak(h, day, ctx);
  const sub = [H.freqLabel(h), H.progressLabel(h, day, ctx), rest ? "休息日" : ""].filter(Boolean).join(" · ");
  const c = el("div", "hb-card" + (ach ? " done" : "") + (rest ? " rest" : "") + (isOff ? " off" : ""));
  c.style.setProperty("--c", h.color);
  c.style.setProperty("--p", fill.toFixed(3));
  c.tabIndex = 0;
  c.setAttribute("role", "button");
  c.setAttribute("aria-label", `${h.name}の詳細`);
  const glyph = ach ? "✓" : rest ? "休" : "＋";
  c.innerHTML = `<div class="hb-fill"></div>
    <div class="hb-icon" aria-hidden="true">${esc(h.icon)}</div>
    <div class="hb-main"><div class="hb-name">${esc(h.name)}</div>
      <div class="hb-sub">${st.n > 0 ? `<span class="hb-streak">🔥${H.streakLabel(st)}</span>` : ""}${esc(sub)}</div></div>
    <button type="button" class="hb-ring" aria-label="${esc(h.name)}を${ach ? "記録済み。タップで変更" : "記録"}">
      ${ringSvg(52, 4, Math.min(1, p / t), h.color)}<span class="hb-glyph">${glyph}</span></button>`;
  const ring = c.querySelector(".hb-ring");
  bindRing(ring, () => quickTap(h, day), h.freq.type === "weekly" ? null : () => applyRest(h, day, !H.isRest(h, day, ctx)));
  c.onclick = () => openDetail(h.id, day);
  c.onkeydown = e => { if (e.target === c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(h.id, day); } };
  return c;
}
function bindRing(btn, onTap, onLong) {
  let timer = null, long = false;
  btn.addEventListener("pointerdown", () => {
    long = false;
    if (onLong) timer = setTimeout(() => { long = true; if (navigator.vibrate) navigator.vibrate(20); onLong(); }, 550);
  });
  const clear = () => clearTimeout(timer);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, clear));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.addEventListener("click", e => { e.stopPropagation(); if (long) { long = false; return; } onTap(); });
}
// リングの1タップ: チェックは切替、回数は+1、時間は目標まで記録。筋トレは部位を選ぶ
function quickTap(h, day) {
  const s = loadState(), ctx = ctxOf(s);
  const p = H.progressOf(h, day, ctx), t = H.targetOf(h);
  if (h.link === "workout") return openDetail(h.id, day);
  if (h.link === "reading") { // 読書中の本が1冊ならそのページ記録を開く。それ以外は詳細で本を選ぶ
    const rb = RC.booksOn(readingBooks(s.today), day).filter(b => b.status === "reading");
    return rb.length === 1 && window.ReadingUI ? window.ReadingUI.openPage(rb[0].id, day) : openDetail(h.id, day);
  }
  if (h.goal.type === "minutes") return p >= t ? openDetail(h.id, day) : applyChange(h, day, { set: t });
  if (h.goal.type === "count") return applyChange(h, day, { delta: 1 });
  applyChange(h, day, { toggle: true });
}

// ── sheets ─────────────────────────────────────────────────────────────────
function sheet(build) {
  let o = document.getElementById("hb-sheet");
  if (!o) {
    o = document.createElement("div"); o.id = "hb-sheet"; o.className = "overlay"; o.style.display = "none";
    o.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"></div>';
    o.addEventListener("click", e => { if (e.target === o) closeSheet(); });
    document.body.appendChild(o);
  }
  const box = o.querySelector(".modal-box");
  const keep = o.style.display === "flex" ? box.scrollTop : 0;
  box.innerHTML = "";
  build(box);
  o.style.display = "flex";
  box.scrollTop = keep;
}
function closeSheet() { const o = document.getElementById("hb-sheet"); if (o) o.style.display = "none"; }
function btn(label, cls, onClick, attrs = {}) {
  const b = el("button", cls || "", label); b.type = "button";
  Object.entries(attrs).forEach(([k, val]) => b.setAttribute(k, val));
  b.onclick = onClick; return b;
}
function closeRow(extra = []) {
  const row = el("div", "btn-row");
  extra.forEach(b => row.appendChild(b));
  row.appendChild(btn("閉じる", "btn btn-secondary", closeSheet));

}

function goalText(h) {
  if (h.goal.type === "check") return h.link === "workout" ? "1部位でも記録したら達成" : "達成したらチェック";
  return `目標 ${h.goal.target}${H.unitLabel(h)}/日`;

function openDetail(hid, day) {
  const s = loadState(), ctx = ctxOf(s), h = s.habits.find(x => x.id === hid);
  if (!h) return closeSheet();
  sheet(box => {
    const p = H.progressOf(h, day, ctx), t = H.targetOf(h), ach = p >= t;
    const head = el("div", "hb-sheet-head");
    head.innerHTML = `<div class="hb-icon" aria-hidden="true">${esc(h.icon)}</div><h3 class="modal-title">${esc(h.name)}</h3>`;
    head.appendChild(btn("編集", "hb-chip", () => openEditor(h.id)));
    box.appendChild(head);
    box.appendChild(el("p", "modal-sub", esc(`${dayLabel(day, s.today)} · ${H.freqLabel(h)} · ${goalText(h)}`
      + (h.link ? ` · 「${H.LINKS[h.link].label}」の記録と連動` : ""))));
    box.appendChild(el("div", "hb-big", h.goal.type === "check"
      ? (ach ? "✓ 達成" : "未達成") : `${p}<small>/ ${t}${H.unitLabel(h)}</small>`));

    const ctrl = el("div", "hb-ctrl");
    if (h.link === "reading") { // 読書は本ごとに「何ページまで進んだか」を記録する(本棚と同じ記録)
      const rb = RC.booksOn(readingBooks(s.today), day).filter(b => b.status === "reading");
      rb.forEach(b => ctrl.appendChild(btn(`📖 ${b.title} p.${RC.pageAt(b, day)}`, "", () => window.ReadingUI?.openPage(b.id, day))));
      ctrl.appendChild(btn("＋ 本を追加", rb.length ? "" : "on", () => window.ReadingUI?.openEditor(null, { status: "reading", day })));
    } else if (h.link === "workout") {
      const wd = records?.[H.mondayOf(day)]?.[H.DAY_KEYS[H.weekdayIdx(day)]] || {};
      WORKOUT_PARTS.forEach(part => {
        const on = !!wd["workout_" + part.id]?.done;
        ctrl.appendChild(btn((on ? "✓ " : "") + part.label, on ? "on" : "", () => {
          applyChange(h, day, { part: part.id, on: !on }); openDetail(hid, day);
        }, { "aria-pressed": String(on) }));
      });
    } else if (h.goal.type === "check") {
      ctrl.appendChild(btn(ach ? "達成を取り消す" : "✓ 達成にする", ach ? "" : "on", () => {
        applyChange(h, day, { toggle: true }); openDetail(hid, day);
      }));
    } else if (h.goal.type === "count") {
      ctrl.appendChild(btn("−1", "", () => { applyChange(h, day, { delta: -1 }); openDetail(hid, day); }, { "aria-label": "1回減らす", ...(p ? {} : { disabled: "" }) }));
      ctrl.appendChild(btn("＋1", "on", () => { applyChange(h, day, { delta: 1 }); openDetail(hid, day); }, { "aria-label": "1回増やす" }));
    } else {
      [-5, 5, 10, 15, 30].forEach(d => ctrl.appendChild(btn((d > 0 ? "+" : "−") + Math.abs(d) + "分", d > 0 ? "" : "",
        () => { applyChange(h, day, { delta: d }); openDetail(hid, day); }, d < 0 && p <= 0 ? { disabled: "" } : {})));
      if (p < t) ctrl.appendChild(btn("目標まで", "on", () => { applyChange(h, day, { set: t }); openDetail(hid, day); }));
    }
    box.appendChild(ctrl);

    if (h.freq.type !== "weekly") {
      const rest = H.isRest(h, day, ctx);
      const lab = el("label", "check-row");
      lab.innerHTML = `<input type="checkbox" ${rest ? "checked" : ""}> この日は休む（連続記録はそのまま）`;
      lab.querySelector("input").onchange = e => { applyRest(h, day, e.target.checked); openDetail(hid, day); };
      box.appendChild(lab);
    }

    const cur = H.currentStreak(h, s.today, ctx);
    const best = H.bestStreak(h, H.addDays(s.today, -364), s.today, ctx);
    const rate = H.habitRate(h, H.addDays(s.today, -29), s.today, s.today, ctx);
    const unit = cur.unit === "w" ? "週" : "日";
    const st3 = el("div", "hb-stats3");
    st3.innerHTML = `<div><b>${cur.n}${unit}</b><span>いまの連続</span></div>
      <div><b>${best.n}${unit}</b><span>最長(1年)</span></div>
      <div><b>${rate.rate == null ? "—" : Math.round(rate.rate * 100) + "%"}</b><span>30日の達成率</span></div>`;
    box.appendChild(st3);

    const dots = el("div", "hb-dots");
    for (let i = 13; i >= 0; i--) {
      const k = H.addDays(day, -i);
      const a = H.isAchieved(h, k, ctx);
      const cls = a ? "" : H.isRest(h, k, ctx) || H.isFrozen(h, k, ctx) ? " rest"
        : h.freq.type !== "weekly" && !H.isDue(h, k) ? " off" : "";
      const d = el("span", "hb-dot" + cls); if (a) d.style.background = h.color;
      d.title = k; dots.appendChild(d);
    }
    box.appendChild(dots);
    box.appendChild(el("div", "hb-dots-lbl", "<span>2週間前</span><span>この日</span>"));
    box.appendChild(closeRow());
  });
}

function stepper(val, lo, hi, unit, onChange, step = 1) {
  const w = el("div", "hb-step");
  const inp = el("input", "field-input"); inp.type = "number"; inp.inputMode = "numeric"; inp.min = lo; inp.max = hi; inp.value = val;
  const set = n => { n = Math.min(hi, Math.max(lo, n | 0)); inp.value = n; onChange(n); };
  inp.onchange = () => set(parseInt(inp.value, 10) || lo);
  w.appendChild(btn("−", "hb-chip", () => set((parseInt(inp.value, 10) || lo) - step), { "aria-label": "減らす" }));
  w.appendChild(inp);
  w.appendChild(btn("＋", "hb-chip", () => set((parseInt(inp.value, 10) || lo) + step), { "aria-label": "増やす" }));
  w.appendChild(el("span", "", esc(unit)));
  return w;
}
function move(id, dir) {
  const list = loadState().habits;
  const vis = list.filter(h => !h.archived);
  const i = vis.findIndex(h => h.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= vis.length) return;
  const a = list.indexOf(vis[i]), b = list.indexOf(vis[j]);
  [list[a], list[b]] = [list[b], list[a]];
  saveHabits(list); render(); showToast(dir < 0 ? "上へ移動しました" : "下へ移動しました");
}

function renderTasks(v, s, day) {

function taskSub(t, today) {
  const p = T.taskProgress(t), di = !t.doneOn && T.dueInfo(t, today);
  return [di ? `<span class="td-due ${di.level}">${di.label}</span>` : "",
    t.doneOn ? "" : `🪙${t.reward}G`,
    t.doneOn ? `✓ ${esc(dayLabel(t.doneOn, today))}に完了` : "",
    p.total ? `ステップ ${p.done}/${p.total}` : "ステップなし"].filter(Boolean).join(" · ");
}
function taskBox(t, s, day) {
  const p = T.taskProgress(t), isOpen = openTaskIds.has(t.id), mark = markDay(s, day);
  const wrap = el("div", "td-tbox" + (isOpen ? " open" : ""));
  wrap.dataset.tid = t.id;

  const c = el("div", "hb-card td-task" + (t.doneOn ? " done" : ""));
  c.style.setProperty("--c", "#8fb3d9");

    <div class="hb-main"><div class="hb-name">${esc(t.name)}</div><div class="hb-sub">${taskSub(t, s.today)}</div></div>
    <span class="td-go" aria-hidden="true">${isOpen ? "⌃" : "⌄"}</span>`;
  const toggle = () => { if (isOpen) openTaskIds.delete(t.id); else openTaskIds.add(t.id); renderToday(); };
  c.onclick = toggle;
  c.onkeydown = e => { if (e.target === c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(); } };
  wrap.appendChild(c);
  if (!isOpen) return wrap;

  // ステップ: 習慣のリングと同じように丸をタップして記録する
  const body = el("div", "td-tbody");
  t.steps.forEach(st => {
    const r = el("div", "td-step" + (st.doneOn ? " done" : ""));
    const ck = btn(st.doneOn ? "✓" : "", "td-scheck", () => changeTodo(x => T.toggleStep(x, t.id, st.id, mark)),
      { "aria-label": `${st.name}を${st.doneOn ? "記録済み。タップで取り消し" : "記録"}`, "aria-pressed": String(!!st.doneOn) });
    const nm = el("span", "td-stname", `<span>${esc(st.name)}</span>` + (st.doneOn ? `<small>${esc(dayLabel(st.doneOn, s.today))}</small>` : ""));

    r.appendChild(nm);
    r.appendChild(ck);
    body.appendChild(r);
  });
  if (!t.steps.length) body.appendChild(el("p", "hb-note td-nostep", `ステップを足すと、1つ進むごとに${T.GOLD_T.step}Gもらえます。`));
  const add = el("div", "td-addstep");

  inp.enterKeyHint = "done";
  const doAdd = () => {
    if (!inp.value.trim()) return;
    refocusTask = t.id;
    changeTodo(x => T.addStep(x, t.id, inp.value));
  };
  inp.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); doAdd(); } };
  add.appendChild(inp);
  add.appendChild(btn("追加", "btn btn-secondary", doAdd));
  body.appendChild(add);
  if (mark !== s.today) body.appendChild(el("p", "hb-note", `チェックすると ${esc(dayLabel(mark, s.today))} に済ませたことになります。`));
  const foot = el("div", "td-tfoot");

    : btn("🎉 完了にする", "td-tbtn primary", () => completeTask(t, mark)));
  body.appendChild(foot);
  wrap.appendChild(body);
  return wrap;
}

// タスク完了: 保存してから演出を出す(ゴールドは実際に増えた分。8日以上前の日なら入らない)
function completeTask(t, mark) {
  const before = H.balance(loadState().reward);
  openTaskIds.delete(t.id);
  saveTodo(T.setTaskDone(loadState().todo, t.id, mark));
  render();
  const gained = H.balance(loadState().reward) - before;
  const p = T.taskProgress(t);
  const o = document.createElement("div");
  o.className = "hb-celebrate td-celebrate";
  o.innerHTML = `<div class="hb-celebrate-box" role="dialog" aria-label="タスク完了">
    <div class="hb-celebrate-ico">🏆</div>
    <div class="hb-celebrate-title">タスク完了！</div>
    <div class="hb-celebrate-sub">${esc(t.icon)} ${esc(t.name)}${p.total ? `<br>ステップ ${p.total}つを乗り越えました` : ""}</div>
    ${gained > 0 ? `<div class="hb-celebrate-gold">+${gained}G</div>` : ""}
    <div class="hb-celebrate-sub" style="margin-top:12px">タップして閉じる</div></div>`;
  o.onclick = () => o.remove();
  document.body.appendChild(o);
  if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
}

// ── クエスト掲示板 ─────────────────────────────────────────────────────────
function questBoardOf(s) {
  const books = readingBooks(s.today);
  const reading = { ...RC.questStats(books, s.today), pagesOn: k => RC.pagesOnDay(books, k), firstDay: RC.firstLogDay(books) };
  const m = Q.questMetrics({ records, log: s.log, habits: s.habits, reward: s.reward, reading, today: s.today });
  return Q.questBoard(m, s.reward, s.habits);
}
function updateQuestBadge(board) {
  const n = Q.claimableQuests(board || questBoardOf(loadState())).length;
  const t = document.querySelector('.tab-btn[data-tab="status"]');
  if (t) {
    t.classList.toggle("has-badge", n > 0);
    if (n) t.setAttribute("aria-label", `育成（受け取れるクエスト ${n}件）`); else t.removeAttribute("aria-label");
  }
  return n;
}
// 自分で付けたアイコンは8文字まで入るので、丸の中には先頭の1文字(絵文字1つ)だけ出す
const firstGlyph = s => (typeof Intl !== "undefined" && Intl.Segmenter
  ? new Intl.Segmenter().segment(String(s)).containing(0)?.segment : Array.from(String(s))[0]) || "";
const QUEST_TIER_COLORS = [["#d39a63", "#7a4a26"], ["#e4ebf3", "#7d8896"], ["#ffe39a", "#b8862f"], ["#c9b6ff", "#6a4fd0"]];
function questThumb(q) {
  const t = Math.min(q.tierIdx, q.line.tiers.length - 1);
  const [t1, t2] = QUEST_TIER_COLORS[Math.min(t, QUEST_TIER_COLORS.length - 1)];
  const pips = q.line.tiers.map((_, i) => `<i class="${i < q.tierIdx ? "on" : i === q.tierIdx ? "now" : ""}"></i>`).join("");
  return `<div class="qb-ico" aria-hidden="true" style="--t1:${t1};--t2:${t2}">
    <span class="qb-ring">${ringSvg(46, 4, q.ratio, q.claimable ? "#f0d7a3" : t1)}<b>${esc(firstGlyph(q.line.icon))}</b></span><span class="qb-pips">${pips}</span></div>`;
}
function questRow(q, onClaim) {

  row.innerHTML = `${questThumb(q)}
    <div class="qb-main"><div class="qb-title">${esc(q.title)}</div>
      <div class="qb-desc">${esc(Q.questDesc(q))}</div>
      <div class="qb-bar" role="progressbar" aria-label="${esc(q.title)}の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(q.ratio * 100)}">
        <div class="qb-fill" style="width:${(q.ratio * 100).toFixed(1)}%"></div><span>${esc(Q.progressText(q))}</span></div>
      <div class="qb-reward">報酬 ${esc(Q.rewardText(q))}</div></div>`;
  if (onClaim || !q.claimable) {

function renderQuestCard(wrap, s) {

function openQuests(seg = "active") {

    const head = el("div", "hb-sheet-head");
    head.innerHTML = `<h3 class="modal-title">📜 クエスト掲示板</h3><span class="hb-pill" aria-label="所持ゴールド">🪙 ${fmt(H.balance(s.reward))}</span>`;

    card.appendChild(row);
  });
  card.appendChild(el("p", "hb-note", "休息日・護符で守った日は分母から除いています。"));
  wrap.appendChild(card);
}

window.HabitUI = { renderToday, openDay: k => { selDay = k; stripFocus = true; }, renderRewardCard, renderHabitStats, updateQuestBadge: () => updateQuestBadge() };
if (["today", "status", "stats"].includes(tab)) render();
</script>
