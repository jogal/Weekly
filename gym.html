<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ジム⚡">
<meta name="theme-color" content="#1c0505">
<title>⚡筋トレ記録</title>
<link rel="manifest" href="gym-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#1c0505; --panel:#3a0d0d; --panel2:#4d1414; --line:#7a2020;
  --txt:#ffeede; --dim:#e0a898; --faint:#a05858;
  --bolt:#ffd93d; --bolt-dark:#8a6a00; --green:#9FE5A8;
  --shadow:#0f0202;
  color-scheme:dark;
}
html,body{ height:100%; }
body { margin:0; font-family:"DotGothic16","Hiragino Sans","Meiryo",sans-serif;
  background:var(--bg); color:var(--txt); height:100dvh; overflow:hidden;
  background-image:radial-gradient(#330b0b 1px, transparent 1px);
  background-size:10px 10px; overscroll-behavior:none; }
button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

#app { display:flex; flex-direction:column; height:100dvh; position:relative; }

/* faint giant lightning watermark */
#bolt-bg { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
#bolt-bg svg { position:absolute; right:-40px; top:10%; width:70%; height:70%; opacity:.06; }

#header { background:#160303; padding:12px 16px;
  padding-top:max(12px,env(safe-area-inset-top)); flex-shrink:0;
  border-bottom:2px solid var(--line); z-index:1; }
#app-title { margin:0; font-size:15px; font-weight:700; letter-spacing:.08em;
  color:var(--bolt); text-shadow:2px 2px 0 #4d3a00;
  display:flex; align-items:center; justify-content:space-between; }
.mini-btn { background:var(--panel2); border:2px solid var(--line); color:var(--dim);
  font-size:11px; padding:7px 12px; cursor:pointer; margin-left:6px;
  box-shadow:2px 2px 0 var(--shadow); text-shadow:none; text-decoration:none; display:inline-block; }

#content { flex:1; overflow-y:auto; padding:12px; z-index:1; -webkit-overflow-scrolling:touch; }

#tabbar { display:flex; background:#160303; border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); flex-shrink:0; z-index:1; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 0 7px; border:none; background:none; cursor:pointer;
  color:var(--faint); font-weight:400; font-size:10px; white-space:nowrap;
  border-top:3px solid transparent; min-height:52px; }
.tab-btn.active { color:var(--bolt); font-weight:700; border-top-color:var(--bolt); }
.tab-ico { font-size:19px; line-height:1; }
.tab-btn:not(.active) .tab-ico { filter:grayscale(.9) brightness(.7); }

.card { background:var(--panel); border:2px solid var(--txt);
  box-shadow:4px 4px 0 var(--shadow); margin-bottom:12px; padding:10px 12px; }
.card-title { font-size:11px; color:var(--dim); margin:0 0 8px; letter-spacing:.06em; }

/* Today header card */
#today-line { display:flex; align-items:baseline; justify-content:space-between; }
#today-date { font-size:14px; font-weight:700; }
#today-sub  { font-size:11px; color:var(--dim); }
#week-parts { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.wp-chip { font-size:10px; padding:3px 8px; border:2px solid var(--line);
  color:var(--faint); background:var(--panel2); }
.wp-chip.on { border-color:var(--bolt); color:var(--bolt); background:#3d2c00;
  box-shadow:2px 2px 0 var(--shadow); }

/* Part tabs */
#part-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px;
  scrollbar-width:none; }
#part-tabs::-webkit-scrollbar{ display:none; }
.part-tab { flex-shrink:0; padding:9px 14px; font-size:13px; cursor:pointer;
  background:var(--panel2); color:var(--dim); border:2px solid var(--line);
  box-shadow:2px 2px 0 var(--shadow); }
.part-tab.active { color:#160303; font-weight:700; border-color:var(--txt); }

/* Exercise grid */
#ex-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ex-btn { padding:13px 8px; font-size:13px; cursor:pointer; text-align:center;
  background:var(--panel2); color:var(--txt); border:2px solid var(--line);
  box-shadow:2px 2px 0 var(--shadow); min-height:48px; line-height:1.25; }
.ex-btn.active { background:#3d2c00; border-color:var(--bolt); color:var(--bolt);
  font-weight:700; }
.ex-btn.add { color:var(--faint); border-style:dashed; }
.ex-last { display:block; font-size:10px; color:var(--faint); margin-top:2px; }
.ex-btn.active .ex-last { color:var(--bolt-dark); color:#c9a52d; }

/* Input panel */
#input-card { border-color:var(--bolt); }
#sel-ex-name { font-size:15px; font-weight:700; margin:0 0 10px; color:var(--bolt);
  display:flex; justify-content:space-between; align-items:center; }
#sel-ex-part { font-size:10px; padding:2px 8px; border:2px solid currentColor; }
.stepper-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px; }
.step-btn { width:52px; min-height:52px; font-size:15px; cursor:pointer;
  background:var(--panel2); color:var(--txt); border:2px solid var(--line);
  box-shadow:2px 2px 0 var(--shadow); }
.step-btn.small { width:44px; min-height:44px; font-size:11px; color:var(--dim); }
.step-val { flex:1; text-align:center; font-size:26px; font-weight:700; cursor:pointer;
  line-height:1.1; }
.step-val small { font-size:12px; color:var(--dim); font-weight:400; }
#log-btn { width:100%; min-height:58px; font-size:18px; font-weight:700; cursor:pointer;
  background:var(--bolt); color:#160303; border:2px solid var(--txt);
  box-shadow:4px 4px 0 var(--shadow); letter-spacing:.1em; }
#log-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--shadow); }

/* Today's sets */
.set-row { display:flex; align-items:center; gap:8px; padding:8px 2px;
  border-bottom:1px dashed var(--line); font-size:13px; }
.set-row:last-child { border-bottom:none; }
.set-time { color:var(--faint); font-size:11px; width:44px; flex-shrink:0; }
.set-main { flex:1; }
.set-kg { font-weight:700; }
.set-part-dot { width:8px; height:8px; flex-shrink:0; }
.set-del { background:none; border:none; color:var(--faint); font-size:16px;
  cursor:pointer; padding:6px 8px; }
.empty-note { color:var(--faint); font-size:12px; text-align:center; padding:14px 0; }

/* History */
.h-day { margin-bottom:12px; }
.h-day-head { display:flex; justify-content:space-between; align-items:baseline;
  padding:7px 10px; background:var(--panel2); border-bottom:2px solid var(--line); }
.h-day-date { font-weight:700; font-size:13px; }
.h-day-sub { font-size:10px; color:var(--dim); }
.h-ex { padding:7px 10px; border-bottom:1px dashed var(--line); font-size:12px; }
.h-ex:last-child { border-bottom:none; }
.h-ex-name { font-weight:700; }
.h-ex-sets { color:var(--dim); margin-top:2px; }
.quest-badge { font-size:10px; color:var(--green); }

/* Toast */
#toast { display:none; position:fixed; bottom:calc(76px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%); background:#160303; color:var(--bolt);
  border:2px solid var(--bolt); padding:10px 18px; font-size:13px; z-index:50;
  box-shadow:4px 4px 0 var(--shadow); white-space:nowrap; }

/* Lightning flash on record */
#flash { display:none; position:fixed; inset:0; z-index:40; pointer-events:none;
  align-items:center; justify-content:center; }
#flash.on { display:flex; animation:flashbg .45s ease-out; }
#flash .zap { font-size:90px; animation:zappop .45s ease-out; text-shadow:0 0 30px var(--bolt); }
@keyframes flashbg { 0%{background:rgba(255,217,61,.35)} 100%{background:transparent} }
@keyframes zappop { 0%{transform:scale(.3) rotate(-15deg);opacity:1}
  60%{transform:scale(1.25) rotate(5deg)} 100%{transform:scale(1);opacity:0} }

/* Modal */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:30;
  display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box { background:var(--panel); border:2px solid var(--txt);
  box-shadow:6px 6px 0 var(--shadow); padding:16px; width:100%; max-width:340px; }
.modal-title { margin:0 0 12px; font-size:14px; color:var(--bolt); }
.menu-item { display:block; width:100%; text-align:left; background:var(--panel2);
  border:2px solid var(--line); color:var(--txt); padding:14px 12px; font-size:14px;
  cursor:pointer; margin-bottom:10px; box-shadow:2px 2px 0 var(--shadow);
  text-decoration:none; }
.btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
.btn { padding:10px 16px; font-size:13px; cursor:pointer; border:2px solid var(--txt);
  box-shadow:2px 2px 0 var(--shadow); background:var(--panel2); color:var(--txt); }
</style>
</head>
<body>
<div id="app">
  <div id="bolt-bg"><svg viewBox="0 0 100 160" fill="#ffd93d">
    <polygon points="62,0 18,78 44,78 30,160 86,60 54,60"/>
  </svg></div>
  <div id="header">
    <p id="app-title">
      ⚡ 筋トレ記録
      <span>
        <a class="mini-btn" href="tracker.html">⚔️ 週クエ</a>
        <button type="button" class="mini-btn" id="menu-open">⚙</button>
      </span>
    </p>
  </div>
  <div id="content"></div>
  <div id="tabbar">
    <button class="tab-btn active" data-tab="today"><span class="tab-ico">⚡</span>きろく</button>
    <button class="tab-btn" data-tab="history"><span class="tab-ico">📜</span>履歴</button>
  </div>
</div>

<div id="toast"></div>
<div id="flash"><span class="zap">⚡</span></div>

<!-- Settings menu -->
<div class="overlay" id="menu-modal" style="display:none">
  <div class="modal-box">
    <h3 class="modal-title">⚙ 設定</h3>
    <button type="button" class="menu-item" id="export-btn">💾 データを書き出す</button>
    <button type="button" class="menu-item" id="import-btn">📂 データを復元する</button>
    <div class="btn-row">
      <button class="btn" id="menu-close">閉じる</button>
    </div>
  </div>
</div>

<script>
// ── 部位(週間クエストと同じID体系: wt_records の workout_<id> に対応) ──────────
const PARTS = [
  {id:"chest",    label:"胸",   color:"#EF5350"},
  {id:"back",     label:"背中", color:"#E53935"},
  {id:"shoulder", label:"肩",   color:"#F44336"},
  {id:"arm",      label:"腕",   color:"#EF9A9A"},
  {id:"leg",      label:"脚",   color:"#C62828"},
  {id:"core",     label:"体幹", color:"#B71C1C"},
];
const PART_MAP = {}; PARTS.forEach(p=>PART_MAP[p.id]=p);

// ── プリセット種目(部位ごと) ─────────────────────────────────────────────────
const PRESET_EX = {
  chest:   ["ベンチプレス","ダンベルプレス","チェストフライ","腕立て伏せ"],
  back:    ["デッドリフト","ラットプルダウン","ローイング","懸垂"],
  shoulder:["ショルダープレス","サイドレイズ","リアレイズ"],
  arm:     ["アームカール","ハンマーカール","トライセプスEX"],
  leg:     ["スクワット","レッグプレス","レッグカール","カーフレイズ"],
  core:    ["プランク","クランチ","レッグレイズ","アブローラー"],
};

// ── 週間クエストと同一の週キー/曜日キー計算 ─────────────────────────────────
const DAY_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
function getWeekKey(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function dayKeyOf(date){ const d=date.getDay(); return DAY_KEYS[d===0?6:d-1]; }
function dateKeyOf(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,"0"), dd=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

// ── State ─────────────────────────────────────────────────────────────────────
// logs: [{t:ISO文字列, ex:種目名, part:部位id, kg:数値, reps:数値}]
let logs   = JSON.parse(localStorage.getItem("gym_logs")||"[]");
let lastEx = JSON.parse(localStorage.getItem("gym_last")||"{}");   // 種目名 → {kg,reps}
let custom = JSON.parse(localStorage.getItem("gym_custom")||"{}"); // 部位id → [種目名]
let sel    = JSON.parse(localStorage.getItem("gym_sel")||"null") || {part:"chest", ex:"ベンチプレス"};
let marks  = JSON.parse(localStorage.getItem("gym_marks")||"{}");  // 週クエに自動記入したキー
let stepPref=JSON.parse(localStorage.getItem("gym_stepkg")||"{}"); // 種目名 → 重量の刻み(kg)
let tab    = "today";
let kg=0, reps=10;

function persist(){
  localStorage.setItem("gym_logs",   JSON.stringify(logs));
  localStorage.setItem("gym_last",   JSON.stringify(lastEx));
  localStorage.setItem("gym_custom", JSON.stringify(custom));
  localStorage.setItem("gym_sel",    JSON.stringify(sel));
  localStorage.setItem("gym_marks",  JSON.stringify(marks));
  localStorage.setItem("gym_stepkg", JSON.stringify(stepPref));
}

// 種目ごとの重量の刻み。マシン都合で1kg単位の種目はここで切替(ラットプルは初期値1kg)
const STEP_CYCLE=[2.5,1];
function stepOf(ex){
  if(stepPref[ex]!==undefined)return stepPref[ex];
  return ex==="ラットプルダウン" ? 1 : 2.5;
}

// 選択種目の前回値を kg/reps に反映(ズボラ: 前回のままなら⚡を押すだけ)
function loadDefaults(){
  const d=lastEx[sel.ex];
  kg   = d? d.kg   : 0;
  reps = d? d.reps : 10;
}
loadDefaults();

function exListOf(part){ return [...(PRESET_EX[part]||[]), ...(custom[part]||[])]; }
function todayLogs(){ const k=dateKeyOf(new Date()); return logs.filter(l=>dateKeyOf(new Date(l.t))===k); }
function fmtKg(v){ return v===0 ? "自重" : (v+"kg"); }
function fmtTime(iso){ const d=new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function volume(list){ return list.reduce((a,l)=>a+(l.kg||0)*l.reps,0); }

// ── 週間クエスト連携 ──────────────────────────────────────────────────────────
// その日のその部位のセットから wt_records の workout_<part> を自動で「完了」にする。
// 自分で書いた記録(marksに記憶)だけを、セットが全部消えたら取り消す。
function syncQuest(part, dateObj){
  const wk=getWeekKey(dateObj), dk=dayKeyOf(dateObj), catId="workout_"+part;
  const key=wk+"|"+dk+"|"+catId;
  const dayKey=dateKeyOf(dateObj);
  const sets=logs.filter(l=>l.part===part && dateKeyOf(new Date(l.t))===dayKey)
                 .sort((a,b)=>a.t<b.t?-1:1);
  let records;
  try{ records=JSON.parse(localStorage.getItem("wt_records")||"{}"); }catch(e){ records={}; }
  records[wk]=records[wk]||{}; records[wk][dk]=records[wk][dk]||{};
  const entry=records[wk][dk][catId]||{done:false,note:"",duration:"",rating:0};
  if(sets.length){
    const first=new Date(sets[0].t), last=new Date(sets[sets.length-1].t);
    const span=Math.round((last-first)/60000);
    entry.done=true;
    entry.duration=String(Math.max(5, span+5)); // セット間の実測+前後5分ぶん
    // 手書きメモは上書きしない(⚡始まり=このアプリが書いたメモだけ更新)
    if(!entry.note || entry.note.startsWith("⚡")){
      const head=sets[sets.length-1];
      entry.note="⚡"+head.ex+" "+fmtKg(head.kg)+"×"+head.reps+" 計"+sets.length+"セット";
    }
    marks[key]=true;
  }else if(marks[key]){
    entry.done=false; entry.duration="";
    if(entry.note && entry.note.startsWith("⚡")) entry.note="";
    delete marks[key];
  }
  records[wk][dk][catId]=entry;
  localStorage.setItem("wt_records", JSON.stringify(records));
}

// ── 記録・削除 ────────────────────────────────────────────────────────────────
function addSet(){
  const now=new Date();
  logs.push({t:now.toISOString(), ex:sel.ex, part:sel.part, kg, reps});
  lastEx[sel.ex]={kg,reps};
  syncQuest(sel.part, now);
  persist();
  flash();
  showToast("⚡ "+sel.ex+" "+fmtKg(kg)+"×"+reps+" 記録!(週クエ反映)");
  render();
}
function delSet(iso){
  const i=logs.findIndex(l=>l.t===iso);
  if(i<0)return;
  const [removed]=logs.splice(i,1);
  syncQuest(removed.part, new Date(removed.t));
  persist();
  render();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.style.display="none",2000);
}
function flash(){
  const f=document.getElementById("flash");
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  setTimeout(()=>f.classList.remove("on"),500);
  if(navigator.vibrate) navigator.vibrate(30);
}

// 長押しで連打できるステッパーボタン
function stepBtn(label, cls, fn){
  const b=el("button","step-btn"+(cls?" "+cls:""),label);
  let tm=null, iv=null;
  const start=e=>{ e.preventDefault(); fn(); tm=setTimeout(()=>{ iv=setInterval(fn,110); },450); };
  const stop=()=>{ clearTimeout(tm); clearInterval(iv); tm=iv=null; };
  b.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
  return b;
}

// ── 画面: きろく ──────────────────────────────────────────────────────────────
function renderToday(root){
  const now=new Date();
  const tl=todayLogs();

  // 今日カード: 日付は自動、今週やった部位がチップで光る
  const head=el("div","card");
  const wd=["日","月","火","水","木","金","土"][now.getDay()];
  head.appendChild(el("div","", `<div id="today-line">
    <span id="today-date">${now.getMonth()+1}/${now.getDate()}(${wd})</span>
    <span id="today-sub">今日 ${tl.length}セット / ${volume(tl)}kg挙上</span>
  </div>`));
  const wk=getWeekKey(now);
  const weekSet=new Set(logs.filter(l=>getWeekKey(new Date(l.t))===wk).map(l=>l.part));
  const chips=el("div","");
  chips.id="week-parts";
  PARTS.forEach(p=>{
    chips.appendChild(el("span","wp-chip"+(weekSet.has(p.id)?" on":""),
      (weekSet.has(p.id)?"⚡":"")+p.label));
  });
  head.appendChild(chips);
  root.appendChild(head);

  // 部位タブ
  const tabs=el("div"); tabs.id="part-tabs";
  PARTS.forEach(p=>{
    const b=el("button","part-tab"+(p.id===sel.part?" active":""),p.label);
    if(p.id===sel.part) b.style.background=p.color;
    b.onclick=()=>{
      sel.part=p.id;
      const list=exListOf(p.id);
      if(!list.includes(sel.ex)){
        // その部位で前回使った種目を優先、なければ先頭
        const lastUsed=[...logs].reverse().find(l=>l.part===p.id && list.includes(l.ex));
        sel.ex=lastUsed? lastUsed.ex : list[0];
      }
      loadDefaults(); persist(); render();
    };
    tabs.appendChild(b);
  });
  root.appendChild(tabs);

  // 種目グリッド(前回値を小さく表示)
  const grid=el("div"); grid.id="ex-grid";
  exListOf(sel.part).forEach(name=>{
    const d=lastEx[name];
    const b=el("button","ex-btn"+(name===sel.ex?" active":""),
      esc(name)+(d?`<span class="ex-last">前回 ${fmtKg(d.kg)}×${d.reps}</span>`:""));
    b.onclick=()=>{ sel.ex=name; loadDefaults(); persist(); render(); };
    grid.appendChild(b);
  });
  const addB=el("button","ex-btn add","＋ 種目を追加");
  addB.onclick=()=>{
    const name=prompt("種目名を入力");
    if(!name||!name.trim())return;
    const n=name.trim();
    if(exListOf(sel.part).includes(n)){ showToast("もうあるよ"); return; }
    (custom[sel.part]=custom[sel.part]||[]).push(n);
    sel.ex=n; loadDefaults(); persist(); render();
  };
  grid.appendChild(addB);
  root.appendChild(grid);

  // 入力パネル
  const part=PART_MAP[sel.part];
  const step=stepOf(sel.ex);
  const card=el("div","card"); card.id="input-card"; card.style.marginTop="12px";
  const title=el("p","", `${esc(sel.ex)} <span id="sel-ex-part" style="color:${part.color}">${part.label}</span>`);
  title.id="sel-ex-name";
  // 刻み切替(2.5kg⇔1kg): マシンのプレート単位に合わせる
  const stepTgl=el("button","mini-btn",`刻み ${step}kg`);
  stepTgl.style.marginLeft="auto"; stepTgl.style.marginRight="8px";
  stepTgl.onclick=()=>{
    const i=STEP_CYCLE.indexOf(step);
    stepPref[sel.ex]=STEP_CYCLE[(i+1)%STEP_CYCLE.length];
    persist(); render();
  };
  title.insertBefore(stepTgl, title.querySelector("#sel-ex-part"));
  card.appendChild(title);

  // 重量: −10 / −刻み / 値 / +刻み / +10 (0で自重)
  const wRow=el("div","stepper-row");
  const wVal=el("div","step-val");
  const updW=()=>{ wVal.innerHTML=(kg===0?"自重":kg)+" <small>kg</small>"; };
  wRow.appendChild(stepBtn("-10","small",()=>{kg=Math.max(0,kg-10);updW();}));
  wRow.appendChild(stepBtn("-"+step,"",()=>{kg=Math.max(0,Math.round((kg-step)*10)/10);updW();}));
  wRow.appendChild(wVal);
  wRow.appendChild(stepBtn("+"+step,"",()=>{kg=Math.round((kg+step)*10)/10;updW();}));
  wRow.appendChild(stepBtn("+10","small",()=>{kg+=10;updW();}));
  wVal.onclick=()=>{
    const v=prompt("重量(kg) ※自重は0",String(kg));
    if(v===null)return;
    const n=parseFloat(v);
    if(!isNaN(n)&&n>=0){ kg=Math.round(n*10)/10; updW(); }
  };
  updW();
  card.appendChild(wRow);

  // 回数: −1 / 値 / +1
  const rRow=el("div","stepper-row");
  const rVal=el("div","step-val");
  const updR=()=>{ rVal.innerHTML=reps+" <small>回</small>"; };
  rRow.appendChild(stepBtn("-1","",()=>{reps=Math.max(1,reps-1);updR();}));
  rRow.appendChild(rVal);
  rRow.appendChild(stepBtn("+1","",()=>{reps++;updR();}));
  rVal.onclick=()=>{
    const v=prompt("回数",String(reps));
    if(v===null)return;
    const n=parseInt(v);
    if(!isNaN(n)&&n>=1){ reps=n; updR(); }
  };
  updR();
  card.appendChild(rRow);

  const logB=el("button","", "⚡ 記録する");
  logB.id="log-btn";
  logB.onclick=addSet;
  card.appendChild(logB);
  root.appendChild(card);

  // 今日のセット一覧
  const list=el("div","card");
  list.appendChild(el("p","card-title","📋 今日のセット(時刻は自動記録)"));
  if(!tl.length){
    list.appendChild(el("div","empty-note","まだナシ。⚡を押すだけで日付も時刻も勝手に付くよ"));
  }else{
    [...tl].reverse().forEach(l=>{
      const p=PART_MAP[l.part]||PARTS[0];
      const row=el("div","set-row");
      row.appendChild(el("span","set-time",fmtTime(l.t)));
      const dot=el("span","set-part-dot"); dot.style.background=p.color;
      row.appendChild(dot);
      row.appendChild(el("span","set-main",
        `${esc(l.ex)} <span class="set-kg">${fmtKg(l.kg)}×${l.reps}</span>`));
      const del=el("button","set-del","✕");
      del.onclick=()=>{ if(confirm("このセットを消す?")) delSet(l.t); };
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  root.appendChild(list);
}

// ── 画面: 履歴 ────────────────────────────────────────────────────────────────
function renderHistory(root){
  if(!logs.length){
    const c=el("div","card");
    c.appendChild(el("div","empty-note","履歴はまだナシ。今日から始めよう⚡"));
    root.appendChild(c);
    return;
  }
  // 日付ごとにまとめて新しい順に
  const byDay={};
  logs.forEach(l=>{
    const k=dateKeyOf(new Date(l.t));
    (byDay[k]=byDay[k]||[]).push(l);
  });
  Object.keys(byDay).sort().reverse().forEach(dk=>{
    const list=byDay[dk].sort((a,b)=>a.t<b.t?-1:1);
    const d=new Date(dk+"T00:00:00");
    const wd=["日","月","火","水","木","金","土"][d.getDay()];
    const card=el("div","card h-day"); card.style.padding="0";
    const parts=[...new Set(list.map(l=>l.part))]
      .map(id=>PART_MAP[id]?.label||id).join("・");
    card.appendChild(el("div","h-day-head",
      `<span class="h-day-date">${d.getMonth()+1}/${d.getDate()}(${wd}) <span class="quest-badge">${esc(parts)}</span></span>
       <span class="h-day-sub">${list.length}セット / ${volume(list)}kg</span>`));
    // 種目ごとにまとめる
    const byEx={};
    list.forEach(l=>{ (byEx[l.ex]=byEx[l.ex]||[]).push(l); });
    Object.keys(byEx).forEach(ex=>{
      const sets=byEx[ex];
      const p=PART_MAP[sets[0].part];
      card.appendChild(el("div","h-ex",
        `<span class="h-ex-name" style="color:${p?.color||"#fff"}">${esc(ex)}</span>
         <div class="h-ex-sets">${sets.map(s=>`${fmtKg(s.kg)}×${s.reps}`).join(", ")}</div>`));
    });
    root.appendChild(card);
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById("content");
  root.innerHTML="";
  if(tab==="today") renderToday(root);
  else renderHistory(root);
}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tab-btn");
  if(!b)return;
  tab=b.dataset.tab;
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

// ── 設定(バックアップ) ────────────────────────────────────────────────────────
document.getElementById("menu-open").onclick=()=>document.getElementById("menu-modal").style.display="flex";
document.getElementById("menu-close").onclick=()=>document.getElementById("menu-modal").style.display="none";
document.getElementById("menu-modal").addEventListener("click",e=>{
  if(e.target===e.currentTarget) e.currentTarget.style.display="none";
});
document.getElementById("export-btn").onclick=()=>{
  const data={gym_logs:logs, gym_last:lastEx, gym_custom:custom, gym_marks:marks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gym-log-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById("menu-modal").style.display="none";
};
document.getElementById("import-btn").onclick=()=>{
  const input=document.createElement("input");
  input.type="file"; input.accept="application/json";
  input.onchange=()=>{
    const f=input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.gym_logs)) throw new Error("bad");
        logs=d.gym_logs; lastEx=d.gym_last||{}; custom=d.gym_custom||{}; marks=d.gym_marks||{};
        persist(); render();
        showToast("✅ 復元しました");
      }catch(e){ showToast("❌ 読み込めなかった…"); }
    };
    r.readAsText(f);
  };
  input.click();
  document.getElementById("menu-modal").style.display="none";
};

// ── PWA service worker ────────────────────────────────────────────────────────
if("serviceWorker" in navigator&&location.protocol==="https:")
  navigator.serviceWorker.register("./sw.js").catch(()=>{});

// 日付が変わったら「今日」を描き直す(開きっぱなし対策)
let lastDay=dateKeyOf(new Date());
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && dateKeyOf(new Date())!==lastDay){
    lastDay=dateKeyOf(new Date());
    render();
  }
});

render();
</script>
</body>
</html>
